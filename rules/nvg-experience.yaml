# ═══════════════════════════════════════════════════════════════════════════════
#  KINH NGHIỆM NGHỀ CỦA NHÀ VIỆT GROUP — KHÔNG PHẢI QUY CHUẨN
# ═══════════════════════════════════════════════════════════════════════════════
#
#  Tệp này gom 23 quy tắc mà Phòng Thiết kế NVG tự đặt ra, tách khỏi quy chuẩn
#  quốc gia. Trước ngày 09/09/2026 chúng nằm lẫn trong `rules/base/` cùng
#  QCVN 01:2021/BXD và TCVN 4451:2012, nên một cảnh báo «dưới mức tối thiểu»
#  hiện lên màn hình mà không ai phân biệt được đó là luật hay là thói quen.
#
#  ⚠️ KHÔNG một dòng nào ở đây là văn bản pháp quy. Vi phạm chúng KHÔNG sai luật.
#     Chúng là cách NVG quen làm, và có thể sai với một đầu bài cụ thể.
#
#  Ai đọc tệp này: kiến trúc sư NVG. Mỗi con số nên trả lời được câu hỏi
#  «vì sao lại là con số này», và nếu không trả lời được thì nên sửa hoặc bỏ.
#
#  Cách dùng: gói này BẬT/TẮT được ngay trên màn hình thiết kế. Kỹ sư chọn có
#  áp nó hay không cho từng hồ sơ.
#
#  Gói:      nvg_experience
#  Phiên bản: 2026.09.1
#  Phạm vi:  mọi địa phương
#  Số quy tắc: 23, tất cả ở mức cảnh báo
#
#  Mức của mọi quy tắc ở đây là `warning` — theo quy ước đã ghi trong
#  `rules/base/40-vertical.yaml`: chỉ quy tắc có nguồn là văn bản pháp quy mới
#  được đặt mức `error`.
#
#  Ba con số ở phần «kích thước tối thiểu» nghi ngờ nhất, cần soát trước:
#    · phòng khách 14 m² và phòng ngủ chính 14 m² — bằng nhau, có chủ ý không?
#    · giếng trời tối đa 8 m² — quy tắc này khai sai mã phòng (`lightwell`
#      thay vì `light_well`) nên CHƯA TỪNG chạy lần nào. Xem mục Vướng mắc
#      trong TIEN_DO_THIET_KE.html.
# ═══════════════════════════════════════════════════════════════════════════════

