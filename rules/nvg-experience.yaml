#  Số quy tắc: 31, tất cả ở mức `warning`
#
#  ⚠️ KHÔNG một dòng nào ở đây là văn bản pháp quy. Vi phạm chúng KHÔNG sai luật.
#
#  Từ 12/09/2026 (T30) đây là GÓI QUY TẮC DUY NHẤT của nhánh AI: gói pháp quy
#  (`rules/base/`) đã bị gỡ khỏi đường đọc của nhánh này. Lý do không phải «quy
#  chuẩn không quan trọng» mà là chứng cứ không kiểm được — 14 quy tắc ghi nguồn
#  QCVN mà không kèm một số mục nào, 4 quy tắc còn lại là TCVN (tiêu chuẩn TỰ
#  NGUYỆN). Chi tiết ở `workers/src/design/rules/rule-pack-data.ts`.
#  → Hệ quả phải nhớ: màn hình nay NÓI RA rằng không kiểm quy chuẩn
#    (`AI_DISCLAIMERS.noCodeCheck`). Im lặng đọc thành «đã kiểm và đạt».
#
#  ── XUẤT XỨ CỦA TỪNG CON SỐ, ĐỌC ĐƯỢC BẰNG MÁY ───────────────────────────────
#
#  Mỗi quy tắc BẮT BUỘC khai `n` = số mặt bằng đỡ cho con số ấy:
#    · `n: 0`       — chưa ai đo. Mặc định của team, chưa có kiến trúc sư soát.
#    · `n: 1…6`     — đo trên hồ sơ thật, kèm `khoang_quan_sat` và `n_du_an`.
#  Hiện: **16 quy tắc có số đo**, 15 quy tắc `n: 0`.
#
#  ⚠️ n tối đa là 6 và n theo dự án tối đa là 2. CLAUDE.md 8.8 điểm 7 đòi **n ≥ 15**
#     mới được gọi là ĐỊNH MỨC. Nên mọi con số ở đây là CHỈ DẤU, và T31 buộc hiện
#     `n` lên màn hình thay vì chỉ ghi trong tệp này. Có phép thử canh rằng không
#     quy tắc nào khai n ≥ 15 mà chưa bổ sung hồ sơ.
#
#  ── ĐIỀU KIỆN THÊM LẠI MỘT QUY TẮC PHÁP QUY (T34, 12/09/2026) ─────────────────
#
#  Quy tắc mức `error` chỉ được viết khi có ĐỦ BỐN thứ:
#    1. số hiệu văn bản  2. SỐ MỤC trong văn bản
#    3. `xac_minh`: đã kiểm bằng cách nào
#    4. `hieu_luc_tu` / `hieu_luc_den`
#  và **bản văn bản phải có trong repo**. Thiếu một trong bốn thì nó thuộc tệp này,
#  mức `warning`. Rào chắn này tồn tại vì 18 quy tắc cũ đã vào repo đúng theo cách
#  không ai kiểm được, và không ai thấy là chưa kiểm.
#
#  Ai đọc tệp này: kiến trúc sư NVG. Mỗi con số nên trả lời được «vì sao là con số
#  này»; không trả lời được thì nên sửa hoặc bỏ.
#
#  Nguồn số đo: 2 dự án NVO đã xây, 6 mặt bằng độc lập (P1 nhà vườn 2 tầng 03/2026;
#  P2 liền kề 5 tầng 08/2026). Phân tích đầy đủ ở
#  `~/Documents/Doc/NVG/design/mat_bang_cong_nang/`.
#
#  22/09/2026 — thêm 4 hồ sơ nữa (HS-03…HS-06), đo 10 tờ mặt bằng. Đợt ấy tập trung vào
#  CẦU THANG, BẬC TAM CẤP và CỐT CAO ĐỘ, nên chỉ một quy tắc ở đây đổi (`stair_not_facing_entry`,
#  n: 0 → 2). Diện tích và bề rộng phòng KHÔNG đổi: bốn hồ sơ mới chỉ có nhãn diện tích ghi sẵn,
#  còn mọi con số trong tệp này đo TỪ ĐA GIÁC. Trộn hai cách đo là làm hỏng chính khoảng quan sát
#  đã có. Báo cáo: `doc/design/13-ho-so-thuc-te.md` mục 13.16.
