# Gói quy tắc địa phương — Thái Bình và các tỉnh lân cận.
#
# ⚠️ Sau sắp xếp đơn vị hành chính 2025, Thái Bình đã sáp nhập vào tỉnh Hưng Yên.
#    Tên gói và văn bản quy hoạch nào đang có hiệu lực: câu hỏi Q-8, chờ Haan xác nhận.
#    Giữ mã `thai_binh` vì đó là cách Phòng Thiết kế đang gọi.
#
# Gói này CỐ Ý MỎNG. Nó chỉ ghi đè chỗ thực tế địa phương khác quy chuẩn quốc gia.
# Quy tắc không có ở đây thì lấy từ gói `base`.
pack:
  id: thai-binh
  version: '2026.08.1'
  locality: thai_binh
  extends: base
  description: >-
    Khoảng lùi và mật độ xây dựng theo quy hoạch địa phương. Hiện dùng giá trị của
    QCVN 01:2021/BXD làm mặc định cho tới khi có văn bản quy hoạch địa phương cụ thể.
