#  ĐO TRÊN HỒ SƠ THẬT CỦA NVG — gói RIÊNG của nhánh AI
# ═══════════════════════════════════════════════════════════════════════════════
#
#  Gói:       nvg_measured
#  Phiên bản: 2026.09.1
#  Thêm:      12/09/2026
#  Số quy tắc: 8, tất cả mức `warning`
#
#  ── VÌ SAO LÀ MỘT TỆP RIÊNG, KHÔNG GỘP VÀO `nvg-experience.yaml` ──────────────
#
#  Vì `nvg-experience.yaml` được ĐỌC BỞI CẢ HAI nhánh: nhánh AI qua
#  `nvgExperiencePack()`, và BỘ GIẢI nội bộ qua `rulePackFor()` (gộp với
#  `rules/base/`). Tệp này chỉ nhánh AI đọc.
#
#  Chuyện đã xảy ra thật khi thử gộp (12/09/2026): thêm `room_min_area_wc: 3.0`
#  nâng mức tối thiểu của khu vệ sinh trong khâu chia diện tích của BỘ GIẢI từ
#  2,4 m² (`kb/space_norms.yaml`) lên 3,0. Trên lô nhà phố 3,5 × 12 m, +0,6 m²
#  mỗi WC làm thang bộ tụt xuống đúng mức sàn 4 m² và bếp xuống dưới mức hợp lý —
#  `program-plausibility.test.ts` đỏ 4 phép thử. Không phải lỗi của phép đo: lô
#  ấy chật thật. Nhưng **re-tune bộ giải là một quyết định riêng, có nghiệm thu
#  riêng**, không phải hệ quả phụ của một đợt sửa gói quy tắc nhánh AI — nhất là
#  khi bộ giải đã nằm trong diện xoá và T10 đòi 1.211 phép thử của nó đứng yên.
#
#  Đáng ghi thêm: con số 2,4 m² trong `space_norms.yaml` CÙNG XUẤT XỨ với quy tắc
#  `min_area_wc` của TCVN 4451:2012 vừa bị gỡ khỏi `rules/base/` (T30) — cùng một
#  con số, cùng một chỗ không kiểm được. Nên 3,0 m² đo trên 5 khu vệ sinh thật là
#  chứng cứ TỐT HƠN. Ngày nào bộ giải được re-tune, đây là chỗ lấy số.
#
#  ── n ────────────────────────────────────────────────────────────────────────
#  Nguồn: 2 dự án NVO đã xây, 6 mặt bằng độc lập (P1 nhà vườn 2 tầng 03/2026;
#  P2 liền kề 5 tầng 08/2026). Phân tích ở
#  `~/Documents/Doc/NVG/design/mat_bang_cong_nang/`.
#
#  ⚠️ n tối đa 6, n theo dự án tối đa 2. CLAUDE.md 8.8 điểm 7 đòi n ≥ 15 mới là
#     ĐỊNH MỨC. Mọi con số ở đây là CHỈ DẤU.
#
#  Chỉ khai những vị từ bộ đối chiếu ĐO ĐƯỢC: `min_dimension`, `min_area`,
#  `max_area`, `aspect_ratio_max`. Các quan hệ đo được khác (đi xuyên phòng ngủ,
#  WC thẳng trục đứng, hộp kỹ thuật liên tục, tỷ lệ giao thông, lấy sáng theo loại
#  nhà) CỐ Ý không khai thành quy tắc — chúng là TIÊU CHÍ CHẤM ĐIỂM (C1, E2, E4,
#  C2, D1). Khai hai chỗ là hai bản thực thi của cùng phép đo, và chúng sẽ lệch.
# ═══════════════════════════════════════════════════════════════════════════════

