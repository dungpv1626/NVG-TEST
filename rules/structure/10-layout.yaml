# Ràng buộc bố cục — mức `error` vì vi phạm là ra một ngôi nhà không dùng được, không phải vì
# một văn bản nào bắt buộc. Nguồn ghi `nguyên lý bố cục` để trình kiểm rule pack phân loại được
# (`compute/src/design_compute/rules/model.py::STRUCTURE_SOURCE`).

# Lõi thang trùng khít ở mọi tầng — vế thang tầng dưới phải dẫn lên đúng chỗ vế thang tầng trên.
- id: stair_alignment
  applies_to: [nha_pho, biet_thu, nha_vuon]
  scope: building
  predicate: aligned_across_floors
  target: core
  tolerance_m: 0.0
  severity: error
  source: 'nguyên lý bố cục'
  auto_repair: none

# Hộp kỹ thuật (ống đứng) thẳng hàng qua các tầng.
- id: shaft_alignment
  applies_to: [nha_pho, biet_thu, nha_vuon]
  scope: building
  predicate: aligned_across_floors
  target: shaft
  tolerance_m: 0.0
  severity: error
  source: 'nguyên lý bố cục'
  auto_repair: none

# Mọi phòng đi vào được — qua hành lang, hoặc qua phòng mẹ với khu vệ sinh khép kín.
- id: every_room_requires_access
  applies_to: [nha_pho, biet_thu, nha_vuon]
  scope: floor
  predicate: requires_access
  target: all
  severity: error
  source: 'nguyên lý bố cục'
  auto_repair: none
