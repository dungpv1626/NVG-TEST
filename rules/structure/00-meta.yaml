# Gói NGUYÊN LÝ BỐ CỤC của bộ giải nội bộ — KHÔNG phải văn bản pháp quy.
#
# Thay `rules/base/` từ 13/09/2026 — Haan: «bỏ quy chuẩn VN đi», áp cho toàn bộ bộ giải. Gói
# `base` cũ trộn hai thứ dưới cùng nhãn QCVN:
#
#  · ngưỡng PHÁP QUY — khoảng lùi, mật độ xây dựng, diện tích và kích thước tối thiểu, bắt buộc
#    lấy sáng, lưới 100 mm. ĐÃ BỎ. Khoảng lùi và mật độ nay chỉ lấy từ đầu bài; diện tích tối
#    thiểu từ đầu bài và chuẩn nghề (`kb/space_norms.yaml`, `rules/nvg-experience.yaml`).
#  · ràng buộc BỐ CỤC mà không có thì bộ giải không ra một ngôi nhà dùng được — thang và hộp kỹ
#    thuật thẳng hàng qua các tầng, phòng nào cũng có lối vào. GIỮ, ở đây, dưới đúng tên của nó.
#
# Tuân thủ pháp lý là việc của người có chứng chỉ hành nghề ký (CLAUDE.md 8.2 nguyên tắc 9).
pack:
  id: structure
  version: '2026.09.1'
  locality: null # null = áp dụng mọi nơi
  description: >-
    Nguyên lý bố cục của bộ giải: thang và hộp kỹ thuật thẳng hàng giữa các tầng, mọi phòng có
    lối vào. Không chứa ngưỡng pháp quy nào — khoảng lùi và mật độ lấy từ đầu bài.
