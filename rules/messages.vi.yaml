# Mẫu câu thông báo cho người dùng, tra theo rule_id.
#
# Sinh từ mẫu câu, KHÔNG gọi mô hình ngôn ngữ: tất định, rẻ, dịch được, và không bịa.
# Văn phong theo CGD 4: không đại từ nhân xưng, không emoji, không viết hoa để nhấn mạnh.
# Lỗi = [việc gì không thực hiện được] + [vì sao / cần làm gì].

templates:
  corridor_min_width: 'Hành lang {room} chỉ còn {actual} m, tối thiểu {required} m.'
  stair_min_width: 'Vế thang chỉ còn {actual} m, tối thiểu {required} m.'
  room_min_dimension_bedroom: '{room} có cạnh nhỏ nhất {actual} m, tối thiểu {required} m.'
  min_area: '{room} chỉ đạt {actual} m², yêu cầu tối thiểu {required} m².'
  max_area: '{room} đạt {actual} m², vượt mức tối đa {required} m².'
  lightwell_max_area: 'Giếng trời rộng {actual} m², vượt mức {required} m² — phần sàn chưa phòng nào nhận đang dồn vào khoảng rỗng.'
  aspect_ratio_max: '{room} có tỉ lệ dài trên rộng {actual}, vượt mức {required}.'
  requires_daylight: '{room} không tiếp giáp mặt thoáng nên không lấy được sáng tự nhiên.'
  requires_access: '{room} chưa có lối vào.'
  min_dimension: '{room} có cạnh nhỏ nhất {actual} m, tối thiểu {required} m.'
  requires_face: '{room} không tiếp giáp mặt nào của công trình theo yêu cầu.'
  garage_on_access_face: 'Chỗ để xe không giáp mặt vào được nên xe phải đi xuyên phòng khác.'
  outdoor_on_open_face: '{room} nằm lọt giữa nhà, không tiếp giáp mặt thoáng nào.'
  adjacency_adjacent: '{a} và {b} cần liền kề nhau.'
  adjacency_separate: '{a} và {b} không nên đặt cạnh nhau.'
  floor_preference_top: '{room} đang ở tầng {actual}, nên đặt ở tầng trên cùng.'
  floor_preference_ground: '{room} đang ở tầng {actual}, cần đặt ở tầng trệt.'
  stair_faces_entry: '{room} nằm thẳng trục cửa chính: bước vào nhà là gặp ngay chân thang.'
  aligned_across_floors: '{target} lệch {actual} m giữa các tầng, yêu cầu thẳng hàng.'
  setback: 'Khoảng lùi phía {side} chỉ còn {actual} m, tối thiểu {required} m.'
  max_density: 'Mật độ xây dựng {actual}, vượt mức tối đa {required}.'
  module_multiple: 'Kích thước {actual} m không phải bội số của module {required} m.'

