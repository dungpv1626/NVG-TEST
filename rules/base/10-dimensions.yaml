# ── Cạnh nhỏ nhất của các phòng còn lại ────────────────────────────────────────────────
# Thêm 06/09/2026 sau khi đo trên chính bản vẽ demo: vệ sinh 4,10 × 1,00 m · kho 4,10 × 1,00 m
# · giặt 0,60 × 8,30 m · ban công 0,40 × 9,00 m. Cả bốn đều HỢP LỆ theo bộ quy tắc cũ, vì
# `min_dimension` khi đó chỉ khai cho hành lang, thang và phòng ngủ — một khu vệ sinh thoả
# `min_area_wc` 2,4 m² bằng một dải rộng đúng một mét mà không quy tắc nào chặn.
#
# Các con số dưới đây là MẶC ĐỊNH CỦA TEAM, chưa có kiến trúc sư NVG soát (Q-29) — nên nguồn
# ghi là kinh nghiệm và mức là cảnh báo, đúng ranh giới ở `rules/README.md`. Chúng vào hàm
# mục tiêu của bộ giải chứ không chặn phát hành.

