# Định tuyến mô hình ngôn ngữ cho Module Thiết kế AI.
#
# Nguồn: doc/design/05-tech-stack.md mục 5.6, doc/design/01-overview.md mục 1.5.
#
# Nguyên tắc: TÊN MÔ HÌNH KHÔNG BAO GIỜ LÀ HẰNG SỐ TRONG MÃ NGUỒN. Đổi nhà cung cấp hoặc
# đổi mô hình là sửa tệp này, không sửa code.
#
# `max_data_class` là hạng dữ liệu NHẠY CẢM NHẤT mà đầu ra này được phép nhận.
#
# ⚠️ Đọc ngược với trực giác: số NHỎ = nhạy cảm HƠN. Đầu ra khai `1` nhận được cả ba hạng;
# đầu ra khai `3` chỉ nhận hạng 3. Tên trường lấy nguyên từ tài liệu đặc tả để không sinh
# ra từ vựng thứ hai.
#
#   1 — Nhạy cảm: thông tin khách hàng, đầu bài, hợp đồng, dự toán, liên hệ.
#       CHỈ dịch vụ có cam kết không lưu trữ VÀ không huấn luyện.
#   2 — Trung bình: mặt bằng kích thước thật, bản vẽ kỹ thuật, mô hình ba chiều.
#       Chỉ dịch vụ có cam kết không lưu trữ.
#   3 — Thấp: ảnh khối, bản đồ độ sâu, mô tả phong cách.
#
# Lời gọi mang `data_class` NHỎ HƠN `max_data_class` (tức nhạy cảm hơn mức cho phép) bị lớp
# chặn từ chối trước khi ra mạng (`workers/src/design/llm/router.ts`).
#
# ⚠️ GÓI MIỄN PHÍ: gói Gemini miễn phí có thể được Google dùng để cải thiện sản phẩm
# (CLAUDE.md 5.1, quyết định T8), và Pollinations không có cam kết lưu trữ — nên mọi đầu ra
# `layer*`/`kb_*`/`site_*` dưới đây đặt `max_data_class: 3` (mức CHẶT NHẤT, chỉ nhận dữ liệu
# giả lập hoặc đã ẩn danh), trừ một ngoại lệ tạm có ghi tên. HẠ con số này là nới lỏng, và
# không được làm khi chưa có cam kết bằng văn bản của nhà cung cấp.
#
# ✅ NHÁNH AI (quyết định T12, 08/09/2026): các tuyến `ai_text_*` và `ai_image_*` dùng API TRẢ
# PHÍ của OpenAI, Google và Anthropic — cả ba cam kết không huấn luyện trên dữ liệu gửi qua
# API. Đó là căn cứ để chúng đặt `max_data_class: 2`: nhận đầu bài + khảo sát đã LƯỢC DANH
# TÍNH (tên, điện thoại, địa chỉ, mã hồ sơ, ngân sách) nhưng còn kích thước thật và chữ tự do
# (hợp đồng `contracts/ai-brief-digest.schema.json`, hàm `brief/anonymise.ts`). KHÔNG hạ tiếp
# xuống 1: danh tính khách không có lý do gì để đi ra ngoài.
#
# ⚠️ Chính sách bám vào KHOÁ, không bám vào lời hứa: Google dùng cùng một API cho gói miễn phí
# lẫn gói trả phí, nên hai tuyến Gemini của nhánh AI khai nhà cung cấp RIÊNG `gemini_paid` với
# secret riêng `GEMINI_PAID_API_KEY`. Khoá `GEMINI_API_KEY` (gói miễn phí, các tuyến hạng 3)
# không bao giờ được router cấp cho tuyến hạng 2 — rà soát 08/09/2026 bắt được chỗ hai tuyến
# này từng dùng chung khoá miễn phí.
#
# `label` là chữ hiện trên ô chọn model của trang thiết kế (T10); `pricing` là giá niêm yết
# để tính cột chi phí trong `design_ai_call` — cả hai là DỮ LIỆU, sửa ở đây khi giá đổi.

version: '1.1.0'

# Khoá API đã có (kiểm chứng 29/08/2026 bằng lời gọi thật, prompt không mang dữ liệu NVG).
#
# ⚠️ Ba điều đo được hôm đó, ghi lại để không phải dò lại:
#
#  1. `gemini-2.5-pro` trả 404 "no longer available to new users" — không phải lỗi khoá.
#     Google đã đóng mô hình này với khoá mới lập.
#  2. Khoá hiện tại KHÔNG có hạn mức cho nhóm `pro`: `gemini-pro-latest` trả 429 "exceeded
#     your current quota". Đây là dấu hiệu gói MIỄN PHÍ, khớp với quyết định T8 — nên
#     `max_data_class: 3` ở dưới giữ nguyên, KHÔNG hạ.
#  3. Nhóm `flash` chạy tốt, kể cả đầu ra JSON có lược đồ (`responseSchema`) — thứ mà mọi
#     đầu ra dưới đây đều cần.

routes:
  layer1_brief:
    provider: gemini
    model: gemini-2.5-flash
    max_data_class: 3
    enabled: true
    purpose: Kiểm tra đầy đủ và nhất quán của đầu bài, chấm completeness_score.

  layer2_program:
    provider: gemini
    model: gemini-2.5-flash
    max_data_class: 3
    enabled: true
    purpose: Sinh chương trình không gian từ đầu bài + thống kê thực nghiệm.

  layer3_intent:
    provider: gemini
    model: gemini-2.5-flash
    max_data_class: 3
    enabled: true
    purpose: Sinh cây chia không gian (LayoutIntent). KHÔNG sinh toạ độ hay kích thước.

  # Đầu ra dự phòng khi `layer3_intent` sinh ra cấu trúc không hợp lệ nhiều lần liên tiếp.
  #
  # ⚠️ ĐANG TẮT, và đây là trạng thái ĐÚNG chứ không phải việc còn bỏ dở: khoá gói miễn phí
  # không có hạn mức cho nhóm `pro` (điểm 2 ở trên). Để `enabled: true` thì lần dự phòng nào
  # cũng ăn 429 — tức là thay một lỗi đọc được ("sinh sai cấu trúc") bằng một lỗi khó hiểu
  # ("hết hạn mức"). Bật lại đúng lúc nâng gói, không sớm hơn.
  layer3_intent_hard:
    provider: gemini
    model: gemini-3.1-pro-preview
    max_data_class: 3
    enabled: false
    purpose: Phương án khó — nhiều cánh, đất không vuông vắn.

  layer4_facade:
    provider: gemini
    model: gemini-2.5-flash
    max_data_class: 3
    enabled: true
    purpose: Chọn tham số mặt đứng theo phong cách.

  kb_label_normalize:
    provider: gemini
    model: gemini-2.5-flash
    max_data_class: 3
    enabled: true
    purpose: Chuẩn hoá nhãn phòng trích từ bản vẽ cũ.

  # Đọc ảnh trích lục/sổ đỏ thành danh sách CẠNH có cấu trúc (chiều dài, góc, độ tin cậy) để
  # dựng site.boundary_m — KHÔNG sinh toạ độ, polygonFromEdges (@nvg/shared/design) mới là chỗ
  # đi bộ theo cấu trúc này ra toạ độ (nguyên tắc bất biến 2, CLAUDE.md 8.2).
  #
  # ⚠️ Ảnh trích lục/sổ đỏ của một dự án THẬT luôn là data_class 2 ("mặt bằng kích thước
  # thật") — Worker (`workers/src/design/site/extract-boundary.ts`) khai dataClass=2 CỨNG cho
  # MỌI lời gọi, không có đường khai 3. Đúng ra max_data_class phải là 3 (chặn hoàn toàn) theo
  # quyết định T8 (CLAUDE.md 8.5), cho tới khi có cam kết bằng văn bản của nhà cung cấp.
  #
  # ⚠️ TẠM THỜI hạ xuống 2 (31/08/2026, Haan xác nhận trực tiếp) — CHỈ để tự thử bằng ảnh sổ đỏ
  # LẤY TRÊN MẠNG (không phải dữ liệu khách hàng thật) trong lúc chạy thử cục bộ. Đưa số này về
  # 3 trước khi có ảnh thật của khách chạm vào route này, hoặc trước khi triển khai production.
  site_boundary_extract:
    provider: gemini
    model: gemini-2.5-flash
    max_data_class: 2
    enabled: true
    purpose: Đọc ảnh trích lục/sổ đỏ thành danh sách cạnh có cấu trúc để dựng ranh giới thửa đất.

  # Sinh ảnh phối cảnh từ ảnh khối — Lớp 5, đi qua interface `RenderBackend`.
  #
  # ✅ **Tuyến này đặt `max_data_class: 3` mà KHÔNG phải nới lỏng gì** — khác hẳn
  # `site_boundary_extract`. Chính bảng hạng ở đầu tệp đã xếp "ảnh khối, bản đồ độ sâu, mô tả
  # phong cách" vào hạng 3. Kiến trúc đã lường trước đúng trường hợp này.
  #
  # ⚠️ Nhưng điều đó CHỈ đúng nếu ảnh gửi đi là ảnh khối thuần hình học. Ba thứ kéo nó lên
  # hạng nhạy cảm hơn và phải bị lược bỏ trước khi gửi:
  #   · chuỗi kích thước hoặc cao độ hiện trên ảnh   → hạng 2 ("mặt bằng kích thước thật")
  #   · tên phòng, tên chủ đầu tư, mã hồ sơ, khung tên → hạng 1
  #   · đoạn mô tả lấy nguyên văn từ đầu bài           → hạng 1
  # Mô tả phong cách gửi kèm phải là từ vựng phong cách ("nhà lô hiện đại, mặt tiền 5 m, ba
  # tầng"), KHÔNG phải chữ của khách. Lớp gọi khai `dataClass` CỨNG bằng 3 và không nhận số
  # này từ bên ngoài — cùng khuôn với `site/extract-boundary.ts`.
  #
  # ── Đã thử ba nhà cung cấp, ghi lại để không đi lại đường cũ ──────────────────────────────
  #
  # · **Gemini — LOẠI.** Lời gọi thật 05 và 06/09/2026: cả ba mô hình sinh ảnh trả nguyên văn
  #   `Quota exceeded … generate_content_free_tier_requests, limit: 0`. `limit: 0` nghĩa là gói
  #   miễn phí không cấp một lượt sinh ảnh nào; chờ sang ngày mai không đổi được gì.
  # · **Hugging Face — LOẠI.** Chạy được (`FLUX.1-Kontext-dev` qua đối tác `fal-ai`, ~9 giây,
  #   bám khối tốt) nhưng hạn mức miễn phí chỉ khoảng 0,10 đô một tháng: bốn lần gọi để đo là
  #   hết sạch. Quá ít để dùng trong lúc phát triển.
  # · **Pollinations — ĐANG DÙNG** (06/09/2026, Haan chốt). Mô hình `kontext` trên đường
  #   `POST /v1/images/edits`, ~18,5 giây cho ảnh 1024×1024, bám khối rất sát trên ảnh thật.
  #
  # ⚠️ **Phải là đường ẢNH → ẢNH (`/v1/images/edits`).** Pollinations còn có `GET /image/{prompt}`
  # rẻ hơn, nhưng đó là CHỮ → ẢNH: nó dựng một ngôi nhà khác chứ không dựng ngôi nhà bộ giải vừa
  # xếp, tức phá nguyên tắc bất biến 1 (CLAUDE.md 8.2). Không đổi sang đường đó dù rẻ hơn.
  #
  # `model` ở đây đóng đúng vai trò của một biến môi trường `POLLINATIONS_IMAGE_MODEL`, nhưng
  # nằm trong tệp có phiên bản và có chú thích — đổi mô hình là sửa một dòng, không sửa mã.
  # Danh sách mô hình dùng được lấy ở `GET /v1/models`; chọn mô hình có `image` trong
  # `input_modalities` VÀ `/v1/images/edits` trong `supported_endpoints`. Đừng đoán tên.
  #
  # ⚠️ Pollinations KHÔNG có cam kết không-lưu-trữ, nên `max_data_class: 3` giữ nguyên và KHÔNG
  # được hạ. Ảnh gửi đi phải là ảnh khối trần.
  #
  # ⚠️ Theo PRD mục 5.1, tính năng AI là phụ trợ tuỳ chọn — hết hạn mức KHÔNG được chặn luồng
  # chính. Khi tuyến này lỗi, màn hình giữ ảnh khối kèm nhãn cảnh báo, không trả lỗi ra người
  # dùng.
  #
  # ⚠️ Độ bám hình học của mô hình sinh ảnh vẫn không tuyệt đối — ảnh có thể đẹp mà lệch khối.
  # Đó là lý do nhãn "Ảnh tham khảo ý tưởng — chưa phải phương án thi công" (01-overview 1.4)
  # do MÃ chèn lên ảnh, không phụ thuộc người dùng nhớ bật.
  layer5_render:
    provider: pollinations
    model: kontext
    label: Pollinations (miễn phí, chỉ ảnh khối)
    endpoint: https://gen.pollinations.ai/v1/images/edits
    max_data_class: 3
    enabled: true
    purpose:
      Sinh ảnh phối cảnh tham khảo TỪ ảnh khối ba chiều (ảnh → ảnh, không phải chữ → ảnh). Dev
      và test dùng Pollinations — xem chú thích trên về hai nhà cung cấp đã loại.

  # Nhúng phần chú giải của kiến trúc sư để truy hồi ba tầng (06-knowledge-base 6.3).
  #
  # `output_dimensions: 1536` là lựa chọn có lý do, không phải con số tuỳ tiện: mặc định của
  # mô hình là 3072 chiều, mà chỉ mục vector của Postgres chỉ nhận tối đa 2000 chiều — để mặc
  # định thì cột lưu được nhưng KHÔNG BAO GIỜ đánh chỉ mục được, và điều đó chỉ lộ ra vào ngày
  # kho lớn tới mức cần chỉ mục.
  #
  # ⚠️ Mô hình này trả về vector CHƯA chuẩn hoá lại khi cắt bớt chiều (đo được: chuẩn 0,692 ở
  # 1536 chiều thay vì 1,000). Bên gọi phải tự chuẩn hoá — xem `llm/gemini.ts`.
  kb_rationale_embed:
    provider: gemini
    model: gemini-embedding-001
    output_dimensions: 1536
    max_data_class: 3
    enabled: true
    purpose: Nhúng chú giải công trình cũ để truy hồi few-shot.

  # ── Nhánh thiết kế bằng AI (T10–T13, 08/09/2026) ──────────────────────────────────────────
  #
  # Người dùng chọn MỘT trong các tuyến dưới đây trên trang thiết kế; trình duyệt chỉ gửi TÊN
  # TUYẾN. Mỗi tuyến một nhà cung cấp, để đổi model hay đổi bậc (Opus ↔ Sonnet, Pro ↔ Flash) là
  # sửa một dòng ở đây (câu hỏi Q-34: bậc mặc định, Haan chốt).
  #
  # ⚠️ Tên mô hình dưới đây lấy từ tài liệu công khai ngày 08/09/2026 và PHẢI kiểm bằng một lời
  # gọi thật (prompt không mang dữ liệu NVG) trước khi bật cho người dùng — tiền lệ 29/08/2026:
  # `gemini-2.5-pro` trả 404 với khoá mới lập. Ghi số đo (giây, USD) vào chú thích sau khi đo.
  #
  # Địa chỉ HTTP khai tường minh vì mỗi nhà cung cấp một gốc và mỗi việc một đường
  # (`/v1/responses` cho chữ, `/v1/images/edits` cho ảnh) — cùng lý lẽ với `layer5_render`.

  ai_text_openai:
    provider: openai
    model: gpt-5
    label: GPT (OpenAI)
    endpoint: https://api.openai.com/v1/responses
    max_data_class: 2
    enabled: true
    purpose: Nhánh AI — chương trình không gian và mặt bằng đề xuất (văn bản có lược đồ).
    pricing: { input_per_1m_usd: 1.25, output_per_1m_usd: 10 }

  ai_text_gemini:
    provider: gemini_paid
    model: gemini-2.5-pro
    label: Gemini (Google)
    max_data_class: 2
    enabled: true
    purpose: Nhánh AI — chương trình không gian và mặt bằng đề xuất (văn bản có lược đồ).
    pricing: { input_per_1m_usd: 1.25, output_per_1m_usd: 10 }

  ai_text_anthropic:
    provider: anthropic
    model: claude-opus-5
    label: Claude (Anthropic)
    endpoint: https://api.anthropic.com/v1/messages
    max_data_class: 2
    enabled: true
    purpose: Nhánh AI — chương trình không gian và mặt bằng đề xuất (văn bản có lược đồ).
    pricing: { input_per_1m_usd: 5, output_per_1m_usd: 25 }

  # Ảnh: chỉ OpenAI và Google có mô hình ảnh; Anthropic không có. Cả hai nhận NHIỀU ảnh vào
  # (ảnh khối + tờ mặt bằng), nên giữ được đường ảnh → ảnh ở ba trong năm loại ảnh (T13).
  ai_image_openai:
    provider: openai
    model: gpt-image-2
    label: GPT Image (OpenAI)
    endpoint: https://api.openai.com/v1/images/edits
    max_data_class: 2
    enabled: true
    purpose: Nhánh AI — mặt bằng có nội thất, phối cảnh, nội thất, mặt đứng, mặt cắt.
    pricing: { image_usd: 0.19 }

  ai_image_gemini:
    provider: gemini_paid
    model: gemini-3.1-flash-image
    label: Gemini Image (Google)
    max_data_class: 2
    enabled: true
    purpose: Nhánh AI — mặt bằng có nội thất, phối cảnh, nội thất, mặt đứng, mặt cắt.
    pricing: { image_usd: 0.04 }
