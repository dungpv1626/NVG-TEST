# Định tuyến mô hình ngôn ngữ cho Module Thiết kế AI.
#
# Nguồn: doc/design/05-tech-stack.md mục 5.6, doc/design/01-overview.md mục 1.5.
#
# Nguyên tắc: TÊN MÔ HÌNH KHÔNG BAO GIỜ LÀ HẰNG SỐ TRONG MÃ NGUỒN. Đổi nhà cung cấp hoặc
# đổi mô hình là sửa tệp này, không sửa code.
#
# `max_data_class` là hạng dữ liệu NHẠY CẢM NHẤT mà đầu ra này được phép nhận.
#
# ⚠️ Đọc ngược với trực giác: số NHỎ = nhạy cảm HƠN. Đầu ra khai `1` nhận được cả ba hạng;
# đầu ra khai `3` chỉ nhận hạng 3. Tên trường lấy nguyên từ tài liệu đặc tả để không sinh
# ra từ vựng thứ hai.
#
#   1 — Nhạy cảm: thông tin khách hàng, đầu bài, hợp đồng, dự toán, liên hệ.
#       CHỈ dịch vụ có cam kết không lưu trữ VÀ không huấn luyện.
#   2 — Trung bình: mặt bằng kích thước thật, bản vẽ kỹ thuật, mô hình ba chiều.
#       Chỉ dịch vụ có cam kết không lưu trữ.
#   3 — Thấp: ảnh khối, bản đồ độ sâu, mô tả phong cách.
#
# Lời gọi mang `data_class` NHỎ HƠN `max_data_class` (tức nhạy cảm hơn mức cho phép) bị lớp
# chặn từ chối trước khi ra mạng (`workers/src/design/llm/router.ts`).
#
# ⚠️ GIAI ĐOẠN DEMO: gói Gemini miễn phí có thể được Google dùng để cải thiện sản phẩm
# (CLAUDE.md 5.1, quyết định T8), nên MỌI đầu ra dưới đây đặt `max_data_class: 3` — mức
# CHẶT NHẤT, chỉ nhận dữ liệu giả lập hoặc đã ẩn danh. HẠ con số này (3 → 2 → 1) là nới
# lỏng, và không được làm cho tới khi có cam kết bằng văn bản của nhà cung cấp: hạ xuống 1
# là mở đường cho đầu bài thật của khách đi ra dịch vụ ngoài mà không ai nhận ra.

version: '1.0.0'

# Khoá API đã có (kiểm chứng 29/08/2026 bằng lời gọi thật, prompt không mang dữ liệu NVG).
#
# ⚠️ Ba điều đo được hôm đó, ghi lại để không phải dò lại:
#
#  1. `gemini-2.5-pro` trả 404 "no longer available to new users" — không phải lỗi khoá.
#     Google đã đóng mô hình này với khoá mới lập.
#  2. Khoá hiện tại KHÔNG có hạn mức cho nhóm `pro`: `gemini-pro-latest` trả 429 "exceeded
#     your current quota". Đây là dấu hiệu gói MIỄN PHÍ, khớp với quyết định T8 — nên
#     `max_data_class: 3` ở dưới giữ nguyên, KHÔNG hạ.
#  3. Nhóm `flash` chạy tốt, kể cả đầu ra JSON có lược đồ (`responseSchema`) — thứ mà mọi
#     đầu ra dưới đây đều cần.

routes:
  layer1_brief:
    provider: gemini
    model: gemini-2.5-flash
    max_data_class: 3
    enabled: true
    purpose: Kiểm tra đầy đủ và nhất quán của đầu bài, chấm completeness_score.

  layer2_program:
    provider: gemini
    model: gemini-2.5-flash
    max_data_class: 3
    enabled: true
    purpose: Sinh chương trình không gian từ đầu bài + thống kê thực nghiệm.

  layer3_intent:
    provider: gemini
    model: gemini-2.5-flash
    max_data_class: 3
    enabled: true
    purpose: Sinh cây chia không gian (LayoutIntent). KHÔNG sinh toạ độ hay kích thước.

  # Đầu ra dự phòng khi `layer3_intent` sinh ra cấu trúc không hợp lệ nhiều lần liên tiếp.
  #
  # ⚠️ ĐANG TẮT, và đây là trạng thái ĐÚNG chứ không phải việc còn bỏ dở: khoá gói miễn phí
  # không có hạn mức cho nhóm `pro` (điểm 2 ở trên). Để `enabled: true` thì lần dự phòng nào
  # cũng ăn 429 — tức là thay một lỗi đọc được ("sinh sai cấu trúc") bằng một lỗi khó hiểu
  # ("hết hạn mức"). Bật lại đúng lúc nâng gói, không sớm hơn.
  layer3_intent_hard:
    provider: gemini
    model: gemini-3.1-pro-preview
    max_data_class: 3
    enabled: false
    purpose: Phương án khó — nhiều cánh, đất không vuông vắn.

  layer4_facade:
    provider: gemini
    model: gemini-2.5-flash
    max_data_class: 3
    enabled: true
    purpose: Chọn tham số mặt đứng theo phong cách.

  kb_label_normalize:
    provider: gemini
    model: gemini-2.5-flash
    max_data_class: 3
    enabled: true
    purpose: Chuẩn hoá nhãn phòng trích từ bản vẽ cũ.

  # Đọc ảnh trích lục/sổ đỏ thành danh sách CẠNH có cấu trúc (chiều dài, góc, độ tin cậy) để
  # dựng site.boundary_m — KHÔNG sinh toạ độ, polygonFromEdges (@nvg/shared/design) mới là chỗ
  # đi bộ theo cấu trúc này ra toạ độ (nguyên tắc bất biến 2, CLAUDE.md 8.2).
  #
  # ⚠️ Ảnh trích lục/sổ đỏ của một dự án THẬT luôn là data_class 2 ("mặt bằng kích thước
  # thật") — Worker (`workers/src/design/site/extract-boundary.ts`) khai dataClass=2 CỨNG cho
  # MỌI lời gọi, không có đường khai 3. Đúng ra max_data_class phải là 3 (chặn hoàn toàn) theo
  # quyết định T8 (CLAUDE.md 8.5), cho tới khi có cam kết bằng văn bản của nhà cung cấp.
  #
  # ⚠️ TẠM THỜI hạ xuống 2 (31/08/2026, Haan xác nhận trực tiếp) — CHỈ để tự thử bằng ảnh sổ đỏ
  # LẤY TRÊN MẠNG (không phải dữ liệu khách hàng thật) trong lúc chạy thử cục bộ. Đưa số này về
  # 3 trước khi có ảnh thật của khách chạm vào route này, hoặc trước khi triển khai production.
  site_boundary_extract:
    provider: gemini
    model: gemini-2.5-flash
    max_data_class: 2
    enabled: true
    purpose: Đọc ảnh trích lục/sổ đỏ thành danh sách cạnh có cấu trúc để dựng ranh giới thửa đất.

  # Nhúng phần chú giải của kiến trúc sư để truy hồi ba tầng (06-knowledge-base 6.3).
  #
  # `output_dimensions: 1536` là lựa chọn có lý do, không phải con số tuỳ tiện: mặc định của
  # mô hình là 3072 chiều, mà chỉ mục vector của Postgres chỉ nhận tối đa 2000 chiều — để mặc
  # định thì cột lưu được nhưng KHÔNG BAO GIỜ đánh chỉ mục được, và điều đó chỉ lộ ra vào ngày
  # kho lớn tới mức cần chỉ mục.
  #
  # ⚠️ Mô hình này trả về vector CHƯA chuẩn hoá lại khi cắt bớt chiều (đo được: chuẩn 0,692 ở
  # 1536 chiều thay vì 1,000). Bên gọi phải tự chuẩn hoá — xem `llm/gemini.ts`.
  kb_rationale_embed:
    provider: gemini
    model: gemini-embedding-001
    output_dimensions: 1536
    max_data_class: 3
    enabled: true
    purpose: Nhúng chú giải công trình cũ để truy hồi few-shot.
