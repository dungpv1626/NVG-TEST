# Định tuyến mô hình ngôn ngữ cho Module Thiết kế AI.
#
# Nguồn: doc/design/05-tech-stack.md mục 5.6, doc/design/01-overview.md mục 1.5.
#
# Nguyên tắc: TÊN MÔ HÌNH KHÔNG BAO GIỜ LÀ HẰNG SỐ TRONG MÃ NGUỒN. Đổi nhà cung cấp hoặc
# đổi mô hình là sửa tệp này, không sửa code.
#
# `max_data_class` là hạng dữ liệu NHẠY CẢM NHẤT mà đầu ra này được phép nhận.
#
# ⚠️ Đọc ngược với trực giác: số NHỎ = nhạy cảm HƠN. Đầu ra khai `1` nhận được cả ba hạng;
# đầu ra khai `3` chỉ nhận hạng 3. Tên trường lấy nguyên từ tài liệu đặc tả để không sinh
# ra từ vựng thứ hai.
#
#   1 — Nhạy cảm: thông tin khách hàng, đầu bài, hợp đồng, dự toán, liên hệ.
#       CHỈ dịch vụ có cam kết không lưu trữ VÀ không huấn luyện.
#   2 — Trung bình: mặt bằng kích thước thật, bản vẽ kỹ thuật, mô hình ba chiều.
#       Chỉ dịch vụ có cam kết không lưu trữ.
#   3 — Thấp: ảnh khối, bản đồ độ sâu, mô tả phong cách.
#
# Lời gọi mang `data_class` NHỎ HƠN `max_data_class` (tức nhạy cảm hơn mức cho phép) bị lớp
# chặn từ chối trước khi ra mạng (`workers/src/design/llm/router.ts`).
#
# ⚠️ GÓI MIỄN PHÍ: gói Gemini miễn phí có thể được Google dùng để cải thiện sản phẩm
# (CLAUDE.md 5.1, quyết định T8), và Pollinations không có cam kết lưu trữ — nên mọi đầu ra
# `layer*`/`kb_*`/`site_*` dưới đây đặt `max_data_class: 3` (mức CHẶT NHẤT, chỉ nhận dữ liệu
# giả lập hoặc đã ẩn danh), trừ một ngoại lệ tạm có ghi tên. HẠ con số này là nới lỏng, và
# không được làm khi chưa có cam kết bằng văn bản của nhà cung cấp.
#
# ✅ NHÁNH AI (quyết định T12, 08/09/2026): các tuyến `ai_text_*` và `ai_image_*` dùng API TRẢ
# PHÍ của OpenAI, Google và Anthropic — cả ba cam kết không huấn luyện trên dữ liệu gửi qua
# API. Đó là căn cứ để chúng đặt `max_data_class: 2`: nhận đầu bài + khảo sát đã LƯỢC DANH
# TÍNH (tên, điện thoại, địa chỉ, mã hồ sơ, ngân sách) nhưng còn kích thước thật và chữ tự do
# (hợp đồng `contracts/ai-brief-digest.schema.json`, hàm `brief/anonymise.ts`). KHÔNG hạ tiếp
# xuống 1: danh tính khách không có lý do gì để đi ra ngoài.
#
# ⚠️ Chính sách bám vào KHOÁ, không bám vào lời hứa: Google dùng cùng một API cho gói miễn phí
# lẫn gói trả phí, nên hai tuyến Gemini của nhánh AI khai nhà cung cấp RIÊNG `gemini_paid` với
# secret riêng `GEMINI_PAID_API_KEY`. Khoá `GEMINI_API_KEY` (gói miễn phí, các tuyến hạng 3)
# không bao giờ được router cấp cho tuyến hạng 2 — rà soát 08/09/2026 bắt được chỗ hai tuyến
# này từng dùng chung khoá miễn phí.
#
# `label` là chữ hiện trên ô chọn model của trang thiết kế (T10); `pricing` là giá niêm yết
# để tính cột chi phí trong `design_ai_call` — cả hai là DỮ LIỆU, sửa ở đây khi giá đổi.
#
# Giá đối chiếu bảng giá CHÍNH THỨC ngày 13/09/2026 (ai.google.dev/gemini-api/docs/pricing ·
# platform.claude.com/docs/en/about-claude/pricing · developers.openai.com/api/docs/pricing),
# giá chuẩn, chưa trừ bộ nhớ đệm hay chạy lô. Tuyến dùng khoá MIỄN PHÍ vẫn khai `pricing`: đó
# là giá NẾU trả phí, để màn hình hiện «0 USD (gói miễn phí) — theo giá trả phí ≈ …». Nhà cung
# cấp nào không tính tiền thì khai ở `billing.free_providers`; `design_ai_call.cost_usd` luôn
# ghi giá niêm yết, còn số tiền THẬT = 0 khi `provider` nằm trong danh sách đó.

version: '1.4.0'

# Tên nhà cung cấp hiện trên ô chọn model (T60, 20/09/2026 — Haan gửi mẫu giao diện chọn theo nhà
# cung cấp rồi mới chọn model). `gemini` và `gemini_paid` là HAI nhà cung cấp ở đây vì chúng dùng
# hai khoá khác nhau (xem ghi chú «chính sách bám vào KHOÁ» ở đầu tệp) — trên màn hình cũng để hai
# thẻ riêng, vì gói miễn phí và gói trả phí khác nhau đúng ở chỗ người dùng cần biết: dữ liệu gửi
# đi có thể bị dùng để huấn luyện hay không.
providers:
  openai: { label: 'OpenAI' }
  anthropic: { label: 'Anthropic' }
  gemini_paid: { label: 'Google' }
  gemini: { label: 'Google (gói miễn phí)' }
  pollinations: { label: 'Pollinations' }

billing:
  # Khoá của hai nhà cung cấp này không phát sinh hoá đơn: `gemini` là khoá gói miễn phí
  # (`GEMINI_API_KEY`, T8), Pollinations không thu tiền. Theo NHÀ CUNG CẤP chứ không theo tuyến,
  # vì tiền bám vào khoá — cùng lý lẽ tách `gemini_paid` ở trên.
  free_providers: [gemini, pollinations]

# Khoá API đã có (kiểm chứng 29/08/2026 bằng lời gọi thật, prompt không mang dữ liệu NVG).
#
# ⚠️ Ba điều đo được hôm đó, ghi lại để không phải dò lại:
#
#  1. `gemini-2.5-pro` trả 404 "no longer available to new users" — không phải lỗi khoá.
#     Google đã đóng mô hình này với khoá mới lập.
#  2. Khoá hiện tại KHÔNG có hạn mức cho nhóm `pro`: `gemini-pro-latest` trả 429 "exceeded
#     your current quota". Đây là dấu hiệu gói MIỄN PHÍ, khớp với quyết định T8 — nên
#     `max_data_class: 3` ở dưới giữ nguyên, KHÔNG hạ.
#  3. Nhóm `flash` chạy tốt, kể cả đầu ra JSON có lược đồ (`responseSchema`) — thứ mà mọi
#     đầu ra dưới đây đều cần.

routes:
  # Tuyến `layer1_brief`…`layer5_render` của bộ giải nội bộ đã gỡ cùng bộ giải (T58, 19/09/2026).

  kb_label_normalize:
    provider: gemini
    model: gemini-2.5-flash
    pricing: { input_per_1m_usd: 0.3, output_per_1m_usd: 2.5 }
    max_data_class: 3
    enabled: true
    purpose: Chuẩn hoá nhãn phòng trích từ bản vẽ cũ.

  # Đọc ảnh trích lục/sổ đỏ thành danh sách CẠNH có cấu trúc (chiều dài, góc, độ tin cậy) để
  # dựng site.boundary_m — KHÔNG sinh toạ độ, polygonFromEdges (@nvg/shared/design) mới là chỗ
  # đi bộ theo cấu trúc này ra toạ độ (nguyên tắc bất biến 2, CLAUDE.md 8.2).
  #
  # ⚠️ Ảnh trích lục/sổ đỏ của một dự án THẬT luôn là data_class 2 ("mặt bằng kích thước
  # thật") — Worker (`workers/src/design/site/extract-boundary.ts`) khai dataClass=2 CỨNG cho
  # MỌI lời gọi, không có đường khai 3. Đúng ra max_data_class phải là 3 (chặn hoàn toàn) theo
  # quyết định T8 (CLAUDE.md 8.5), cho tới khi có cam kết bằng văn bản của nhà cung cấp.
  #
  # ⚠️ TẠM THỜI hạ xuống 2 (31/08/2026, Haan xác nhận trực tiếp) — CHỈ để tự thử bằng ảnh sổ đỏ
  # LẤY TRÊN MẠNG (không phải dữ liệu khách hàng thật) trong lúc chạy thử cục bộ. Đưa số này về
  # 3 trước khi có ảnh thật của khách chạm vào route này, hoặc trước khi triển khai production.
  site_boundary_extract:
    provider: gemini
    model: gemini-2.5-flash
    pricing: { input_per_1m_usd: 0.3, output_per_1m_usd: 2.5 }
    max_data_class: 2
    enabled: true
    purpose: Đọc ảnh trích lục/sổ đỏ thành danh sách cạnh có cấu trúc để dựng ranh giới thửa đất.

  # ── Nhà cung cấp ảnh đã thử (tuyến phối cảnh cũ của bộ giải, gỡ ở T58) ─────────────────
  # · Gemini — loại: gói miễn phí trả `limit: 0` cho mọi mô hình sinh ảnh (05–06/09/2026).
  # · Hugging Face — loại: hạn mức miễn phí ~0,10 đô một tháng, bốn lượt đo là hết.
  # · Pollinations — dùng được: `kontext` trên `POST /v1/images/edits` (ảnh → ảnh), ~18,5 giây
  #   cho ảnh 1024×1024. Không có cam kết không-lưu-trữ nên chỉ nhận dữ liệu hạng 3. Client
  #   `llm/pollinations.ts` vẫn giữ: đổi `provider` của một tuyến ảnh sang `pollinations` là dùng.

  # Nhúng phần chú giải của kiến trúc sư để truy hồi ba tầng (06-knowledge-base 6.3).
  #
  # `output_dimensions: 1536` là lựa chọn có lý do, không phải con số tuỳ tiện: mặc định của
  # mô hình là 3072 chiều, mà chỉ mục vector của Postgres chỉ nhận tối đa 2000 chiều — để mặc
  # định thì cột lưu được nhưng KHÔNG BAO GIỜ đánh chỉ mục được, và điều đó chỉ lộ ra vào ngày
  # kho lớn tới mức cần chỉ mục.
  #
  # ⚠️ Mô hình này trả về vector CHƯA chuẩn hoá lại khi cắt bớt chiều (đo được: chuẩn 0,692 ở
  # 1536 chiều thay vì 1,000). Bên gọi phải tự chuẩn hoá — xem `llm/gemini.ts`.
  kb_rationale_embed:
    provider: gemini
    model: gemini-embedding-001
    output_dimensions: 1536
    max_data_class: 3
    enabled: true
    purpose: Nhúng chú giải công trình cũ để truy hồi few-shot.

  # ── Nhánh thiết kế bằng AI (T10–T13, 08/09/2026) ──────────────────────────────────────────
  #
  # Người dùng chọn MỘT trong các tuyến dưới đây trên trang thiết kế; trình duyệt chỉ gửi TÊN
  # TUYẾN. Mỗi nhà cung cấp có HAI tuyến — một bậc chất lượng cao, một bậc nhanh và rẻ hơn — nên
  # ô chọn model liệt kê sáu dòng. Đổi model, thêm bậc hay bỏ bậc đều là sửa ở đây: không có tên
  # mô hình nào nằm trong mã nguồn hay giao diện (câu hỏi Q-34: bậc mặc định, Haan chốt).
  #
  # ⚠️ `label` là chữ HIỆN TRÊN Ô CHỌN. Đổi `model` thì sửa `label` theo — không có gì tự đồng bộ,
  # và nhãn nói sai tên model thì người dùng so sánh chất lượng trên một giả thiết sai.
  #
  # ✔ Đã kiểm bằng lời gọi thật ngày 08/09/2026, prompt không mang dữ liệu NVG, đúng đường mà
  # mã nguồn đi (structured output có lược đồ). Tiền lệ 29/08/2026 lặp lại y hệt: `gemini-2.5-pro`
  # trả 404 "no longer available to new users" với khoá mới lập, phải đổi sang bản 3.1.
  # Số đo lượt gọi rỗng (giây · token vào/ra): gpt-5 2,3 s · 13/76 — claude-opus-5 2,5 s · 231/19
  # — gemini-3.1-pro-preview 7,8 s · 7/103. Model ảnh xác nhận tồn tại qua GET model, chưa dựng
  # ảnh thật (Đợt 4 mới đo giây và USD mỗi ảnh).
  #
  # Địa chỉ HTTP khai tường minh vì mỗi nhà cung cấp một gốc và mỗi việc một đường
  # (`/v1/responses` cho chữ, `/v1/images/edits` cho ảnh).

  ai_text_openai:
    provider: openai
    # ⚠️ Trước 20/09/2026 tuyến này chạy `gpt-5` — model ra ngày 05/08/2025, tức đã CŨ 13 THÁNG.
    # Nó lọt vì quy trình chỉ hỏi «model này gọi được không» (kiểm 08/09/2026: gọi được, ghi ✔) mà
    # không bao giờ hỏi «có bản mới hơn chưa» — một model cũ thì không bao giờ tự báo rằng nó cũ.
    # Haan phát hiện bằng cách nhìn ô chọn model của một dự án khác. Từ nay: mỗi lần đụng tệp này,
    # gọi `GET /v1/models` của nhà cung cấp trước (không tốn token, không tốn tiền) rồi hãy sửa.
    model: gpt-5.6-terra
    label: GPT-5.6 Terra (OpenAI) — cân bằng
    short: 'GPT-5.6 Terra'
    tag: 'Cân bằng'
    blurb: 'Bậc giữa của OpenAI, ra 23/06/2026. Đắt hơn Luna mười lần, rẻ hơn Astra năm lần.'
    endpoint: https://api.openai.com/v1/responses
    max_data_class: 2
    enabled: true
    purpose: Nhánh AI — chương trình không gian và mặt bằng đề xuất (văn bản có lược đồ).
    pricing: { input_per_1m_usd: 2, output_per_1m_usd: 12 }
    # ✔ Kiểm bằng lời gọi RỖNG ngày 20/09/2026, đúng đường mã thật đi (`/v1/responses`, lược đồ
    # `strict`, `store: false`, `reasoning.effort: low`): 1.166 ms · vào 50 / ra 15 · nghĩ 0 token
    # · trả đúng `{"ok":true}` · 0,00028 USD.
    #
    # ── Đo THẬT 13/09/2026 TRÊN `gpt-5` (model cũ của tuyến này) ──────────────────────────
    # Giữ lại vì nó giải thích hai dòng `max_output_tokens`/`request_timeout_s` dưới đây; các con
    # số là của gpt-5, CHƯA đo lại trên Terra.
    #
    # Một lượt xếp mặt bằng cho biệt thự 26 phòng: tiêu HẾT 32.000 token đầu ra (trần do
    # `PLAN_OUTPUT_TOKENS` ở `ai/plan.ts` xin) mà vẫn bị cắt giữa chừng, và cũng vượt hạn chờ
    # 300 giây. Câu trả lời JSON của một mặt bằng cỡ ấy chỉ nặng ~1.500–2.500 token — nghĩa là
    # khoảng 90% ngân sách đi vào phần NGHĨ, thứ không hiện ra, vẫn tính tiền, vẫn ăn vào trần.
    #
    # `max_output_tokens` CỐ Ý để trống ở trạng thái thường: nâng trần không sửa được nguyên
    # nhân, nó chỉ làm mỗi lượt hỏng đắt gấp đôi. Cái van đúng là `reasoning_effort` dưới đây.
    #
    # Trần 16.000 từ T38 (13/09/2026): lượt gọi nay là MỘT TẦNG và câu trả lời là một cây vài trăm
    # token, nên 16.000 là chỗ cho phần nghĩ chứ không cho phần viết. Lượt đo trước (mức `0`, không
    # trần) cho 30.742 và 33.200 token ra trên việc xếp CẢ NHÀ 26 phòng một lượt — việc lớn gấp
    # nhiều lần. Trần là van giữ tiền: một tầng mà nghĩ quá 16.000 token thì bài đặt đang sai.
    # ⚠️ TẠM ĐO 13/09/2026 — Haan: «tạm thời bỏ trần giới hạn token để test… bỏ trần giới hạn thời
    # gian». `0` = không đặt trần / không đặt hạn chờ. Trả lại sau đợt đo.
    max_output_tokens: 0
    request_timeout_s: 0
    #
    # `reasoning_effort` cũng để trống = dùng mặc định của model, tức hành vi hiện nay. Vặn nó
    # xuống `low` hoặc `minimal` là quyết định đánh đổi chất lượng bố cục lấy tiền và thời gian
    # — để người trả tiền quyết, sau một lượt đo có ghi lại số token nghĩ.
    # reasoning_effort: low

  # Bậc tiết kiệm. Đơn giá ba tuyến `_fast` đối chiếu bảng giá chính thức ngày 13/09/2026 (Q-36).
  ai_text_openai_fast:
    provider: openai
    # Đổi 20/09/2026: `gpt-5-mini` (05/08/2025) → `gpt-5.6-luna` (23/06/2026). Vừa mới hơn vừa
    # RẺ HƠN — 0,20 so với 0,25 token vào, 1,20 so với 2 token ra, tức rẻ hơn 40% ở phần đắt nhất.
    # ✔ Lời gọi rỗng 20/09/2026: 2.674 ms · vào 50 / ra 15 · nghĩ 0 · `{"ok":true}` · 0,00003 USD.
    model: gpt-5.6-luna
    label: GPT-5.6 Luna (OpenAI) — nhanh, rẻ nhất
    short: 'GPT-5.6 Luna'
    tag: 'Nhanh, rẻ nhất'
    blurb: 'Bậc rẻ nhất trong danh sách. Hợp đầu bài đơn giản, hoặc khi cần thử nhiều lượt trước khi chốt.'
    endpoint: https://api.openai.com/v1/responses
    max_data_class: 2
    enabled: true
    purpose: Nhánh AI — bậc tiết kiệm cho đầu bài đơn giản hoặc khi thử nhiều lượt.
    pricing: { input_per_1m_usd: 0.2, output_per_1m_usd: 1.2 }
    # ⚠️ ĐO 13/09/2026 — Haan cho phép một lượt đo luồng theo tầng (T38) «không giới hạn token».
    # `0` = không gửi trần nào. Sau lượt đo thay bằng số đo được cộng biên an toàn.
    # ⚠️ TẠM ĐO 13/09/2026 — Haan: «tạm thời bỏ trần giới hạn token để test… bỏ trần giới hạn thời
    # gian». `0` = không đặt trần / không đặt hạn chờ. Trả lại sau đợt đo.
    max_output_tokens: 0
    request_timeout_s: 0

  # ── Hai bậc CAO của OpenAI, thêm 20/09/2026 ─────────────────────────────────────────────
