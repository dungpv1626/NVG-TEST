  # Ảnh: chỉ OpenAI và Google có mô hình ảnh; Anthropic không có. Cả hai nhận NHIỀU ảnh vào
  # (ảnh khối + tờ mặt bằng), nên giữ được đường ảnh → ảnh ở ba trong năm loại ảnh (T13).
  # ── Sáu tuyến ảnh, tên mô hình lấy từ lượt LIỆT KÊ THẬT ngày 19/09/2026 ──────────────────
  #
  # Haan cho phép hai lượt gọi liệt kê (0 USD, không sinh ảnh) vì đoán tên mô hình là lượt gọi
  # hỏng SAU KHI đã trả tiền. Kết quả, bằng chính hai khoá trả phí của dự án:
  #
  #   OpenAI  `GET /v1/models` → 136 mô hình, trong đó 10 mô hình ảnh. Bảng giá chỉ còn ba mô
  #           hình ảnh HIỆN HÀNH (`gpt-image-2`, `gpt-image-2.5-flare`, `gpt-image-2.5-sunburst`);
  #           `gpt-image-1*` và `gpt-image-1.5` tụt xuống mục «All models» (cũ). Kiểu `ImageModel`
  #           trong tài liệu tham chiếu nhận cả ba ở CẢ HAI đầu ra, kể cả `/v1/images/edits`.
  #   Gemini  `ListModels` → 6 mô hình ảnh; tất cả đều `generateContent`, tức đều nhận ảnh vào.
  #           `gemini-2.5-flash-image` NGỪNG chạy 02/10/2026 nên không khai; hai bản `-preview`
  #           là bản thử của chính hai mô hình đã khai nên cũng không khai.
  #
  # Chọn mô hình nào cho việc gì: tài liệu OpenAI nói thẳng «Sunburst cho luồng cần ĐỘ CHÍNH XÁC
  # KHI SỬA ẢNH, Flare cho sinh ảnh nhanh hằng ngày» — việc của T57 là vẽ lại một mặt bằng có sẵn
  # từ ảnh neo, tức đúng loại thứ nhất.
  #
  # ⚠️ **Giá mỗi ảnh của OpenAI là số SUY RA, không phải số hãng công bố.** Hãng tính ảnh theo
  # TOKEN: `gpt-image-2` 4,00 USD/1M token ảnh vào · 15,00 USD/1M token ra; hai bản 2.5 gấp đôi
  # (8,00 và 30,00). Lượt THẬT đã ghi trong `design_ai_call` ngày 19/09/2026 (`gpt-image-2`, tờ
  # mặt bằng có nội thất): 2.353 token vào, 1.372 token ra → 2.353 × 4 + 1.372 × 15, chia một
  # triệu = **0,030 USD**. Con số 0,19 khai trước đó là ước chừng và cao gấp hơn sáu lần — nó
  # vào thẳng cột `cost_usd` của nhật ký nên đã báo đắt hơn hoá đơn thật. Số ở đây đổi theo cỡ
  # ảnh và mức `quality`; khi nào đổi hai thứ ấy thì phải đo lại.
  ai_image_openai:
