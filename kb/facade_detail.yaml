# ═══════════════════════════════════════════════════════════════════════════════
#  CHI TIẾT CẤU TẠO TRÊN TỜ MẶT ĐỨNG — CÁCH NHÀ VIỆT GROUP VẼ (T147)
# ═══════════════════════════════════════════════════════════════════════════════
#
#  Tệp này quyết định tờ mặt đứng TRÔNG NHƯ THẾ NÀO, không quyết định phương án nào hợp lệ
#  (CLAUDE.md 8.7.5: `rules/` quyết định hợp lệ, `kb/` quyết định bản vẽ trông thế nào).
#
#  Nguồn số: tờ KT07-08 hồ sơ M5 (nhà 2 tầng hiện đại, 1/60, đo bằng ezdxf 10/10/2026) và mục
#  `trang_tri` của `kb/facade_experience.yaml` (6 công trình). Đây là THÓI QUEN VẼ, n = 1 đủ
#  (quy ước), không phải định mức — không phép kiểm nào đọc tệp này.
#
#  Hai đơn vị, đừng lẫn:
#   · khoá `_mm` ở các mục cấu tạo = mm THẬT (như con số ghi trên hồ sơ: phào 100×50);
#   · mục `hatch`, `notes`, `annotation` = mm GIẤY — ký hiệu vật liệu và chữ phải dày đều như
#     nhau ở mọi tỷ lệ, như mẫu hatch của CAD.
#
#  Kết hợp với mô hình (Haan chốt 10/10/2026): bộ chi tiết ở đây LUÔN vẽ; mảng trang trí mô
#  hình đã chọn (`elevation.elements`) vẽ thành chi tiết theo mục `elements`. Phào mô hình đặt
#  trùng dải phào mặc định thì THAY dải ấy, không vẽ chồng.
# ═══════════════════════════════════════════════════════════════════════════════

version: '1.0.0'

# ── Dải sàn và phào ở mép mỗi sàn ────────────────────────────────────────────────
# M5: dải dầm 400 ngay dưới cốt sàn, rồi phào 100×50 đua 50 ngay trên cốt sàn — ở mỗi sàn và
# ở sàn mái. Mái dốc không có phào ở sàn mái (mép mái đua đã là đường ngang ấy).
floor_band:
  enabled: true
  band_mm: 400
  cornice_h_mm: 100
  cornice_projection_mm: 50
  cornice_note: 'Phào chỉ 100×50 (mm)'

# ── Tường chắn mái ───────────────────────────────────────────────────────────────
# M5: tường chắn 750, phào đỉnh 50×20 đua 20 mỗi bên. Vật liệu tô lấy theo vùng `trim` (chỉ,
# phào, khung) của ý tưởng; không có thì không tô — không bịa màu. KHÔNG lấy `accent`: mảng nhấn là
# một mảng mô hình đặt riêng (ốp gỗ một cạnh), trải nó lên cả tường chắn mái là vẽ thứ không ai chọn.
parapet:
  coping_h_mm: 50
  coping_projection_mm: 20
  coping_note: 'Phào chỉ 50×20 (mm)'
  material_from: [trim]

# ── Chân nhà (cốt sân → ±0.000) ──────────────────────────────────────────────────
# Ký hiệu theo vật liệu vùng `base`. Bậc tam cấp chỉ vẽ khi mặt bằng có `entry_steps` (T70).
plinth:
  material_from: [base]

# ── Cửa sổ ───────────────────────────────────────────────────────────────────────
# M5: khung ngoài 20, nẹp cánh ≈ 76 có góc cắt 45°, kính có nét xiên phản chiếu.
window:
  frame_mm: 40
  sash_mm: 60
  # Cửa từ bề rộng này chia nhiều cánh; mỗi cánh rộng chừng `leaf_target_mm`.
  multi_leaf_from_mm: 1000
  leaf_target_mm: 900
  # Ô kính cố định phía trên — thói quen nhà mái Nhật (M2). Mặc định tắt (M5 không có).
  top_fixed: false
  top_fixed_h_mm: 400

# ── Cửa đi ───────────────────────────────────────────────────────────────────────
door:
  frame_mm: 50
  stile_mm: 80
  two_leaf_from_mm: 1200
  # Cửa xếp vẽ ký hiệu bằng số cánh này; cửa lùa đặt nét chồng mép lệch khỏi giữa.
  folding_panels: 6
  sliding_split_share: 0.55
  handle_w_mm: 30
  handle_h_mm: 200
  handle_z_mm: 1000
  # M5: phào bo quanh cửa chính 100, hở chân.
  surround_main_door: true
  surround_mm: 100
  surround_note: 'Phào bo cửa 100×50 (mm)'
  # Vật liệu cửa đi (`door_materials`) → ô cánh là kính hay đặc.
  solid_materials: [go_tu_nhien, thep_van_go, sat_my_thuat]

# ── Cửa để xe ────────────────────────────────────────────────────────────────────
garage:
  frame_mm: 50
  shutter_slat_mm: 150
  folding_panels: 6

# ── Lan can ──────────────────────────────────────────────────────────────────────
# M5 «LAN CAN 1»: trụ 20, thanh ngang dưới cách sàn 50, tay vịn 25, nan 20 bước 120.
railing:
  post_mm: 40
  post_max_spacing_mm: 1500
  bottom_gap_mm: 50
  rail_mm: 20
  handrail_mm: 50
  # Kiểu vẽ theo mã lan can của danh mục; mã không có ở đây thì theo `default`.
  default: balusters
  draw:
    kinh_cuong_luc: glass
    inox_kinh: glass
    sat_hop: balusters
    sat_my_thuat: ornamental
    con_tien: turned
    xay_dac: solid
  balusters: { width_mm: 20, pitch_mm: 120 }
  turned: { width_mm: 80, pitch_mm: 200 }
  ornamental: { width_mm: 20, pitch_mm: 150 }

# ── Mảng trang trí mô hình chọn ─────────────────────────────────────────────────
elements:
  cornice: { profile_lines: 2 }
  reveal: { groove_mm: 15, pitch_mm: 510, note: 'Ron chỉ âm tường 15 (mm)' }
  louvre: { fin_mm: 100, pitch_mm: 200 }
  column: { cap_mm: 150, base_mm: 150 }
  canopy: { soffit_share: 0.4 }
  planter: { lip_mm: 80 }

# ── Ký hiệu vật liệu ─────────────────────────────────────────────────────────────
# Mã vật liệu (`facade_vocabulary.materials` và `roof_materials`) → kiểu ký hiệu.
#  · paint  — sơn: tô xám đặc khi màu đủ tối (ngưỡng `paint_solid_below`), sáng thì để trắng;
#  · stone, brick, wood, dots, tile — nét ký hiệu, không tô;
#  · glass — nét xiên; none — không ký hiệu.
# Mã không có ở đây thì không ký hiệu (vẫn ghi chú bằng chữ).
material_hatch:
  son_nuoc: paint
  son_gia_da: stone
  da_granite: stone
  da_ong: stone
  da_cham: stone
  da_rua: dots
  gach_the: brick
  gach_op_gom: brick
  be_tong_tran: dots
  son_hieu_ung_be_tong: dots
  go_tu_nhien: wood
  go_nhua: wood
  lam_nhom: paint
  nhom_van_go: wood
  tam_alu: paint
  nhom_kinh: glass
  kinh_cuong_luc: glass
  thep_son_tinh_dien: paint
  sat_my_thuat: paint
  inox: none
  phao_chi: paint
  gach_hoa_gio: brick
  # Vật liệu mái dốc
  ngoi_mau: tile
  ngoi_dat_nung: tile
  ngoi_phang: tile
  ngoi_am_duong: tile
  ton_song: tile
  ton_giat_cap: tile
  btct_chong_tham: none

# Ngưỡng độ sáng (0 đen — 1 trắng) dưới đó lớp sơn được tô xám; và khoảng xám được phép dùng
# để nét vẽ phía trên vẫn đọc được (M5 tô xám đặc 252 ≈ 0,8).
paint_solid_below: 0.8
tone_range: [0.6, 0.88]

# Bước của nét ký hiệu, mm GIẤY.
hatch:
  stone: { course_mm: 2.4, joint_mm: 4.0 }
  brick: { course_mm: 1.2, joint_mm: 3.0 }
  wood: { pitch_mm: 0.9, break_mm: 6.0 }
  dots: { pitch_mm: 1.4, r_mm: 0.12 }
  tile: { pitch_mm: 1.6 }
  # Kính: số cặp nét xiên 45° trên mỗi ô kính, và khe giữa hai nét của một cặp.
  glass: { pairs: 1, gap_mm: 0.8, min_pane_mm: 3.0 }
  # Nét đôi (khung, nẹp) gần nhau hơn mức này trên giấy thì gộp làm một nét.
  min_gap_mm: 0.25

# ── Ghi chú dẫn ──────────────────────────────────────────────────────────────────
# M5: chữ 2 mm, in hoa, dẫn bằng một nét xiên/đứng rồi nét ngang mang chữ.
notes:
  uppercase: true
  column_mm: 30
  line_gap_mm: 1.0
  min_spacing_mm: 6.0
  landing_mm: 4.0
  max_chars_per_line: 26

# ── Lưới trục ────────────────────────────────────────────────────────────────────
# Trục suy từ tim tường của phương án (mặt bằng không có cột). Trục dọc đánh số 1, 2, 3… từ trái
# sang phải; trục ngang đánh chữ A, B, C… từ mặt tiền vào sâu — như tờ KT07 (trục 1-4) và KT08
# (trục A-C) của M5.
axes:
  # Tường trong chỉ thành trục khi ở MỘT tầng nào đó tổng chiều dài tường trên đường ấy đạt tỷ lệ
  # này của chiều sâu (hoặc chiều rộng) tầng. Hai tường bao luôn là trục.
  min_span_share: 0.5
  # Hai trục gần nhau hơn mức này thì gộp, giữ trục dài hơn.
  merge_mm: 900
  letters: [A, B, C, D, E, F, G, H, K, L, M, N]

# ── Bố cục chú thích, mm GIẤY ────────────────────────────────────────────────────
annotation:
  # Bóng trục: đường kính và khoảng hở từ hàng kích thước ngoài cùng.
  bubble_d_mm: 6.0
  bubble_gap_mm: 4.0
  # Nét trục và nét cốt chạy quá hình.
  axis_overrun_mm: 6.0
  # Chuỗi lỗ mở trong hình: đặt cao hơn cốt sàn bao nhiêu (mm thật).
  opening_chain_z_mm: 550
  # Chuỗi đứng bậu/cửa đặt cách mép cửa sổ, mm giấy.
  window_chain_offset_mm: 4.0
