    # Lượt thật 03718834 (05/10/2026): lượt sửa bị gạt mà câu nhắc không nói vì sao — mô hình trả lại đúng cách sửa
    # vừa bị gạt, lượt dừng vì lặp. Dòng này nói lỗi chính của lượt bị gạt.
    revision_setback_why: '- That set-aside revision failed on: {why} Do not repeat that fix; solve the problem below another way.'
    balcony_side_missing: '- The client wants a balcony on the {side} side, but none of the balconies touches that side of the storey; draw one with its long side along the {side} edge.'
    # T112: có ban công chạm mặt ấy nhưng chỉ ở góc (8eaaee7b vòng 4–5 kẹt vì câu trên nói «không cái nào chạm»).
    balcony_side_missing_corner: '- The client wants a balcony on the {side} side. "{room}" touches that side only at a corner and its long side is not on it, so it does not count there — one corner balcony never covers two sides. Draw a separate balcony with its long side along the {side} edge.'
    balcony_side_missing_reshaped: '- Your sketch already runs "{room}" along the {side} edge; it became a corner block only because the program had to partition storey {reshaped} itself (problems above). Fix those and keep "{room}" as drawn.'
    balcony_side_missing_fitted: '- You drew "{room}" along the {side} edge, but fitted to the walls it came out as a block in the corner, too short along that edge; make it longer along the {side} edge and keep it clear of the corner.'
    balcony_side_corner: '- On the sketch the only balcony on the {side} side, "{room}", is a {along} × {across}-cell block in the corner; the plan will not count it for the {side} side. Run a balcony along the {side} edge, its long side on that edge.'
    balcony_side_not_wanted: '- The client allows balconies only on the sides listed in the brief, but "{room}" on storey {level} is on the {side} side; move it to an allowed side or drop it.'
    balcony_main_access: '- The client wants the main front balcony to open from {from}, but "{room}" on storey {level} does not; draw it against {from} (no `ensuite_of` to a bedroom unless the client chose the master bedroom).'
    balcony_main_depth: '- The client wants the main front balcony at least {need_m} m deep, but "{room}" on storey {level} is only {have_m} m; draw it deeper toward the inside of the house.'
    balcony_level_missing: '- The client wants a balcony on every upper storey, but storey {level} has none; draw one on an open face.'
    balcony_not_wanted: '- The client does not want any balcony, but the plan has {rooms}; give that space to the room behind it or leave it unbuilt.'
    elevator_missing: '- Storey {level} has no elevator shaft; draw the elevator cells on every storey, stacked exactly over the ones below.'
    elevator_too_small: '- The elevator shaft "{room}" on storey {level} is smaller than the {need} m² shaft the client''s lift maker needs; draw it bigger, on every storey.'
    elevator_too_narrow: '- The elevator shaft "{room}" on storey {level} is narrower than {need} cm; widen it, on every storey.'
    elevator_oversized: '- The elevator shaft "{room}" on storey {level} came out {short_cm} × {long_cm} cm, a strip; the client''s shaft is {width_m} × {depth_m} m — draw it as one compact block of the `min_cells` size for `elevator` (as many cells on each side as `min_side_cells` says), on every storey.'
    elevator_not_aligned: '- The elevator shaft "{room}" on storey {level} is not stacked over the one on storey {below}; draw it on exactly the same cells.'
    elevator_not_beside_stair: '- The client wants the lift next to the stair (one core), but on storey {level} "{room}" shares no wall with "{stair}"; draw the lift cells against the stair cells, on every storey.'
    elevator_not_facing_stair: '- The client wants the lift opposite the stair, across a corridor or hall, but on storey {level} "{room}" shares a wall with "{stair}"; put the hall between them.'
    elevator_no_common_hall: '- On storey {level} the lift "{room}" and the stair "{stair}" do not both touch the same corridor or hall; both must open onto one shared corridor or hall.'
    balcony_off_open_face: '- The balcony "{room}" on storey {level} has no long side on an open face; run its long side along the street or yard side, never along a neighbour''s wall.'

  # Phương án QUA cổng nhưng dưới ngưỡng điểm (`kb/plan_quality.yaml` `accept_percent`, T53): gửi lại ý
  # định kèm dòng của vài tiêu chí mất nhiều điểm nhất. `{rooms}` = mã phòng làm mất điểm (type_n).
  # Tiêu chí không có dòng ở đây (bậc thang, hộp kỹ thuật — chương trình tự dựng) thì không gửi.
  score_hints:
    A1: '- Drawn areas are far from the target areas ({rooms}); make the cells of each room match its target area.'
    A3: '- The altar room ({rooms}) must be on the top lived storey, never under or beside a wc.'
    A4: '- A storey with bedrooms has no wc ({rooms}); add one there.'
    A5: '- {rooms} are below the usual minimum area for their type; give them more cells.'
    A6: '- {rooms} are above the usual maximum area for their type; give them fewer cells.'
    B1: '- {rooms} are too narrow for their use; draw them wider.'
    B2: '- {rooms} are long strips; draw them closer to square.'
    C1: '- {rooms} are reached through a bedroom; give them their own access from a corridor or shared room.'
    C2: '- Circulation takes too much of the floor ({rooms}); shorten or narrow the corridors.'
    C3: '- From the front door to the stair you pass through {rooms}; put the stair next to the entry room or a corridor off it.'
    C4: '- Corridor {rooms} is too narrow; draw it wider.'
    C5: '- The stair is reached through the shop; give it its own access.'
    C6: '- The common wc {rooms} is several doors away from the living area; draw it off a short corridor near it.'
    C7: '- The common wc {rooms} is a long walk from the living area; draw it closer.'
    C8: '- Corridors are long for the few rooms they serve ({rooms}); shorten them.'
    D1: '- {rooms} get no window on an open side; draw them touching `knowledge.open_faces`.'
    D2: '- Bedroom {rooms} has no window and no balcony door at all; move it to touch `knowledge.open_faces`, or swap it with a room that needs no daylight.'
    D4: '- Laundry {rooms} has nowhere to dry clothes; put it beside a balcony or terrace (sharing a wall or a door), or on `knowledge.open_faces` with a window, or next to a drying yard if the brief has one.'
    D5: "- Balconies {rooms} are placed off: give each required side its own balcony, run it along one room's outer wall and no longer than that room, and do not wrap a balcony round a corner or join two at a corner."
    E2: '- The upper wc {rooms} is not above a wc or shaft of the storey below; keep wet rooms on one vertical stack.'
    C9: '- From the front door you cross {rooms} before reaching the living room; the front door must open into the living room or a hall.'
    C10: '- Corridor {rooms} leads to a single room; merge it into that room or make it serve several rooms.'
    C11: '- From the garage you reach the living room only through {rooms} or by going outside; put the garage beside the living room or hall, or on a corridor that leads straight to it.'
    C12: '- Corridor {rooms} is much wider than a corridor needs; draw it `knowledge.corridor_min_cells` cells wide, never wider, and give the rest to the rooms beside it.'
    C14: '- Circulation {rooms} is as large as a room; a corridor is a band `knowledge.corridor_min_cells` cells wide — give the rest to the kitchen, storage, wc or another room beside it.'
    D6: '- The main front balcony {rooms} opens only from a private room; open it from a corridor or the shared living space, and make it the largest balcony of that storey.'
    D7: '- The side balcony {rooms} is larger than the front balcony; keep side balconies small and give the space to the front one.'
    E5: '- The wet rooms {rooms} sit above a living, dining, sleeping or altar room of the storey below; move them over a wet room or a service room.'

# Lượt SỬA theo yêu cầu kỹ sư trên bản vẽ đã lưu (T53, 16/09/2026 — Haan: «giai đoạn tiếp theo là sửa
# trên bản vẽ hiện tại»). Mô hình KHÔNG vẽ lại: nó dịch câu chat thành thao tác trong một tập đóng
# (`contracts/ai-plan-edit`), chương trình áp lên cây đã lưu và cho qua cổng. Không gửi đầu bài, không
# gửi ảnh — bảng phòng/cửa đủ để hiểu câu chat, và rẻ hơn nhiều.
house_bands:
  # Đường v6 (T116, handoff v6 tổng hợp, Haan 04/10/2026): «LLM xếp dải, chương trình tính kích thước». Mô hình chỉ
  # quyết tổ chức (dải, thứ tự, ai chạm ai); bộ giải `ai/bands/solve.ts` tính mọi kích thước, ép thang tầng trên đúng
  # tầng 1, chọn cửa — nên luật bộ giải bảo đảm (lát kín, không chồng, chữ nhật, chong chóng, thang trùng tầng, vách
  # cửa, bội số 100) KHÔNG gửi mô hình. Cùng `knowledge`, `brief` với v5; thêm `<patterns>` của đúng loại nhà.
  system: |
    You are a senior Vietnamese residential architect. Lay out the house as BANDS: each storey is
    a list of bands from the street inward; each band is a list of cells from left to right as
    seen from the street. A program turns your bands into exact dimensions (it sizes every band
    and cell to meet the minimum areas, aligns the stair on every storey, and places the doors),
    then checks the plan. So you decide the organisation, not the numbers: which rooms share a
    band, their order, what touches what. Give a depth or width only when it matters — a corridor
    width, a fixed stair; depth 0 / no width means "let the program size it". Every mm you write
    is CLEAR (inside the walls), like every knowledge number; the program adds the walls.

    A cell is a string: a room id; "." for an unbuilt yard on the footprint edge; ids joined by "/"
    for a stack — rooms one behind the other inside that cell, street side first
    ("wc_1/light_well_1"), for a column of small rooms beside a deep one. In a stack only the
    FIRST room touches the band in front and only the LAST touches the band behind. A fixed clear
    width follows ":" ("gt_1:900", "THANG:2500").

    Write "THANG" where the stair is: on storey 1 you choose its band; on every upper storey put
    "THANG" in the band at the same depth from the street and on the same side. Every room must
    touch, along a shared wall, a room it can be entered from (knowledge.walk_through for this
    house type: corridors gt_, the stair, living, dining, kitchen, and the garage when listed), or
    its parent for en-suite rooms. A corridor cell keeps the same width in every band it runs
    through; split a long corridor into gt_ cells, one per band.

    <rules> must hold. <patterns> shows how this office organises this house type; adapt one.
    <knowledge> numbers are final. knowledge.priorities are the client's priorities, first is
    highest. Work in this order: parti → storey 1 bands → stair and wet stack → upper storeys band
    by band → check each room has a way in and a window face. If wishes conflict or the program
    does not fit, keep the rules, follow the priorities, and put each conflict as a question in
    assumptions (≤5, highest impact first). Vietnamese, short: variant_label; parti one sentence;
    rationale ≤2 sentences; design_notes ≤5 lines of ≤20 words. garage_room is "" without parking.
    The program lays out the roof (stair head, water tank, AC units, drying yard, terrace) from
    your top storey: do not return a "roof" level.

  resample: |
    Your previous answer could not be used. You are not shown it: produce FRESH bands for the whole
    house that avoid these problems.

    {avoid}

  revise: |
    REVISION. Your bands are below as <plan>. The program reports (storey, room, what is wrong):
    <errors>
    {avoid}
    </errors>
    Return ONLY the storeys you change, each with its FULL new list of bands (the delta schema);
    storeys you leave out stay as they are; a storey a line says passed is locked. doors_prefer adds
    preferred door pairs; cantilevers_upsert adds or moves balconies (depth 0 removes one); notes =
    one short Vietnamese line per fix.
    <plan>{intent}</plan>

  rules:
    - id: B_program
      when: always
      text: >-
        Use exactly the rooms of knowledge.program (ids as given; level "" = your choice of storey) plus
        ids with a prefix of knowledge.model_added (gt_ corridor, sanh porch, bc_ balcony; wc_, kho_,
        hkt_ only when needed). Each program room on its level; the program sizes it to min_m2.
      codes:
        [program_brief, band_unknown_room, band_room_twice, layout_unknown_id, layout_bad_level]
    - id: B_fit
      when: always
      text: >-
        Bands of a storey must fit the footprint depth; cells of a band must fit its width. Few rooms
        side by side in a narrow house: a room needs about its short side (knowledge.min_side_mm) across.
      codes:
        [
          band_too_deep,
          band_too_wide,
          band_cell_too_narrow,
          band_before_stair_too_deep,
          band_stair_clash,
        ]
    - id: B_access
      when: always
      text: >-
        Every room touches a walk-through room (knowledge.walk_through) or its parent along a wall at
        least knowledge.door_wall_mm long. Only corridors, the stair landing, living, dining and kitchen
        open off the stair. Nobody crosses a bedroom to reach another room.
      codes:
        [
          room_without_door,
          room_unreachable_on_level,
          arrange_no_hub_wall,
          door_from_stair,
          room_through_private,
          route_through_service,
          level_no_entrance,
        ]
    - id: B_stair
      when: storeys>=2
      text: >-
        One THANG on every storey, in the band at the same depth and side as storey 1; its band is
        about knowledge.stair.rect_min_mm deep; not in line with the front door. The first step is at a
        SHORT end of THANG: put a corridor, landing or the living/hall space across that end.
      codes:
        [
          band_stair_missing,
          stair_missing_on_level,
          stair_not_at_anchor,
          arrange_stair_too_short,
          stair_entry_long_side,
          stair_end_blocked,
        ]
    # Handoff sửa lỗi đợt 3 mục 3.1: luật «must» ở đây thì cổng bác; luật cổng chỉ trừ điểm mang `soft: true` (in sau dòng
    # «Scored, not rejected»). Phòng ở không mặt thoáng: CHẶN khi gia chủ xếp «lấy sáng» trong hai ưu tiên đầu (Haan chọn).
    - id: B_open
      when: always
      text: A balcony needs at least one side on a face marked open in knowledge.site.faces.
      codes: [balcony_off_open_face]
    - id: B_window
      when: light_first
      text: >-
        Every bedroom, study and altar room has a window: on a face marked open in knowledge.site.faces,
        onto the light well, a terrace or a balcony. A room in a middle band between blind walls has none.
      codes: [habitable_no_window]
    - id: B_window_soft
      when: not_light_first
      soft: true
      text: >-
        Bedrooms, study, altar and living rooms get a window on an open face, the light well, a terrace
        or a balcony.
      codes: [habitable_no_window]
    # Haan chấm lượt a68c50bb: giếng trời chỉ ở tầng 1, tầng trên không có — «quá tệ về mặt logic». Haan chọn CHẶN.
    - id: B_lightwell
      when: has:light_well
      text: >-
        Place the light well on the lowest storey that has it; the program repeats it at the same
        place on every storey above. There write "LW" in its column, or just the room beside it.
      codes: [light_well_not_stacked]
    # Haan chấm lượt a68c50bb (T116): bếp liền phòng ăn; giặt phơi gần sân thượng / ban công.
    - id: B_kitchen
      soft: true
      when: has:dining
      text: >-
        The dining room shares a wall with the kitchen (same band side by side, or touching bands).
      codes: [C13]
    - id: B_laundry
      soft: true
      when: has:laundry
      text: >-
        The laundry touches a terrace, roof terrace or balcony on its storey, to hang the washing out.
      codes: [D4]
    - id: B_cantil
      when: has_cantilever
      text: >-
        Cantilevered balconies only on faces in knowledge.balcony.cantilever_faces, depth ≤ its value,
        from a room in the band on that face; list them in cantilevers, not in bands.
      codes: [cantilever_bad, cantilever_dropped]
    - id: B_balcony
      when: has_balcony
      text: >-
        Every face in knowledge.balcony.required_faces gets its own balcony along that face; none on
        faces outside required_faces and optional_faces. The main front balcony is the largest, off a
        corridor or the living space; any other belongs to one room (bedroom, then laundry, then study).
      codes:
        [balcony_side_missing, balcony_side_corner, balcony_level_missing, balcony_forbidden_side]
    # Nhà ống (Haan chọn CHẶN, đợt 3 mục 3.2): WC / giặt tầng trên chỉ trên gara, WC, kho, thang, hộp kỹ thuật, sân.
    - id: B_wet
      when: profile:ong
      text: >-
        No wc or laundry over a kitchen, altar room, living, dining or bedroom one storey down: put each
        upper wc over the garage, a wc, a store, the stair or a shaft (the front bedroom's wc stays within
        the garage depth).
      codes: [wc_over_kitchen, wc_over_altar, wet_over_living]
    - id: B_wet_other
      when: not_profile:ong
      text: No wc over a kitchen or altar room one storey down.
      codes: [wc_over_kitchen, wc_over_altar]
    - id: B_wet_soft
      when: storeys>=2
      soft: true
      text: >-
        Avoid a wc or laundry over a living, dining or bedroom below; keep wet rooms in the same band and
        side on every storey.
      codes: [wet_over_living, E2]
    - id: B_parent
      when: has_parent
      text: A room with a parent in knowledge.program sits next to that parent (same band or a stack beside it).
      codes: [ensuite_door_wrong]
    # Handoff v6 sửa lỗi đợt 1, mục 3: hai luật lối vào chồng nhau ở nhà có gara là lối vào — mỗi ca chỉ một câu.
    - id: B_entry
      when: not_entry_via_garage
      text: >-
        entry_room is the storey-1 room with the front door, in the street band on the
        knowledge.site.entries.main side: living, a hall or a porch, never kitchen or dining.
      codes:
        [entrance_wrong_side, entry_room_boxed_in, door_no_outside_edge, door_outside_on_boundary]
    - id: B_entry_garage
      when: entry_via_garage
      text: >-
        entry_room = garage_1 when the garage is on the front-door side: people walk in beside the car, then
        into the living space in the next band.
      codes:
        [entrance_wrong_side, entry_room_boxed_in, door_no_outside_edge, door_outside_on_boundary]
    - id: B_altar
      when: has:altar_room
      text: >-
        Altar room on the storey the brief gives, opened from a corridor or hall; not next to a wc; no
        door or passage on the wall behind the altar.
      codes: [altar_beside_wc, altar_faces_wc, altar_door_behind]
    - id: B_garage
      when: has:garage
      text: Garage in the street band on the car entry side; garage_room = its id.
      codes: [vehicle_door_wrong_side]
    - id: B_elder
      when: has_for:ong_ba
      soft: true
      text: Elders' bedroom on its storey, quiet side, next to its en-suite wc.
      codes: []
    - id: B_open_pair
      when: has_open_pairs
      text: Only pairs in knowledge.open_pairs may be one open space (put them side by side in one band).
      codes: []
    - id: B_circ
      when: always
      soft: true
      text: >-
        Corridor cells (gt_) knowledge.corridor_min_mm wide (give w); no wider than needed.
      codes: [C12, C4, C2]

  # T3 (handoff v6 sửa lỗi đợt 1): chỉ giữ lời gia chủ và phần khảo sát chưa mã hoá — «Công trình», «Chỗ để xe…», «Thang,
  # lối vào…» đã có trong knowledge (site, parking, stair, levels_mm).
  brief_sections:
    - Gia chủ và tín ngưỡng
    - Kinh doanh tại nhà
    - Nếp sinh hoạt
    - Nhu cầu lưu trữ
    - Khảo sát hiện trạng
    - Lời gia chủ (nguyên văn)

  hints:
    band_unknown_room: '- "{rooms}" is not an id of knowledge.program and has no prefix of knowledge.model_added; use the program ids as given.'
    band_room_twice: '- Storey {level}: "{rooms}" appears twice; each room appears once per storey.'
    band_too_deep: '- Storey {level}: the bands need {short_mm} mm more depth than the footprint has; merge or shrink rooms, or move one to another storey.{bands_mm}'
    band_too_wide: '- Storey {level}: the fixed cells of one band are wider than the house; use fewer or narrower fixed cells.'
    band_cell_too_narrow: '- Storey {level}: "{rooms}" lacks {short_mm} mm of width; put fewer rooms side by side in that band, or stack them.'
    # Lượt thật 03718834 (05/10/2026): câu cũ «need X mm more than storey 1 leaves before its stair» nói về tầng 1 với
    # chính tầng 1 — mô hình không hiểu, trả lại y nguyên. Thang mọi tầng chung MỘT vị trí, nên câu nói về tổng chiều sâu.
    band_before_stair_too_deep: '- Storey {level}: the bands in front of THANG + THANG + the bands behind it are {short_mm} mm deeper than the house (every storey shares one stair position). Make the bands shallower: move a room to another storey, or place rooms side by side instead of one behind another.{bands_mm}'
    band_stair_clash: '- Every storey shares one stair position: {front_storey} has {front_mm} mm of bands in front of THANG, {back_storey} has THANG + {back_mm} mm of bands behind it — together {short_mm} mm deeper than the house. The storey out of line is {fix_storey}: {fix_how}, or move a room to another storey.{bands_mm}'
    band_no_access: '- Storey {level}: "{room}" has no way in — it touches only {neighbours}, none it can be entered from. Put a gt_ corridor (or its parent room) against it. In a stack only the FIRST room touches the band in front and only the LAST touches the band behind.'
    wet_over_living: '- Storey {level}: "{room}" sits over "{below}" one storey down; put this wc / laundry over the garage, a wc, a store, the stair or a shaft — e.g. keep the front bedroom''s wc within the garage depth.'
    habitable_no_window: '- Storey {level}: "{room}" has no window — it touches no open face, light well, terrace or balcony; move it to the street or back face, or against the light well.'
    band_level_missing: '- Storey {level} has no bands in your answer; give its full list of bands.'
    stair_end_blocked: '- Storey {level}: the {end} end of THANG (where the flight from below arrives or the next flight starts) touches no corridor, landing or living space; put one across that end — every storey uses the same stair position and direction.'
    light_well_not_stacked: '- The light well "{rooms}" of storey {level} is covered on storey {above}; repeat it at the same place and size on every storey above, open to the sky.'
    band_stair_missing: '- Storey {level} has no THANG; put it in the band at the same depth and side as storey 1.'
    # Câu nhắc của cổng `ai/tree/` cho đường dải — NGẮN, mô tả hiện trạng, không ra lệnh vẽ lại (handoff B5); thay câu
    # của bản phác lưới (nói «hàng / cột ô») khi khối này tráo vào chỗ `house_layout`.
    room_without_door: '- "{room}" has no way in: it touches only {neighbours}, none walk-through. Put it next to a gt_ corridor or the living/dining space, or beside its parent.'
    room_unreachable_on_level: '- "{room}" cannot be reached from {from}; link it through a walk-through room.'
    door_from_stair: '- "{room}" opens only onto the stair; put a gt_ corridor or landing cell between them.'
    door_wall_too_short: '- "{a}" and "{b}" share too short a wall for a door ({cm} cm needed); make them share a longer wall.'
    route_through_service: '- "{room}" is reached only through "{via}"; give it a way from the living space or a corridor.'
    room_through_private: '- "{room}" is reached only through the private room "{via}"; add a corridor cell.'
    arrange_room_below_brief_area: '- "{room}" got {area_m2} m², the client needs {min_m2} m²; give it more of its band (fewer rooms beside it) or move it.'
    arrange_room_too_narrow: '- "{room}" is too narrow for its use: put fewer rooms side by side in its band, or, if it is a long thin strip down a deep band, stack it with another room in its cell (stack) instead of running the full band depth.'

  # Mẫu dải theo loại nhà (handoff v6 mục 5) — chỉ chèn mẫu của loại đang thiết kế. Số trong ngoặc là mm gợi ý.
  patterns:
    # T4 (handoff v6 sửa lỗi đợt 1): nhà ống chèn MỘT mẫu — B khi đầu bài hỏi giếng trời (danh mục có `light_well`),
    # không thì A (`bandPatterns`, `plan.ts`). Không ghi số bề rộng THANG: số ấy là knowledge.stair.rect_min_mm (P0-1 —
    # mẫu từng ghi 2.400 / 2.700 trong khi rect_min 2.500). Số hành lang = mức thông thuỷ nhà ống (900), phép thử
    # `ai-v6-prompt-consistency.test.ts` canh mọi số `gt (N)` / `hub (N)` ≥ knowledge.corridor_min_mm.
    # T116 (Haan chấm lượt a68c50bb): mọi mẫu có sảnh / hành lang chạy NGANG đầu ngắn ô thang ở mọi tầng (bậc 1 và chỗ
    # bước ra giáp lối đi — không đi vào thang từ cạnh dài), bếp liền phòng ăn, WC xếp chồng cạnh thang (không thành dải
    # dài suốt dải), giếng trời giữ nguyên chỗ ở mọi tầng trên (light_well hay «.»), giặt phơi giáp sân thượng / ban công.
    # Mẫu ong_b là bộ dải viết tay đã qua cổng (`ai-v6-pipeline.test.ts` NHAONG_BANDS).
    # Handoff sửa lỗi đợt 2 (06/10/2026): bảng cạnh KTS (WC 1,1 · giếng trời 1,2 · ngủ 2,4 lọt lòng) — nhà 5 m với thang U
    # 2,5 m không còn chỗ cho [hành lang | THANG | ô bên]: dải thang chỉ [THANG | một ô xếp chồng], hành lang chạy dọc ở
    # các dải trước thang và một sảnh NGANG trước đầu ngắn ô thang. Mẫu ong_b là bộ dải viết tay đã qua cổng (65,2 điểm,
    # `ai-v6-pipeline.test.ts` NHAONG_BANDS). Mẫu tầng trên của handoff ([giếng trời | THANG | hành lang]) không vừa 5 m.
    ong_a: |
      Tube house, frontage 4–5.5 m — stair at the BACK:
        Storey 1: B1 [garage_1 (full width)] entry_room = garage_1; B2 [living_1]; B3 [kitchen | dining];
                  B4 [THANG | stack(wc_1, store)] — THANG's front end opens onto the kitchen/dining band.
        Upper:    B1 [gt (900) | stack(master bedroom, its wc)] (+ front cantilever balcony);
                  B2 [gt (900) | bedroom]; B3 [gt (full)] — landing across THANG's front end;
                  B4 [THANG | stack(wc, store)].
      Why: a 900 mm corridor along one side reaches every room in front of the stair; the landing in front of THANG
      is where the flight from below arrives and the next one starts.
    ong_b: |
      Tube house, frontage 4–5.5 m — stair at the BACK with a light well beside it:
        Storey 1: B1 [garage_1 (full)] entry_room = garage_1; B2 [living_1 (full)];
                  B3 [kitchen | dining] — kitchen and dining always side by side;
                  B4 [THANG | stack(wc_1, light_well_1)] — THANG's front end opens onto the dining band.
        Upper:    B1 [gt (900) | stack(front bedroom, its wc)]; B2 [gt (900) | back bedroom or study];
                  B3 [gt (full)] — landing across THANG's front end;
                  B4 [THANG | wc or store/LW] — LW = the storey-1 light well, kept in place by the program.
        Top:      B1 [terrace (full)]; B2 [gt (900) | laundry] — the laundry touches the terrace; B3 [gt (900) | altar room];
                  B4 [gt (900) | bedroom]; B5 [gt (full)] landing; B6 [THANG | wc/LW].
      Why: a U stair (2500) in a 5 m house leaves one column beside it — no corridor fits there next to a wc or a
      light well (knowledge.min_side_mm), so the corridor runs in front and the landing crosses THANG's front end.
      Straight stair (knowledge.stair.under_mm given): on storey 1 a small wc can sit UNDER the stair's high end —
      cell stack(THANG, wc_1), THANG first (the first step at the front); the wc is about under_mm long and opens
      onto the room beside the stair, never onto THANG.
    pho: |
      Town house, frontage 6–10 m, stair bay in the middle:
        Storey 1: B1 [garage_1 | sanh]; B2 [living_1 | THANG | kitchen_dining] — sanh in front of THANG's front end;
                  B3 [bedroom | wc strip].
        Upper:    B1 [bedroom | balcony]; B2 [hub (full width)] — landing across THANG's front end;
                  B3 [bedroom | THANG | wc]; B4 [bedroom | bedroom].
      Why: the stair bay splits the house into two wings; every door opens onto the hub at the stair head.
    bt: |
      Compact villa, two storeys, ≥ 10 m wide:
        Storey 1: B1 [garage | sanh | living]; B2 [store | gt | THANG | dining+kitchen] — sanh / living in front of
                  THANG's front end; B3 [elders' bedroom + wc | helper's room | wc_1].
        Storey 2: B1 [master bedroom + balcony | altar (front) | guest room]; B2 [wc_master | hub (landing in front of
                  THANG) | study]; B3 [child 1 | wc_2 | THANG | child 2] (+ laundry by the back balcony).
    vuon: |
      Garden house, one storey with a side corridor (rooms in a row along the blind side, corridor on
      the open side, ≥ 1.1 m, windows onto a side strip ≥ 1.2 m), or three bays
      [side bay | middle bay (living + altar) | side bay] behind a veranda ≥ 1.5 m deep.
    kd: |
      Shop on storey 1: B1 [shop (full width)]; B2 [shop_wc | shop store | THANG | residential lobby];
      B3 [kitchen_dining …]. If the shop may be rented, the residential lobby has its own street door
      and the stair is reached without crossing the shop.

house_layout:
  # Lời dẫn theo `prompt-mat-bang-v5.md` (Haan gửi 04/10/2026): mục 2 (lời dẫn hệ thống tĩnh), mục 3 (`rules` — catalog
  # có `when`, chương trình lọc theo ca và đánh số lại, `ai/layout-prompt.ts`), mục 6 (vòng sửa trả delta). Gốc toạ
  # độ là GÓC LÔ. Không viết «mặt thành thoáng khi lùi ≥ 2 m» của tài liệu: mặt thoáng còn cố định theo khảo sát.
  system: |
    You are a senior Vietnamese residential architect. From <brief> and <knowledge>, lay out
    the house: every room as an axis-aligned rectangle in mm, the doors, the open pairs and the
    cantilevered balconies. The program draws walls, windows and furniture and checks everything
    you return.

    Coordinates: mm, multiples of 100. Origin = the lot corner on the street, at the left as
    seen from the street; x runs along the street to the right, y runs away from the street.
    rect = [x, y, w, h], drawn on wall centrelines. Rooms on a storey tile its footprint with no
    overlap and no gap (an unbuilt part is simply outside the footprint, along its edge). One
    rectangle per room. Clear area ≈ (w − 200) × (h − 200): the program deducts the walls.

    <rules> must all hold. <knowledge> numbers are final: never use remembered values.
    <brief> holds the client's words; knowledge.priorities are the client's priorities, first
    is highest.

    Work in this order and write one short line per step in design_notes:
    1 site: decide the footprint and what stays unbuilt (yards, garden), on which faces;
    2 core: stair rectangle (same on every storey), wet rooms stacked;
    3 circulation: a hub at the stair head; a corridor only if needed;
    4 entries: porch, steps, car access;
    5 rooms: public front, private deep or upstairs; size each room by the furniture it must
      hold (knowledge.furniture, knowledge.clearances);
    6 check every rule, every minimum area and short side, every room reachable from the
      entry through doors; fix, then answer.
    Follow knowledge.strategy when it is given.

    If wishes conflict or the program does not fit, keep the rules, follow the client's
    priorities, and put each conflict as a question in assumptions (≤5, highest impact first).
    Vietnamese for variant_label, rationale (≤3 sentences), design_notes, assumptions.
    garage_room is "" without parking.

  resample: |
    Your previous answer could not be used. You are not shown it: produce a FRESH layout for the whole
    house that avoids these problems.

    {avoid}

  revise: |
    REVISION. Your plan is below as <plan>. It broke these checks (rule number, room, measured vs
    required):
    <errors>
    {avoid}
    </errors>
    Return ONLY the changes (the delta schema): rooms_upsert (full room objects you add or move),
    rooms_delete (ids), doors_add, doors_remove, cantilevers_upsert (depth 0 removes one), notes (one
    Vietnamese line per fix). Do not repeat unchanged rooms. Keep each storey tiling its footprint and
    every balcony the brief asks for. A storey a line says passed stays as it is.
    <plan>{intent}</plan>

  # Mục 3 của tài liệu, viết theo dữ liệu thật của kho. `codes` = mã lỗi cổng thuộc luật — câu nhắc vòng sửa mang số
  # luật. Thứ tự là thứ tự mô hình thấy.
  rules:
    - id: R_program
      when: always
      text: >-
        Use exactly the rooms of knowledge.program (ids as given; level "" = your choice of storey) plus
        ids you add with a prefix of knowledge.model_added (gt_ corridor, thang stair, sanh porch, bc_
        balcony; wc_, kho_, hkt_ only when needed). Each program room on its level, clear area ≥ min_m2,
        short side ≥ knowledge.min_side_mm of its type.
      codes:
        [
          program_brief,
          layout_unknown_id,
          layout_bad_level,
          arrange_room_below_brief_area,
          sketch_room_missing,
          arrange_room_too_narrow,
        ]
    - id: R_envelope
      when: always
      text: >-
        Every rect inside knowledge.site.envelope_mm; the storey-1 footprint ≤ knowledge.site.max_footprint_m2
        when given.
      codes: [rect_outside_block]
    - id: R_tile
      when: always
      text: >-
        On each storey the rects never overlap and leave no hole inside the footprint; rooms side by side
        share one wall line, so the storey splits into bands by straight wall-to-wall lines (no
        pinwheel). An en-suite room, store or wc is a strip along one side of its room, never inside it.
      codes:
        [
          rect_overlap,
          rect_gap,
          rect_too_small,
          rect_shape,
          sketch_not_rectangular,
          sketch_room_crooked,
          sketch_pinwheel,
          sketch_pinwheel_at,
          sketch_island_room,
          arrange_no_parti,
        ]
    - id: R_open
      when: always
      text: >-
        Habitable rooms on faces marked open in knowledge.site.faces; windows and balcony doors only on
        open faces.
      codes: [balcony_off_open_face]
    - id: R_cantil
      when: has_cantilever
      text: >-
        Cantilevered balconies only on faces in knowledge.balcony.cantilever_faces, depth ≤ its value,
        from a room whose outer wall is on that face; they take no floor area: list them in
        cantilevers, not in rooms. A balcony on a face without projection is a room rect inside the
        footprint.
      codes: [cantilever_bad, cantilever_dropped]
    - id: R_balcony
      when: has_balcony
      text: >-
        Every face in knowledge.balcony.required_faces gets its own balcony running along that face; no
        balcony on faces outside required_faces and optional_faces. The main front balcony is the largest,
        off a corridor or the living space; any other belongs to one room — bedroom, then laundry, then
        study — at most one per room, along that room's outer wall, not longer than it, never wrapping a
        corner.
      codes:
        [balcony_side_missing, balcony_side_corner, balcony_level_missing, balcony_forbidden_side]
    - id: R_stair
      when: storeys>=2
      text: >-
        One stair rect ≥ knowledge.stair.rect_min_mm, same x/y on every storey; not in line with the
        front door.
      codes:
        [
          arrange_anchor_conflict,
          stair_cells,
          sketch_core_overlap,
          arrange_stair_too_short,
          stair_not_aligned,
        ]
    - id: R_wet
      when: storeys>=2
      text: >-
        No wc over a kitchen or altar room one storey down; no wc or laundry over a living, dining or
        bedroom below; stack wet rooms.
      codes: [wc_over_kitchen, wc_over_altar, wet_over_living]
    - id: R_parent
      when: has_parent
      text: A room with a parent in knowledge.program opens only from that parent.
      codes: [ensuite_door_wrong]
    - id: R_doors
      when: always
      text: >-
        Every room has a door (a pair in doors) or an open pair to a corridor, the stair hub, living,
        dining or kitchen, or to its parent; the two rooms of a door share at least
        knowledge.door_wall_mm of straight wall. Only corridors, living/dining[[terrace|, the roof terrace]][[elevator|, the elevator]] open off
        the stair. Nobody crosses the garage or porch, or steps outside, to reach a wc, the kitchen or
        the stair.
      codes:
        [
          sketch_room_no_access,
          sketch_stair_isolated,
          sketch_stair_only,
          room_without_door,
          room_through_private,
          room_unreachable_on_level,
          arrange_unreachable,
          arrange_no_hub_wall,
          door_from_stair,
          route_through_service,
        ]
    - id: R_entry
      when: always
      text: >-
        entry_room is the storey-1 room with the front door, on the knowledge.site.entries.main side:
        living or a hall reached from the porch, never kitchen or dining.
      codes:
        [
          entrance_wrong_side,
          entry_room_boxed_in,
          door_no_outside_edge,
          door_outside_on_boundary,
          arrange_entrance_side,
        ]
    - id: R_entry_garage
      when: entry_via_garage
      text: >-
        Town house with the garage on the front-door side: the garage may be the entry_room — people walk in
        beside the car through a door next to the garage door, then straight into the living space behind
        it. Prefer this to putting the living room in front of the garage; never make the car pass through a
        room.
      codes: []
    - id: R_altar
      when: has:altar_room
      text: >-
        Altar room on the storey and facing the brief gives, opened from a corridor or hall; no shared
        wall with a wc, no wc door facing it.
      codes: [altar_beside_wc, altar_faces_wc, altar_door_back]
    - id: R_kitchen
      when: has:kitchen
      text: >-
        Kitchen on an open face with a window; kitchen and wcs in one service zone but never sharing a
        wall, doors not facing.
      codes: []
    - id: R_garage
      when: has:garage
      text: >-
        Garage on the car entry side (knowledge.site.entries.car), area ≥ its min_m2; garage_room = its
        id; a garage → store → kitchen/hall service route is preferred.
      codes: [vehicle_door_wrong_side]
    - id: R_elder
      when: has_for:ong_ba
      text: Elders' bedroom on its storey, quiet side, by its en-suite wc.
      codes: []
    - id: R_open_pair
      when: has_open_pairs
      text: Only pairs in knowledge.open_pairs may be one open space (open).
      codes: []
    - id: R_lift
      when: has:elevator
      text: >-
        The elevator rect is the same on every storey, beside the stair, opening onto the same corridor.
      codes:
        [
          elevator_missing,
          elevator_too_small,
          elevator_too_narrow,
          elevator_oversized,
          elevator_not_aligned,
          elevator_not_beside_stair,
        ]
    - id: R_roof
      when: has_roof
      text: >-
        Lay out the roof (level "roof"): the program puts the stair head over the stair with its door to
        the terrace. Place every roof id of knowledge.program inside the top storey's rooms (not over its
        balconies): water tank and solar over the wet stack, AC units away from the stair-head door,
        drying on the sunny open side; the rest is flat roof.
      codes: []
    - id: R_circ
      when: always
      text: >-
        Corridors (gt_) at least knowledge.corridor_min_mm wide and no wider than needed; a turn is a
        second rect meeting the first along its full width; circulation within
        knowledge.circulation_share of each storey when given.
      codes: [C12, C4, C2]

  # Mục của văn xuôi đầu bài giữ trong `<brief>` — phần còn lại đã thành `<knowledge>` (tài liệu mục 4: «brief rút gọn còn
  # lời gia chủ và các mong muốn chưa mã hoá»).
  brief_sections:
    - Công trình
    - Gia chủ và tín ngưỡng
    - Kinh doanh tại nhà
    - Nếp sinh hoạt
    - Nhu cầu lưu trữ
    - Chỗ để xe, khối nhà và sân
    - Thang, lối vào và cao độ nền
    - Khảo sát hiện trạng
    - Lời gia chủ (nguyên văn)

  hints:
    layout_unknown_id: '- "{room}" is neither an id of knowledge.program nor an id with a prefix of knowledge.model_added ({prefixes}); use the program ids as given.'
    layout_bad_level: '- "{room}" has level "{level}", which the house does not have; use "1", "2"… or "roof".'
    cantilever_bad: '- Cantilevered balcony "{room}" from "{from}" on the {face} face could not be built: {why}'
    cantilever_dropped: '- Cantilevered balcony "{room}" could not be attached: "{from}" does not keep its outer wall on the {face} face in the plan. Put that room against the {face} edge, or hang the balcony from a room that is there.'
    rect_shape: '- Room "{room}" has no usable rect: give it exactly [x, y, width, depth] in mm, width and depth above 0.'
    rect_outside_block: '- Room "{room}" at {rect} runs {out_mm} mm outside knowledge.site.envelope_mm {block}; keep every rect inside it — cantilevered balconies go in cantilevers.'
    rect_overlap: '- "{a}" {rect_a} and "{b}" {rect_b} overlap by {area_m2} m²; move the wall between them so they only touch.'
    rect_gap: '- The area {rect} belongs to no room (a hole inside the storey, next to {rooms}); give it to a neighbour or make a corridor of it.'
    rect_too_small: '- Room "{room}" at {rect} is too thin to draw; make both sides at least 600 mm.'
    arrange_zone_overfull: '- Too many rooms were crowded in the {zone} part of the block ({rooms}); spread them over the storey.'
    arrange_no_hub_wall: '- Room "{room}" ({zone} part) ended up touching no corridor or shared room it may open off (it touched: {hubs}); place it against one and give it a `door` relationship with it.'
    arrange_room_below_brief_area: '- Room "{room}" came out at {area_m2} m² but the client requires at least {min_m2} m²; make its rect bigger.'
    arrange_room_below_brief_area_tight: '- Room "{room}" came out at {area_m2} m² but the client requires at least {min_m2} m²; its rect needs about {need_m2} m², and no single neighbour ({tight}) can give that much without dropping below its own minimum — the stair, lift and corridors give none. Rearrange the bands of this storey so the area comes from the rooms with spare area: {spare}; rooms the client gave no minimum may also shrink. Keep the stair and lift where they are.'
    arrange_room_below_brief_area_cells: '- Room "{room}" came out at {area_m2} m² but the client requires at least {min_m2} m²; its rect needs about {need_m2} m² — take it from a neighbour that has spare area.'
    arrange_anchor_conflict: '- The stair "{room}" must sit exactly over the stair below; give it the same rect as the storey below.'
    arrange_no_parti: '- No arrangement could be built from this storey; lay its rects out in clear bands of rooms.'
    sketch_room_missing: '- This storey leaves out {rooms}; give every room of the storey a rect.'
    sketch_not_rectangular: '- {rooms} overlap other rooms so they are no longer one rectangle; make the rects only touch.'
    sketch_room_crooked: '- {rooms} overlap other rooms so they are no longer one rectangle; make the rects only touch.'
    sketch_pinwheel: '- This storey is a pinwheel with no wall-to-wall dividing line; lay it out as bands of rooms.'
    sketch_pinwheel_at: '- This storey has no wall-to-wall dividing line in {area}: the nearest line, {line}, is cut by {rooms}. Make each of those rooms stay on one side of that line (a corridor is one straight band, not a T), so the area splits into bands.'
    sketch_rooms_too_small: '- This storey puts too many rooms side by side in one band; spread them over more bands.'
    sketch_row_too_narrow: '- {rooms} stand side by side across the storey; together they need at least {need_m} m ({each}) but the storey is only {have_m} m wide. Place them one behind the other along the depth, each across the width it needs.{garage}'
    sketch_island_room: '- {rooms} sit completely inside another room, so they have no way out; place them touching a corridor or an outside wall.'
    sketch_stair_isolated: '- The stair "{stair}" touches no corridor or shared room — it only touches {touching}, so nobody can step off it on this storey. Put the corridor (or the living space) against the stair along at least {door_mm} mm. A lift beside the stair opens onto that same corridor; it never sits between the stair and the corridor.{also}'
    sketch_replaced: '- Your layout of storey {level} failed the checks below, so the program partitioned that storey itself and moved rooms away from where you placed them — the problems after these lines may come from that. Fix storey {level} first so the program can keep your layout.'
    sketch_below_replaced: '- Your layout of storey {level} failed the checks below, so the program partitioned that storey itself and fitted storey {above} to that partition, not to your layout. Fix storey {level} too.'
    sketch_core_overlap: '- "{core}" must sit exactly at {rect}, where the one on the storey below was built; {rooms} is placed there and vanishes — move it off, keeping its size.'
    stair_cells: '- "{core}" is fixed at {rect}, where the stair of the storey below was built: give it exactly that rect, and lay the corridor along it, so every room is reached without crossing the stair.'
    sketch_stair_only: '- {rooms} can only be entered from the stair; only corridors, the living/dining space, the roof terrace and the elevator open off the stair — give each at least {door_mm} mm of wall on a corridor or shared room.'
    sketch_room_no_access: '- {rooms} have no way in. {detail} Each needs at least {door_mm} mm of straight shared wall with a corridor or shared room that leads to the stair (see Access), and a `door` relationship with it; run the corridor to it, or move the room onto the corridor. Keep the way in of: {keep}.{also}'
    door_outside_on_boundary: '- "{room}" needs a door to the outside but only touches a neighbour''s side; place it touching the street edge (y = 0) or another open side, with no other room between it and that side.'
    balcony_side_missing_reshaped: '- Your layout already runs "{room}" along the {side} edge; it became a corner block only because the program had to partition storey {reshaped} itself (problems above). Fix those and keep "{room}" as placed.'
    balcony_side_corner: '- The only balcony on the {side} side, "{room}", is a {along_mm} × {across_mm} mm block in the corner; the plan will not count it for the {side} side. Run a balcony along the {side} edge, its long side on that edge.'
    elevator_missing: '- Storey {level} has no elevator shaft; give it the same elevator rect on every storey, stacked exactly over the one below.'
    elevator_oversized: '- The elevator shaft "{room}" on storey {level} came out {short_cm} × {long_cm} cm, a strip; the client''s shaft is {width_m} × {depth_m} m — give it one compact rect of the `min_rooms` size for `elevator`, on every storey.'
    elevator_not_aligned: '- The elevator shaft "{room}" on storey {level} is not stacked over the one on storey {below}; give it exactly the same rect.'
    elevator_not_beside_stair: '- The client wants the lift next to the stair (one core), but on storey {level} "{room}" shares no wall with "{stair}"; place the lift rect against the stair rect, on every storey.'
  score_hints:
    A1: '- Rooms are far from their target areas ({rooms}); size each rect to the clear area the room needs.'
    A5: '- {rooms} are below the usual minimum area for their type; make their rects bigger.'
    A6: '- {rooms} are above the usual maximum area for their type; make their rects smaller.'
    C12: '- Corridor {rooms} is much wider than a corridor needs; make it `knowledge.corridor_min_mm` wide and give the rest to the rooms beside it.'
    C14: '- Circulation {rooms} is as large as a room; a corridor is a band `knowledge.corridor_min_mm` wide — give the rest to the kitchen, storage, wc or another room beside it.'
    D6: '- The main front balcony {rooms} opens only from a private room; open it from a corridor or the shared living space, and make it the largest balcony of that storey.'
    D7: '- The side balcony {rooms} is larger than the front balcony; keep side balconies small and give the space to the front one.'

plan_edit:
  system: |
    You edit an existing house floor plan for a Vietnamese architect. <plan> lists every storey:
    rooms as id, Vietnamese name, clear area m², rectangle x0,y0,x1,y1 in metres (origin at the
    front-left corner, x along the street, y deeper into the lot), and doors as the two rooms they
    join with their kind. <request> is the architect's instruction in Vietnamese.

    Turn it into the fewest operations that do exactly what is asked; change nothing else. Every
    operation has every field; unused fields are null.
    - move_door: level, room, to (a room sharing a wall with `room`, or "outside"), place (start = the
      end of that wall with smaller x or y, end = larger, middle).
    - open_wall: level, a, b. Remove the wall between two rooms that share one.
    - close_wall: level, a, b. Remove the door or opening between a and b.
    - swap_rooms: level, a, b. The two rooms exchange places.
    - resize_room: level, room, area_m2.
    - move_wall: level, a, b, delta_m. Move the wall between a and b; positive makes a larger.
    - window: level, room, on.
    - relayout: level, request (English). Only when the request needs a different arrangement that
      the operations above cannot express.
    The stair cannot move. Put what you cannot do in `unsupported` (Vietnamese). `explanation`: one
    or two Vietnamese sentences on what will change. Output only the JSON object.
  user: |
    <plan>
    {plan}
    </plan>
    <request>{request}</request>
  retry: |
    The operations you returned could not be applied:
    {issues}
    Return corrected operations for the same request.

# Tờ mặt bằng công năng CÓ NỘI THẤT, do mô hình ảnh vẽ TỪ ẢNH NEO (T57, 19/09/2026).
#
# ⚠️ Đọc trước khi sửa khối này: việc này đã làm một lần ở T21 (10/09) và bị T22 gỡ hẳn ngày
# 12/09. Bản T21 CỐ Ý không gửi ảnh, mô hình chỉ nhận chữ — nên nó vẽ một ngôi nhà khác với ngôi
# nhà đã xếp. Khác biệt DUY NHẤT của T57 là ảnh neo: chính tờ mặt bằng đã dựng từ toạ độ, gửi kèm
# lời gọi. Vì thế câu «the attached drawing is the authority» trong `system` không phải một câu
# lịch sự — nó là toàn bộ lý do khối này được sống lại. Bỏ nó đi là quay về T21 mà vẫn tốn tiền.
#
# Haan chốt 19/09: mô hình viết CẢ chữ lẫn số. Đánh đổi đã biết và đã chấp nhận — tờ này không đo
# được, dấu tiếng Việt có thể hỏng. Tờ vector vẫn là tờ chính trên màn hình.
#
# `title_block` là cửa DUY NHẤT chữ đi từ hồ sơ ra ngoài, nên luật của nó viết ở hai nơi: trong
# `system` dưới đây và trong hàm dựng lời dẫn (`ai/sheet-image.ts`, không nhận `projectId`).
sheet_image:
  system: |
    You draw a presentation floor plan sheet for a Vietnamese residential design-build office.
    The sheet is shown to the home owner, not to a builder.

    A reference line drawing of this exact storey is attached. THE ATTACHED DRAWING IS THE
    AUTHORITY. Every wall, door, window, stair and room boundary in it is already in the right
    place. Redraw that same plan as a finished presentation sheet. Do not move, add, remove,
    merge, split or resize any room, wall, door, window or stair. Keep the same outline, the same
    proportions, the same orientation and roughly the same framing.

    Draw it as a top-down orthographic plan, as an architectural visualiser would:
    - Walls cut solid in a dark tone, clearly heavier than any other line.
    - A different floor material per room type — timber boards in bedrooms, large tiles or stone
      in living and dining, small tiles in bathrooms and kitchen, paving outside.
    - Furniture drawn from above and sized to the room it sits in: beds with bedside tables in
      bedrooms, sofa and coffee table in the living room, a dining table with the right number of
      chairs, kitchen counters and island, sanitary ware in bathrooms, wardrobes against walls,
      a car in the garage. Leave circulation clear; do not block a door with furniture.
    - Outside the building outline: garden planting, trees, hedges, paved paths and steps.
    - Soft shadows and a light, warm, photographic finish. No people.

    Write the text ON the sheet, in Vietnamese with full diacritics, and copy it exactly as given:
    - Each room name in upper case inside its own room, with its area on the line below it.
    - The dimension chains along the top and left edges, drawn exactly where they appear in the
      reference drawing. Copy each figure from the reference drawing itself. If a figure there is
      not legible to you, draw that segment WITHOUT a number — never make a number up. The two
      overall figures given below are the totals each chain must add up to; use them to check
      yourself, and write them on the outermost chain.
    - A north arrow, a graphic scale bar, and a title block in the bottom-left corner containing
      only the lines given to you.

    The title block may contain NOTHING else. Never write a client name, an address, a project
    code or number, a date, a signature, a stamp, a logo or a company name — invent none of them.
    Write no text anywhere on the sheet other than the room names, their areas, the dimension
    figures, the north letter, the scale bar figures and the title block lines given to you.
  user: |
    Storey: {level_name}

    Rooms, with the name to write, the area to write under it, and the real size of the room —
    the furniture you draw in each room must fit that size, at the same scale as the rest of the
    sheet:
    {rooms}

    Overall building footprint: {footprint}.
    Overall dimension figures to write on the chains: {dimensions}.
    North points {north}.

    Title block lines, in this order and with nothing added:
    {title_block}
    {style}
  # Bảng `styles` (mã phong cách → một câu tiếng Anh nối vào cuối lời dẫn) KHÔNG còn ở đây từ T175:
  # Worker dựng nó từ `prompt.interior` của `kb/style_catalogue.yaml` lúc nạp (`withStylePrompts`).
  # Thiếu mã nào thì bỏ hẳn mệnh đề, không thay bằng câu mặc định: đoán phong cách hộ khách là việc
  # của kiến trúc sư.
  # Câu trình duyệt in ĐÈ LÊN PIXEL. Tiếng Việt có chủ đích — nó đọc cho người xem tấm ảnh, không
  # đọc cho mô hình. Bản đầy đủ hơn hiện bằng chữ trong trang là `AI_DISCLAIMERS.aiSheetImage`.
  watermark: 'Ảnh minh hoạ do AI vẽ — không đo được trên hình'

# Ý tưởng MẶT ĐỨNG mặt tiền (T59, 19/09/2026 — Haan chốt: chỉ mặt tiền, một ý tưởng mỗi lượt).
# Bản 8.8.0 thêm `<requirements>`: phiếu yêu cầu kỹ sư điền trên màn hình (Đợt F2). Mục REQUIRED được
# `ai/facade/merge.ts` áp thẳng sau lượt gọi; lời dẫn nói ra để mô hình dựng phần còn lại cho hợp.
#
# Mô hình chỉ TRANG TRÍ (T16): khung nhà, cao độ, lỗ mở và ban công suy từ mặt bằng đã chọn, gửi vào
# đây dưới nhãn LOCKED. Nó chọn mái, vật liệu, màu, cổng, rào và các mảng trang trí; mọi mã phải lấy
# từ danh sách <codes> (`kb/facade_vocabulary.yaml`), chương trình kiểm lại (`ai/facade/check.ts`).
# Toạ độ mảng trang trí là số mô hình khai — chương trình kiểm chúng nằm trong khung và không đè cửa.
facade:
  system: |
    You design the FRONT ELEVATION of a house for a Vietnamese residential design-build office.
    The floor plans are already fixed. <frame> gives the facade you must dress: its width, the
    floor levels, and the LOCKED openings and balconies taken from those plans. You cannot move,
    add, remove or resize any opening, balcony or storey. Your job is only the exterior finish.

    Coordinates are whole centimetres: x runs along the street from the same origin as the plan,
    z is height with 0 at the ground-floor finished level (the pavement is below 0).

    Decide:
    - style: keep the brief's style when it gives one.
    - roof: type, pitch (null for flat), material and colour.
    - materials: one entry per zone you use — at least `body`; add base, accent, trim, railing,
      gate, fence, main_door, side_door, window, garage_door as the design needs.
      Every colour is a code from the colour list; clear glass is `trong_suot`, never free text.
    - palette: primary, secondary and optional accent colours as #RRGGBB, matching your colours.
    - gate and fence: only when <frame> says there is a front yard; otherwise null.
    - balcony_railing: one railing code when <frame> lists balconies, otherwise null.
    - parapet: height above the roof slab for a flat roof; null lets the program use its default.
    - roof_outline: null unless the roof type is mixed.
    - elements: decorative pieces inside the facade, each given as the rectangle [x0, z0, x1, z1]
      that BOUNDS it — canopies over openings, columns, cladding panels, louvres, planters,
      cornices, eaves bands (a horizontal fascia band under a pitched roof, painted a different
      colour from the wall), finials (a small ornament on the ridge), reveals (a recessed
      horizontal groove 15-30 mm deep in the render), arches (the head of a doorway: the program
      draws an arc springing from z0 at both ends to the crown at z1), oculi (a round window: the
      program draws the largest circle inside the rectangle) and porch_roofs (a gabled roof over
      the entrance porch: the program draws a triangle with its ridge at the middle of z1 — add
      `column` pieces under it for the posts). Only canopies, louvres, arches and porch roofs may
      overlap an opening. Keep them few and purposeful; each refers to a material by index or null.

    <requirements> lists what the architect has already decided. Every REQUIRED item is binding: use
    exactly that code or value, and design the rest of the facade to suit it. Door and window zones
    (main_door, side_door, window, garage_door) take their material from the door materials list.

    Use ONLY codes listed in <codes>. Write `rationale` in Vietnamese with full diacritics: two or
    three sentences on why this facade suits the brief. Output only the JSON object.
  user: |
    <brief>
    {brief}
    </brief>
    <frame>
    {frame}
    </frame>
    <requirements>
    {requirements}
    </requirements>
    <codes>
    {codes}
    </codes>
  retry: |
    Your previous answer could not be used:
    {issues}
    Return the whole facade again with these problems fixed. Keep everything else the same.
  # Lượt gọi lại vì ĐIỂM, không vì lỗi (T63). Câu trả lời trước HỢP LỆ — nó chỉ chưa giống thói quen
  # vẽ đo được trên hồ sơ thật. Phải nói khác `retry`: bảo mô hình rằng nó «không dùng được» trong
  # khi nó dùng được là dạy sai, và lượt sau nó sẽ đổi cả những thứ đang đúng.
  retry_habits: |
    Your previous answer was valid, but it did not match how this design office usually draws:
    {issues}
    Return the whole facade again, changing ONLY what these notes ask for. Keep every other choice
    exactly as it was.

# Ảnh MẶT ĐỨNG CÓ VẬT LIỆU, do mô hình ảnh vẽ TỪ ẢNH NEO (T59 Đợt E, 20/09/2026).
#
# Cùng khuôn với `sheet_image` (T57): ảnh neo là chính tờ mặt đứng vector dựng từ toạ độ (không khung
# tên), nên «the attached drawing is the authority» là toàn bộ lý do khối này tồn tại. Mọi vật liệu,
# màu, mái, cổng ghép từ ý tưởng mặt đứng ĐÃ LƯU (`ai/facade/image.ts`) — mô hình ảnh chỉ tô vẽ.
#
# Khác tờ mặt bằng có nội thất ở một điểm: ảnh này KHÔNG viết chữ nào. Tờ vector đã mang cao độ, chuỗi
# kích thước và bảng vật liệu; bắt mô hình ảnh chép lại là thêm một chỗ sai dấu, sai số mà không thêm
# thông tin gì cho khách.
facade_image:
  system: |
    You render the FRONT ELEVATION of a house for a Vietnamese residential design-build office, as a
    presentation image for the home owner.

    A reference line drawing of this exact front elevation is attached. THE ATTACHED DRAWING IS THE
    AUTHORITY. Every storey line, door, window, garage door, balcony railing, canopy, planter, column,
    louvre, roof line, gate and fence in it is already in the right place and at the right size.
    Redraw that same elevation as a finished image. Do not move, add, remove, widen or heighten any
    opening, and do not change the number of storeys, the roof shape or the overall proportions.
    Keep the same straight-on, orthographic front view and roughly the same framing.

    Apply the materials and colours given below, each on its own zone. Glass reads as glass,
    timber as timber, stone as stone. Daylight, soft shadows, a clear sky, a little planting at the
    base. No people, no cars in front of the facade.

    THE FENCE MUST NOT RUN ACROSS ANY ENTRANCE. Where the drawing leaves a gap in the fence line in
    front of the front door or the garage door, leave that gap open in your image too: a car has to
    be able to drive into the garage and a person has to be able to walk to the front door. Gates and
    fences stand in front of the house exactly where the drawing shows them, at the same widths — a
    gate that is drawn in front of the garage stays in front of the garage.

    Write NO text, numbers, dimension lines, level marks, labels, logos or watermarks on the image —
    ignore the dimension chains and level marks of the reference drawing; they are not part of the
    building.
  user: |
    Style: {style}
    Roof: {roof}
    Materials by zone:
    {materials}
    Colour palette: {palette}
    Balcony railing: {railing}
    Gate and fence: {gate_fence}
    Decorative elements already in the drawing: {elements}
  # Bảng `styles` (mã phong cách → cụm tiếng Anh cho MẶT NGOÀI) KHÔNG còn ở đây từ T175: Worker dựng
  # nó từ `kb/style_catalogue.yaml` lúc nạp — `prompt.exterior` kèm chi tiết nên có / nên tránh
  # (`exteriorStylePhrase`). Dùng chung cho ảnh mặt đứng, ảnh phối cảnh và ảnh từ bản vẽ kỹ sư.
  # Thiếu mã thì ghi «as the materials suggest» — không đoán phong cách hộ.
  # Mã kiểu mái (hợp đồng `ai-facade-concept`) → cụm tiếng Anh. Thiếu mã thì ghép nguyên mã.
  roofs:
    flat: 'flat roof behind a parapet'
    hip: 'hipped roof'
    gable: 'gable roof with the gable end facing the street'
    thai: 'steep Thai-style hipped roof'
    japanese: 'low-pitched Japanese-style hipped roof with wide eaves'
    mansard: 'mansard roof'
    mixed: 'combination roof exactly as drawn'
  # Câu trình duyệt in ĐÈ LÊN PIXEL — tiếng Việt, cho người xem tấm ảnh. Bản dài hơn hiện bằng chữ
  # trong trang là `AI_DISCLAIMERS.aiFacadeImage`.
  watermark: 'Ảnh minh hoạ do AI vẽ — không đo được, màu chỉ để hình dung'

# ── Bộ ảnh phối cảnh (T67, 20/09/2026) ────────────────────────────────────────────────────────
#
# Năm góc cùng MỘT ngôi nhà. Cách giữ chúng cùng một nhà là ẢNH NEO, không phải lời dẫn: góc
# `front_day` vẽ từ tờ mặt đứng vector, bốn góc còn lại cầm chính tấm `front_day` làm tham chiếu.
# Hai góc `oblique` và `aerial` nhận thêm tờ mặt bằng mái, vì tờ mặt đứng không có chiều sâu.
#
# Lời dẫn ở đây chỉ làm ba việc: nói góc máy, nói ánh sáng, và nhắc lại vật liệu. Vật liệu KHÔNG
# viết ở đây — nó sinh từ `ai_facade_concept` qua `facadeLook()`, dùng chung với `facade_image`.
# Hai bản mô tả song song là đường chắc chắn dẫn tới hai bộ ảnh lệch màu.
# Ảnh vẽ từ BẢN VẼ KỸ SƯ TẢI LÊN (T114 Đợt 4, 03/10/2026). Cùng mục đích với `sheet_image` và
# `facade_image`, khác ở nguồn: ảnh neo là bản kỹ sư đã sửa (hoặc tự vẽ) xuất từ CAD — không có toạ độ,
# không có danh sách phòng, không có ý tưởng mặt đứng. Nên lời dẫn không kể phòng hay vật liệu theo
# vùng như hai khối kia; mô hình đọc thẳng bản vẽ. Vật liệu mặt đứng lấy từ phần Mặt đứng của đầu bài.
#
# Bản vẽ thật hay mang khung tên. Kỹ sư phải xác nhận đã cắt trước khi tải lên (máy chủ chặn), nhưng
# lời dẫn vẫn dặn mô hình không chép chữ nào của khung tên — hai lớp, vì cắt sót là chuyện thường.
