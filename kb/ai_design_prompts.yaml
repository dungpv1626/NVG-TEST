    no_yard: >-
      The building stands on the front boundary line, right at the pavement. There is no front yard
      at all: no gate, no fence, no parked vehicle between the facade and the street.
  # Mỗi góc: nhãn tiếng Việt cho màn hình, câu tả góc máy, câu tả ánh sáng.
  #
  # `label_vi` là chỗ DUY NHẤT đặt tên tiếng Việt cho góc — màn hình đọc từ đây qua Worker, không
  # viết cứng danh sách nào (cùng lối với danh mục mặt đứng ở `facade_vocabulary.yaml`).
  views:
    front_day:
      label_vi: 'Mặt tiền ban ngày'
      shot: 'the house seen straight on from the street in the morning'
      sun_time: 'morning'
      camera: |
        Straight on from the street, camera at eye level on the far pavement, the whole house and
        the full width of the front boundary in frame, a strip of pavement and road along the
        bottom. Very slight perspective only — the facade reads almost flat, as in the drawing.
      lighting: |
        Clear morning light a couple of hours after sunrise, {sun}, soft shadows under the eaves
        and balconies, blue sky with a few light clouds.
    front_night:
      label_vi: 'Mặt tiền buổi tối'
      shot: 'the same straight-on street view, after dark'
      camera: |
        The same straight-on view from the street as the reference render, same distance, same
        framing. Nothing about the building changes.
      lighting: |
        After dark, deep blue evening sky. Warm light inside the rooms showing through the
        windows and the glass of the front door, downlights washing the facade and the entrance,
        the house number area and the gate lit. Street lighting outside. Materials keep the same
        colours as the daytime render, read under warm light.
    oblique:
      label_vi: 'Góc nghiêng'
      shot: 'a three-quarter view of the house from the street'
      sun_time: 'morning'
      camera: |
        Three-quarter view from the street, camera at eye level, moved about 35 degrees to one
        side so that the front and one side wall are both visible. The whole building and the
        front boundary stay in frame. Use the attached roof plan to get the depth of the house
        and which way the side wall runs — the house is {depth_note}.
      lighting: |
        Same clear morning light as the daytime render, {sun}, soft shadows.
    aerial:
      label_vi: 'Toàn cảnh từ trên cao'
      shot: 'the house and its whole plot seen from above'
      sun_time: 'midday'
      camera: |
        From above and in front, the camera tilted down about 55 degrees, looking at the front
        and one side of the house. The whole plot is in frame: the building, the roof, the front
        yard, the gate and the fence line, and the road in front. The attached roof plan shows
        the exact footprint, the roof and where the gate and the fence sit — match it.
      lighting: |
        Midday to early afternoon light, {sun}, short shadows, roof surfaces clearly lit.
    gate_close:
      label_vi: 'Cận cảnh cổng và cửa chính'
      shot: 'a close view of the gate and the front entrance'
      sun_time: 'afternoon'
      camera: |
        Close view from the pavement of the gate and the ground-floor entrance behind it, taken
        slightly off to one side. The frame holds the gate, the path to the front door, the front
        door itself and the bottom of the first floor above it. The upper storeys are cropped.
      lighting: |
        Warm late-afternoon light, {sun}, long soft shadows across the paving.
    balcony_close:
      label_vi: 'Cận cảnh ban công tầng 2'
      shot: 'a close view of the second-floor balcony'
      sun_time: 'afternoon'
      camera: |
        Close view of the second-floor balcony, camera raised to about the balcony floor level
        and slightly to one side. The frame holds the balcony, its railing, the doors opening
        onto it and a little of the wall above and below. The ground floor is cropped.
      lighting: |
        Warm late-afternoon light, {sun}, long soft shadows.
    axonometric:
      label_vi: 'Khối trục đo'
      shot: 'a parallel-projection massing view of the house'
      camera: |
        Parallel projection of the whole building seen from above one corner, no perspective
        convergence, the plot shown as a flat plane under it.
      lighting: 'Even, shadowless studio light.'
  # Hai câu cho ô tắt/bật người và xe. Cây cối KHÔNG nằm ở đây — ảnh không có cây thì không ra
  # ảnh trình khách, nên cây luôn có ở cả hai câu.
  life:
    on: |
      Planting along the boundary and by the entrance. {vehicles} parked inside the plot, clear
      of the garage opening and not blocking the front door. One or two people going about their
      business on the pavement, small in frame, faces not in focus.
    off: |
      Planting along the boundary and by the entrance. No people anywhere, no cars, no
      motorbikes, no bicycles — inside the plot or on the street.
    # Dùng thay `on` khi sân trước NGẮN HƠN một thân xe. Câu `on` bảo «đỗ trong thửa», và với sân
    # 3 m thì mô hình nới sân ra cho vừa chiếc xe thay vì bỏ chiếc xe đi (lỗi thật 20/09/2026).
    on_tight_yard: >-
      Planting along the boundary and by the entrance. The front yard is too short to park a car
      across it, so any car stands in the street at the kerb or sits half inside the open garage;
      motorbikes may stand in the yard. Vehicles in the picture: {vehicles}. One or two people
      going about their business on the pavement, small in frame, faces not in focus.
  # Câu tả số xe khi ô người-xe đang bật. `{cars}` và `{motorbikes}` do chương trình điền từ đầu
  # bài; không khai xe nào thì dùng `none`.
  vehicles:
    cars: '{cars} car{s}'
    motorbikes: '{motorbikes} motorbike{s}'
    none: 'A car'
  # Loại công trình → một cụm tiếng Anh. Quyết định nhà đứng một mình hay kẹp giữa hai nhà khác.
  building_types:
    nha_pho: 'Vietnamese row house on a narrow street plot'
    biet_thu: 'detached villa standing free on its plot'
    nha_vuon: 'garden house standing free with planting around it'
  # Hiện trạng một phía thửa đất → một cụm tiếng Anh. Mã phải khớp `kb/site_context.yaml`; thiếu
  # mã thì phía ấy KHÔNG được nhắc trong lời dẫn (không đoán hộ).
  neighbours:
    nha_hang_xom: 'a neighbouring house built right up to the boundary'
    hem_2m: 'a narrow 2 m lane'
    hem_3m: 'a 3 m lane'
    duong_lon: 'a main road'
    dat_trong: 'an empty plot'
    ao_ho: 'a pond'
  # Hướng nhà (mã `B`, `BD`, `D`… của đầu bài) → câu tả nắng chiếu vào đâu. Thiếu hướng thì dùng
  # `unknown`: nói ánh sáng chung, KHÔNG đoán một hướng nắng.
  sun:
    front: 'the sun in front of the house, lighting the facade straight on'
    left: 'the sun coming from the left, raking across the facade'
    right: 'the sun coming from the right, raking across the facade'
    back: 'the sun behind the house, the facade in soft open shade'
    unknown: 'the sun placed so the whole facade is evenly lit'
  # Câu trình duyệt in ĐÈ LÊN PIXEL. Bản dài hơn hiện bằng chữ trong trang là
  # `AI_DISCLAIMERS.aiImageSet`.
  watermark: 'Ảnh phối cảnh do AI dựng — không đo được, vật liệu và màu chỉ để hình dung'

# ── Ảnh NỘI THẤT MỘT PHÒNG vẽ thẳng từ ĐẦU BÀI (B3b, 30/10/2026 — anh Dũng) ─────────────────────────
#
# Bộ ý tưởng gặp khách cần ảnh nội thất mà chưa có mặt bằng. Khác `sheet_image` (T57): KHÔNG có ảnh neo
# — chưa có mặt bằng để làm neo — nên đây là HÌNH DUNG không gian theo phong cách, không phải bố trí của
# một mặt bằng thật. Kiến trúc sư chọn MỘT phòng trong danh sách phòng đầu bài khai; Worker ghép lời dẫn
# từ loại phòng, tầng, diện tích, phong cách (`prompt.interior` của `kb/style_catalogue.yaml`, qua
# `sheet_image.styles`) và vài câu nếp sinh hoạt dưới đây. Dữ liệu gửi đi là hạng 2: đầu bài đã lược danh
# tính, không mã hồ sơ, không tên người.
#
# Chỗ điền bắt buộc của `user`: {room} {floor} {area} {household} {style}.
room_image:
  system: |
    You render ONE interior visualisation of a single room for a Vietnamese residential design-build
    office, as an idea image to show the home owner before the floor plan is drawn.

    Draw a photographic, eye-level view of the room described below, as an interior visualiser would:
    natural daylight from windows, soft shadows, realistic materials, furniture sized to the floor area
    given (a 12 m2 bedroom is not a hotel suite). The room belongs to a town house or villa in Vietnam:
    tropical climate, ceiling fans or split air conditioners, tiled or timber floors, no fireplace.

    Draw no people and no pets in the image. Write NO text, numbers, labels, logos, signatures or
    watermarks anywhere in the image.
  user: |
    Room: {room}
    Storey: {floor}
    Floor area: {area}
    Household: {household}
    {style}
  # Loại phòng (mã `kb/room_vocabulary.yaml`) → cụm tiếng Anh. CHỈ những loại có ở đây mới hiện trong ô chọn
  # phòng — thang, lõi kỹ thuật, gara, giếng trời, hành lang không phải nội thất để trình khách.
  rooms:
    living: 'living room'
    dining: 'dining room'
    kitchen: 'kitchen'
    bedroom: 'bedroom'
    master_bedroom: 'master bedroom'
    wc: 'bathroom'
    altar_room: 'ancestral altar room (Vietnamese family worship room)'
    study: 'home office / study'
    study_area: 'study corner'
    dressing_room: 'walk-in dressing room'
    terrace: 'roof terrace with planting'
    shop: 'small street-front shop'
  # Thành phần gia đình (`family[].role`) → cụm tiếng Anh, ghép với số người.
  roles:
    ong_ba: 'grandparent(s)'
    vo_chong: 'adult(s) of the main couple'
    con: 'child(ren)'
    khach: 'guest(s)'
    nguoi_giup_viec: 'live-in helper(s)'
  # Câu nếp sinh hoạt: `when` = `đường.dẫn=giá trị` trên đầu bài đã lược danh tính; `rooms` vắng = mọi phòng.
  # Chỉ câu ĐÃ trả lời mới ra — không đoán nếp nhà khách.
  notes:
    - when: 'lifestyle.cooking=nau_nhieu_chien_xao'
      rooms: [kitchen, dining]
      en: 'The family cooks a lot of stir-fried food: show a strong range hood and easy-to-clean surfaces.'
    - when: 'lifestyle.cooking=it_nau'
      rooms: [kitchen, dining]
      en: 'The family cooks little: a compact, tidy kitchen is enough.'
    - when: 'lifestyle.dining_place=quay_bep'
      rooms: [kitchen, dining]
      en: 'Meals are taken at a kitchen counter or island.'
    - when: 'lifestyle.living_dining_kitchen=lien_thong_ca_ba'
      rooms: [living, dining, kitchen]
      en: 'Living, dining and kitchen are one open space; show the other two in the background.'
    - when: 'lifestyle.reduced_mobility=true'
      en: 'Someone in the family has reduced mobility: keep wide clear paths and no steps inside the room.'
    - when: 'lifestyle.pets=cho'
      en: 'The family keeps a dog: durable, easy-to-clean floor and fabrics.'
    - when: 'lifestyle.pets=meo'
      en: 'The family keeps a cat: durable, scratch-resistant fabrics.'
    - when: 'lifestyle.pets=cho_va_meo'
      en: 'The family keeps a dog and a cat: durable, easy-to-clean floor and fabrics.'
    - when: 'household.religion=phat_giao'
      rooms: [altar_room]
      en: 'A Buddhist family: a calm altar with a Buddha statue above the ancestral altar.'
    - when: 'household.religion=cong_giao'
      rooms: [altar_room, living]
      en: 'A Catholic family: a small Christian altar instead of incense burners.'
    - when: 'storage.level=nhieu'
      en: 'The family needs a lot of storage: show generous built-in cabinets.'
