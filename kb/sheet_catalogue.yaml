# Danh mục LOẠI TỜ trong một bộ hồ sơ nhà ở NVG — thước đo phạm vi của engine.
#
# Nguồn: đọc ATTRIB khung tên của sáu tệp DXF thuộc hai hồ sơ thật, ngày 05/09/2026.
# Chi tiết cách đo: `doc/design/13-ho-so-thuc-te.md` mục 13.4 và 13.14.
#
# ── Tệp này dùng để làm gì ─────────────────────────────────────────────────────────────
# Mục tiêu cuối là "thiết kế được TOÀN BỘ các loại bản vẽ" (Haan, 05/09/2026). Không có
# danh mục đóng thì câu đó không đo được, và "engine đã làm được bao nhiêu" mãi mãi là
# cảm tính. Đây là mẫu số của chỉ số đó.
#
# ── Vì sao là DỮ LIỆU ──────────────────────────────────────────────────────────────────
# Danh mục sẽ dài thêm: hai hồ sơ này đều là nhà phố 5 tầng của NVO. Biệt thự, nhà xưởng
# NVC, hay hồ sơ có tầng hầm sẽ mang thêm loại tờ chưa có ở đây. Thêm một loại là sửa tệp
# này, không sửa mã.
#
# ── Trường `engine` ────────────────────────────────────────────────────────────────────
#   co            engine sinh được trọn vẹn và phát hành được
#   nen           engine chỉ chuẩn bị NỀN hình học; kỹ sư có chứng chỉ tính, kiểm và ký.
#                 Đây là bất biến #9 (CLAUDE.md 8.2), KHÔNG phải hạn chế tạm thời
#   chep          nội dung lặp lại giữa các hồ sơ, sinh ra là CHÉP chứ không phải thiết kế
#   chua          chưa làm
#
# ⚠️ `nen` không bao giờ chuyển thành `co` bằng cách viết thêm mã. Nó chỉ đổi nếu NVG đổi
#    quy trình ký, và đó không phải quyết định của phần mềm.

version: '1.0.0'

do_duoc:
  ho_so: ['HS-01 (nhà phố 5 tầng + phòng KTTM)', 'HS-02 (nhà phố, 5 tầng)']
  so_to: { HS-01: 170, HS-02: 95 }
  kho_giay: A3 # ca 265 to
  ty_le_thuong_gap: ['1:70', '1:60', '1:100', '1:40', '1:30', '1:20']
  ghi_chu: >-
    Cả hai đều là nhà phố liền kề do NVO thiết kế. Danh mục dưới đây CHƯA phủ biệt thự,
    nhà có tầng hầm, hay công trình công nghiệp của NVC.

