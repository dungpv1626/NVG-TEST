# Mức BÁM ĐẦU BÀI của nhánh AI — tham số của cổng kiểm chương trình không gian (13/09/2026).
#
# Haan chốt: «sinh không gian sáng tạo nhưng phải sát với đầu bài, không được conflict». Nên:
#  · phần đầu bài ĐÃ KHAI (tầng ghim, diện tích ghim, khép kín, nhu cầu riêng, số xe, khoảng sân)
#    là ràng buộc — mô hình trượt thì một lượt sửa, vẫn trượt thì bác;
#  · phần đầu bài KHÔNG khai (phòng không ghim diện tích, số phòng phụ, giao thông, sân trong…)
#    là chỗ mô hình sáng tạo.
#
# ⚠️ Đây KHÔNG phải ngưỡng quy chuẩn (`rules/`). Số ở đây nói «lệch bao nhiêu thì coi là không
# còn là yêu cầu của gia chủ nữa», và số chỗ đỗ là SỐ THAM KHẢO (Haan, 13/09/2026: «số liệu từ hồ
# sơ mang tính tham khảo, không ép buộc») — sửa ở đây, không phải sửa mã.

version: '1.2.0'

# Loại không gian mô hình CHỈ được đề xuất khi đầu bài có hỏi tới (T96, Haan 27/09/2026: «những gì
# không khai trong đầu bài thì hạn chế bịa thêm vào»). Lượt 4a521f52 tự thêm giếng trời cho một nhà
# hai tầng có sân vườn rộng — không ai hỏi, và câu dẫn chiến lược cũ còn gợi ý nó. «Có hỏi tới» nghĩa
# là: một dòng «Không gian gia chủ yêu cầu» mang loại ấy, hoặc một dòng `demands.spaces` dưới đây (bác
# hay cảnh báo đều tính) có loại ấy trong `any_of`, hoặc đầu bài khai thang máy (loại thang máy).
# Phòng phụ mà nhà nào cũng cần (hành lang, WC chung, kho, giặt) KHÔNG nằm ở đây — mô hình vẫn tự thêm.
only_when_asked: [light_well, courtyard, terrace, shop, elevator]

# Diện tích phòng đầu bài khai là mức TỐI THIỂU (Haan, 13/09/2026) — không dùng sai số: nhỏ hơn là
# bác, lớn hơn là tự do. Sai số dưới đây chỉ còn áp cho CHỖ ĐỂ XE so với số xe, vì diện tích mỗi xe
# là số tham khảo.
area_tolerance_ratio: 0.2

# Diện tích chỗ đỗ tối thiểu mỗi xe, m² — tham khảo, gồm cả lối lùi xe tối thiểu trong chỗ để xe.
parking:
  car_m2: 15
  motorbike_m2: 2.5

# Loại không gian được làm phòng KHÉP KÍN trong một phòng ngủ (`ensuite_of`). Không nằm trong danh
# sách này thì không được khép kín — lượt chạy thật từng cho thấy khép kín là chỗ để một phòng lớn
# né tổng diện tích tầng.
ensuite_child_types: [wc, vanity, closet, dressing_room, balcony, study_area]

# Loại phòng làm phòng MẸ của phòng khép kín.
ensuite_parent_types: [bedroom, master_bedroom]

# Loại không gian giao thông đứng phải có ở MỌI tầng khi nhà từ hai tầng.
stair_types: [stair, core]

# Tiện ích nằm TRONG phòng ngủ, không tách thành không gian riêng (Haan, 13/09/2026: «tủ đồ hay
# không gian học tập, phòng thay đồ trong phòng ngủ thì không cần tách riêng, chỉ cần ghi gộp lại
# … diện tích này cũng nằm ở trong phòng»). Cùng danh sách với `in_bedroom` của
# `kb/space_norms.yaml` (bộ giải) — có phép thử canh hai bên không lệch nhau. Nhánh AI: mô hình được
# dặn gộp; lỡ tách thì Worker gộp lại vào phòng mẹ trước khi kiểm (`ai/program.ts`).
in_bedroom_types: [study, study_area, closet, dressing_room]

# Nhu cầu riêng của thành viên được đáp ứng bởi những loại không gian nào. Vắng một mã thì chỉ
# chính loại đó mới tính. «Góc làm việc» (`study`) trong phòng ngủ thường là một góc học tập
# khép kín (`study_area`), không phải một phòng làm việc riêng cho mỗi người.
need_equivalents:
  study: [study, study_area]

# ══ ĐÒI HỎI SUY TỪ ĐẦU BÀI (T65, 22/09/2026) ═══════════════════════════════════════════
#
# Haan: «mặt bằng phải theo sát yêu cầu đầu bài, không được làm thiếu hoặc sai so với đầu bài».
#
# Từ T62 đầu bài hỏi 98 câu, nhưng chỉ BA nhóm cũ từng thành ràng buộc kiểm được: danh sách
# không gian, thành phần gia đình, số xe. Chín nhóm trường mới — thang máy, ban công, lối vào,
# lưu trữ, nếp sinh hoạt, tín ngưỡng, kỹ thuật, dự trù — chỉ tới mô hình dưới dạng CÂU VĂN trong
# `brief/narrative.ts`. Câu văn thì mô hình bỏ qua được mà không ai biết: không có phép kiểm nào
# hỏi lại, nên một đầu bài khai «làm thang máy ngay» vẫn ra mặt bằng không có thang máy và vẫn
# qua cổng, vẫn được chấm điểm, vẫn đúc thành artifact bất biến.
#
# Bảng dưới đây biến chúng thành đòi hỏi tất định. Mã đọc bảng này ở `ai/brief-demands.ts`;
# ở đây chỉ có SỐ và CỜ, không có logic.
#
# ⚠️ Chỉ suy từ câu ĐÃ TRẢ LỜI. Trường bỏ trống không sinh đòi hỏi nào — «chưa hỏi» khác «trả
# lời không» (cùng lẽ với `yesNo()` của `brief/narrative.ts`), và đoán hộ gia chủ đúng là thứ
# T41 cấm.
#
# ⚠️ `blocking: true` nghĩa là BÁC PHƯƠNG ÁN và tốn thêm một lượt gọi mô hình. Chỉ đặt cho thứ
# gia chủ TỰ KHAI thành một không gian hay một con số. Suy đoán nghề nghiệp thì `blocking:
# false`: nó thành cảnh báo trên màn hình, không loại phương án (Haan, T52 — «chỗ bất hợp lý của
# một bản vẽ cụ thể thì sửa bằng ô yêu cầu, đừng biến thành luật»).
demands:
  # ── Thang máy ────────────────────────────────────────────────────────────────────────
  # `vertical.elevator`: `lam_ngay` làm ngay · `chua_cho` chừa chỗ lắp sau · `khong` không làm.
  #
  # Hai giá trị đầu đều đòi MỘT Ô CHỒNG KHÍT QUA MỌI TẦNG, cùng kích thước, cùng vị trí — khác
  # nhau ở chỗ ô ấy hôm nay có cabin hay còn để trống. Chừa chỗ mà chừa lệch tầng thì không phải
  # chừa chỗ: sau này đục sàn vẫn không có giếng thẳng.
  elevator:
    # Mã phòng RIÊNG, tách khỏi `core` ngày 22/09/2026 — xem ghi chú ở `kb/room_vocabulary.yaml`.
    space_type: elevator
    # Kích thước giếng KHÔNG còn đoán theo tải (bảng 2,2 / 2,5 / 3,2 m² và cạnh 1,4 m đã gỡ, Haan
    # 25/09/2026: «diện tích thang máy nên yêu cầu điền thông tin ở đầu bài thay vì đoán»). Gia chủ khai
    # bề rộng × chiều sâu lọt lòng giếng theo hãng thang (`vertical.elevator_shaft_*_m`); thiếu thì đầu
    # bài báo mâu thuẫn nghiêm trọng `thang_may_thieu_kich_thuoc` và chưa dựng được phương án.
    # Nhãn của ô khi gia chủ mới chỉ CHỪA CHỖ — nhãn này đi vào bản vẽ, nên phải nói đúng sự
    # thật: hôm nay nó là một ô trống, không phải một cái thang máy.
    reserved_label: 'Ô chừa thang máy (lắp sau)'
    # Loại phòng tính là «hành lang / sảnh chung» khi kiểm KIỂU BỐ TRÍ thang máy đầu bài khai
    # (`vertical.elevator_position`, Haan 25/09/2026): kiểu «cạnh thang bộ» đòi thang máy và thang bộ
    # cùng giáp một phòng loại này; kiểu «đối diện» đòi hai ô không chung vách mà cùng giáp một phòng
    # loại này. Cùng tinh thần `passage.through` của `kb/room_vocabulary.yaml`, trừ ô thang (`core` là
    # lõi thang bộ, không phải sảnh).
    hall_types: [circulation, living, dining]
    # Hai ô «chung vách» / «cùng giáp» khi đoạn vách chung dài ít nhất chừng này, m — đủ một cửa đi 0,8 m.
    # Là DUNG SAI ĐO để phân biệt «chạm góc» với «chung một mảng tường», không phải định mức.
    layout_min_shared_m: 0.8
    # Giếng thang máy TO hay DÀI vô lý so với kích thước gia chủ khai thì bác (lượt chạy thật 913bc2ad,
    # 25/09/2026: mô hình vẽ giếng 1 × 4 ô cho giếng 1,3 × 1,4 m; bộ xếp căn ra 1,6 × 6,45 m). Một giếng
    # là một khối gần vuông: cạnh dài không quá `shaft_max_aspect` lần cạnh ngắn, diện tích không quá
    # `shaft_max_area_ratio` lần diện tích khai. Tỉ lệ diện tích cố ý rộng: bản phác ô 1 m vẽ giếng
    # 1,3 × 1,4 m thành 2 × 2 ô = 4 m² theo tim tường, tức 2,2 lần — vẫn phải qua. Dài quá mới là lỗi.
    shaft_max_aspect: 1.6
    shaft_max_area_ratio: 2.5

  # ── Ban công ─────────────────────────────────────────────────────────────────────────
  # `balconies.scope`: `moi_tang` · `chi_mat_tien` · `theo_tung_phong` · `khong_co`.
  # `balconies.sides`: mặt nào có ban công — front / back / left / right.
  balcony:
    space_type: balcony
    # Ban công đòi từ tầng này trở lên. Tầng 1 «ban công» là sân hay hiên, không phải ban công.
    from_level: 2
    # Loại không gian ngoài trời tính là chỗ phơi nắng được.
    drying_types: [balcony, terrace]
    # Bề sâu tối thiểu KHÔNG khai ở đây — đã có `usable.min_side_m.balcony` của
    # `kb/construction_norms.yaml`, và hai chỗ cùng một con số là hai chỗ sẽ lệch nhau.
    #
    # Mức đua ra ngoài ranh cũng KHÔNG khai ở đây: nó lấy thẳng `balconies.projection_m` của
    # đầu bài. Gia chủ khai đua mà không khai đua bao nhiêu thì KHÔNG dựng mặc định — mặt bằng
    # giữ ban công trong ranh và nói ra là đầu bài còn thiếu số (`ban_cong_dua_ranh_chua_ro_duong`
    # của `brief-completeness.ts` đã hỏi đúng câu ấy).

  # ── Chỗ để xe theo CỠ xe ─────────────────────────────────────────────────────────────
  # `parking.car_size`. Vắng thì dùng `parking.car_m2` ở đầu tệp như trước.
  # Vẫn là SỐ THAM KHẢO như cả mục `parking` (Haan, 13/09/2026) — nới bởi `area_tolerance_ratio`.
  car_m2_by_size:
    gam_thap: 15
    gam_cao: 16.5
    xe_7_cho: 17
    ban_tai: 18

  # ── Câu trả lời nào đòi không gian nào ───────────────────────────────────────────────
  #
  # Mỗi dòng: gia chủ trả lời thế này thì mặt bằng phải có không gian kia. `any_of` nghĩa là một
  # trong các loại ấy là đủ — đừng ép đúng một mã khi hai mã cùng đáp ứng được.
  #
  # `blocking: true` chỉ dành cho câu gia chủ tự khai thành một không gian. So sánh hai dòng
  # cuối để thấy ranh giới: «bếp phụ» là gia chủ nói thẳng cần thêm một cái bếp — bác được;
  # «nấu nhiều chiên xào» là nghề nghiệp suy ra nên có bếp kín — cảnh báo thôi.
  spaces:
    - code: phong_tho_rieng
      answer: 'household.altar_arrangement = phong_tho_rieng'
      any_of: [altar_room]
      blocking: true
      say: 'Đầu bài khai thờ cúng ở phòng thờ riêng'
    - code: tho_san_thuong
      answer: 'household.altar_arrangement = tren_san_thuong'
      any_of: [altar_room, terrace]
      blocking: true
      say: 'Đầu bài khai thờ cúng trên sân thượng'
    - code: kinh_doanh_tai_nha
      answer: 'household.home_business.mode ∈ {cua_hang_mat_tien, san_xuat_nho, kho_hang}'
      any_of: [shop, storage]
      blocking: true
      say: 'Đầu bài khai có kinh doanh tại nhà'
    - code: van_phong_tai_nha
      answer: 'household.home_business.mode = van_phong_tai_nha'
      any_of: [study, shop]
      blocking: true
      say: 'Đầu bài khai làm văn phòng tại nhà'
    - code: wc_cho_khach
      answer: 'household.home_business.customer_wc = true'
      any_of: [wc]
      blocking: true
      say: 'Đầu bài khai cần khu vệ sinh cho khách'
    - code: bep_phu
      answer: 'lifestyle.second_kitchen = true'
      any_of: [kitchen]
      count: 2
      blocking: true
      say: 'Đầu bài khai có bếp phụ'
    - code: kho_do_nhieu
      answer: 'storage.level = nhieu'
      any_of: [storage]
      blocking: true
      say: 'Đầu bài khai nhu cầu lưu trữ nhiều'
    - code: hop_ky_thuat_cuc_nong
      answer: 'systems.aircon_outdoor = hop_ky_thuat'
      any_of: [shaft, technical]
      blocking: true
      say: 'Đầu bài khai đặt cục nóng điều hoà trong hộp kỹ thuật'
    - code: cho_phoi_ngoai_troi
      answer: 'lifestyle.drying ∈ {phoi_nang_ngoai_troi, ca_hai}'
      any_of: [balcony, terrace, courtyard]
      blocking: true
      say: 'Đầu bài khai phơi đồ ngoài trời'
    - code: bon_nuoc_mai
      answer: 'systems.water_storage ∋ bon_mai'
      any_of: [terrace]
      blocking: false
      say: 'Đầu bài khai có bồn nước trên mái — cần chỗ đặt và lối lên'
    - code: bep_kin_chien_xao
      answer: 'lifestyle.cooking = nau_nhieu_chien_xao'
      any_of: [kitchen]
      blocking: false
      say: 'Đầu bài khai nấu nhiều chiên xào — bếp nên kín và có mặt thoáng thoát mùi'
    - code: khach_o_lai
      answer: 'lifestyle.overnight_guests = true'
      any_of: [bedroom, study]
      blocking: false
      say: 'Đầu bài khai có khách ở lại qua đêm — nên có một phòng dùng được để ngủ'
    - code: lam_viec_tai_nha
      answer: 'lifestyle.work_from_home = true'
      any_of: [study, study_area]
      blocking: false
      say: 'Đầu bài khai có làm việc tại nhà'
    # Gia chủ chọn «sân trong» ở khoảng sân — đó là câu duy nhất của đầu bài mở đường cho một sân trong
    # (`only_when_asked`). Không bác: sân trong có thể là khoảng lùi, không nhất thiết là một ô trong nhà.
    - code: san_trong
      answer: 'massing.yards ∋ san_trong'
      any_of: [courtyard, light_well]
      blocking: false
      say: 'Đầu bài khai có sân trong'

  # ── Cảnh báo suy từ đầu bài, KHÔNG bác phương án ─────────────────────────────────────
  # Nghề nghiệp, không phải lời gia chủ. Chúng hiện lên màn hình cạnh mặt bằng để kiến trúc sư
  # quyết, đúng ranh giới T49/T52.
  warnings:
    # Người đi lại khó khăn mà nhà nhiều tầng lại không thang máy.
    di_lai_kho_khan_khong_thang_may: true
    # Người đi lại khó khăn mà lối vào còn bậc tam cấp và không có dốc.
    di_lai_kho_khan_con_bac: true
    # Dự trù nâng thêm tầng thì thang bộ phải lên được tới sân thượng.
    du_tru_nang_tang_thang_khong_len_mai: true
    # Nền nhà thấp hơn mặt đường ở nơi từng ngập.
    nen_thap_hon_duong_noi_ngap: true
    # Khai có bậc tam cấp mà không khai cốt nền lẫn số bậc — mặt bằng không vẽ được bậc (T70).
    bac_tam_cap_thieu_so: true
