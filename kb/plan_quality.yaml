# ═══════════════════════════════════════════════════════════════════════════════
#  THƯỚC CHẤM MẶT BẰNG CÔNG NĂNG — trọng số và công thức
# ═══════════════════════════════════════════════════════════════════════════════
#
#  Phiên bản thước: score_version 4 (T27; 2 = thêm D3 ban công, T91; 3 = T96: C9 cửa chính
#                   đón vào đâu, C10 hành lang phục vụ gì, E5 khu ướt đè lên đâu, trọng số
#                   trong nhóm, sàn theo nhóm; 4 = T105 D2 phòng ngủ tối, C11 gara → khách;
#                   T107 D4 giặt phơi có chỗ phơi; 5 = T113 C12 hành lang rộng quá mức,
#                   D5 ban công bố trí lệch)
#  Nguồn:           bộ đo trên hồ sơ thật của NVG, 12/09/2026
#                   /home/haan/Documents/Doc/NVG/design/mat_bang_cong_nang
#  Cơ sở dữ liệu:   2 dự án NVO, 6 mặt bằng độc lập (P1 nhà vườn 2 tầng,
#                   P2 nhà phố 5 tầng). n tối đa 6, n theo DỰ ÁN tối đa 2.
#
#  ── TỆP NÀY GIỮ GÌ, VÀ KHÔNG GIỮ GÌ ──────────────────────────────────────────
#
#  GIỮ: trọng số nhóm, công thức, ngưỡng «đạt» và «trừ hết» của từng tiêu chí, số
#  mẫu `n`, và nhãn [ĐO]/[CHUNG].
#
#  KHÔNG GIỮ: ngưỡng theo MÃ PHÒNG. Kích thước tối thiểu và tỷ lệ dài/rộng tối đa
#  của từng loại phòng đã nằm ở `rules/nvg-experience.yaml` và
#  `rules/nvg-measured.yaml`; bộ chấm tra theo `predicate` + `target` ở đó và
#  KHÔNG chép số sang đây. Chép sang là tạo bản thứ hai sẽ lệch — đúng bài học
#  tối 10/09/2026, khi trần `strategy` của hợp đồng (200) lệch khỏi ý đồ bố cục
#  thật (241–301) vì không ai đối chiếu hai tệp dữ liệu với nhau.
#
#  ⚠️ Ranh giới dễ hỏng ở T20: hai gói quy tắc MẶC ĐỊNH TẮT CẢ HAI, nhưng bộ chấm
#  vẫn phải chấm được B1/B2 khi kỹ sư không tích gì — hình dáng phòng không phải
#  thứ bật tắt bằng ô tích. Phân vai: bộ chấm LUÔN đọc ngưỡng kích thước từ tệp
#  quy tắc; ô tích chỉ quyết định hai việc KHÁC — có tiêm vào lời dẫn hay không,
#  và có hiện thành cảnh báo thói quen hay không. Cùng một con số, hai người đọc.
#
#  ── ĐIỂM KHÔNG PHẢI ĐIỂM CHO THIẾT KẾ ────────────────────────────────────────
#
#  Nó đo đúng những gì hình học đo được. Một mặt bằng hay vẫn có thể 70 điểm, và
#  một mặt bằng vô hồn vẫn có thể 90. Nó dùng để XẾP HẠNG ứng viên và CHỈ CHỖ
#  YẾU, không bao giờ thay bước kỹ sư xem bằng mắt — và theo T35 thì điểm KHÔNG
#  gác cổng xuất DXF theo cả hai chiều: điểm cao không tự mở, điểm thấp không
#  chặn.
#
#  ── «CHƯA ĐỦ DỮ LIỆU» KHÔNG PHẢI 0 ───────────────────────────────────────────
#
#  Tiêu chí thiếu đầu vào trả về RỖNG, không trả 0, và trọng số của nó KHÔNG được
#  chia lại cho các nhóm còn lại. Điểm tổng vì vậy luôn đi kèm `scored_weight` —
#  «72 trên 85 phần trọng số đã chấm được», không phải «85 điểm». Hiện 0 đọc như
#  «vi phạm hết», không đọc như «chưa đo» (CLAUDE.md 5.2).

version: '2026.09.4'

# Đổi công thức hay ngưỡng thì TĂNG số này. Không có nó thì bảng lịch sử so hai
# model bằng hai cái thước khác nhau mà không ai biết (T27).
score_version: 5

co_so_du_lieu: '2 dự án NVO, 6 mặt bằng độc lập — mọi ngưỡng [ĐO] là chỉ dấu, chưa phải chuẩn'

# Ngưỡng NHẬN phương án của luồng tự động, % điểm trên phần trọng số chấm được (T53, 16/09/2026 — Haan:
# «nên để ngưỡng 65/100, sau đó có một ô chat để kỹ sư đưa vào yêu cầu của họ sau khi review bản vẽ»).
# Qua cổng mà dưới ngưỡng thì dùng lượt sửa còn lại gửi mô hình các tiêu chí mất điểm nhất; hết lượt thì
# lưu phương án điểm cao nhất và nói rõ là dưới ngưỡng. Không phải chuẩn nghề — là chỗ dừng hợp lý để
# giao cho kỹ sư sửa tiếp bằng tay. Vắng = không có ngưỡng.
# 01/10/2026 — Haan: «hạ ngưỡng điểm xuống 60» (65 → 60).
accept_percent: 60

# Sàn theo NHÓM (T96, 27/09/2026): một nhóm chấm được mà dưới % này thì phương án coi như dưới ngưỡng,
# dù tổng vượt ngưỡng. Sáu mặt bằng đầu tiên qua ngưỡng đều có D1 = 0, E2 = 0, C7 = 0,24 — nhóm diện tích và
# hình dáng đã bù cho một tầng đi lại tệ, và Haan xem xong chấm «rất tệ». Kiến trúc sư không cộng bù
# như thế: một nhà đi lại hỏng thì to đẹp mấy cũng hỏng. Con số 40 là SUY LUẬN (n = 0): thấp hơn 50 để
# một tiêu chí mất trắng (D1 nhà phố chỉ đo hai phòng) chưa kéo cả nhóm xuống, đủ cao để nhóm mất
# quá nửa thì phải sửa. Vắng = không có sàn.
accept_group_floor_percent: 40

# Sàn riêng từng nhóm, đè sàn chung (handoff v6 sửa lỗi đợt 3 mục 3.4, Haan duyệt 07/10/2026): nhóm D (mặt thoáng)
# ≥ 60 % — lượt affaf12b / f0c97c06 qua ngưỡng tổng 63,8 điểm với nhóm E 8 %, phòng làm việc và phòng thờ không một
# cửa sổ. Nhóm không ghi ở đây dùng sàn chung (E vẫn 40 %). SUY LUẬN (n = 0).
accept_group_floor_by_group:
  D: 60

# Mức TÌM (01/10/2026, cùng lúc hạ ngưỡng nhận xuống 60): bộ xếp còn thử các biến thể ý định (chia lại diện tích
# mục tiêu, chèn hành lang) tới khi điểm đạt mức này, dù đã qua ngưỡng nhận. Giữ 65 = đúng mức tìm trước khi hạ
# ngưỡng: phát lại bea4c6fa vòng 6 ra 61,8 điểm khi dừng ở 60, ra 71,2 khi tìm tới 65. Không đổi số lời gọi mô
# hình — chỉ thêm thời gian xếp cho phương án 60–65 điểm. Vắng = dừng ngay khi qua ngưỡng nhận.
variant_search_until_percent: 65

# Kiểm khả thi TRƯỚC khi gọi mô hình (T112, Haan 01/10/2026: «chặn, không gọi mô hình»): một tầng mà phần
# chắc chắn phải có — số ô tối thiểu các phòng đầu bài khai diện tích, ô thang, WC khép kín — đã vượt % này
# của sàn xây được thì dừng, báo phòng nào chiếm bao nhiêu, không gọi mô hình (`ai/feasibility.ts`). Phần
# ấy cố ý đếm thiếu (không hành lang, bếp, WC chung), nên 85 là đúng mức «tổng mục tiêu ≤ ~85 % sàn» của
# lời dẫn. Đo trên 46 lượt ghi (một đầu bài biệt thự demo, nhiều phiên bản): cao nhất 67 % — không lượt nào
# bị chặn. Vắng = không kiểm.
feasibility_max_percent: 85

# Dừng gọi mô hình sửa khi bấy nhiêu lượt LIỀN NHAU hỏng cùng một LỖI CHÍNH (T174, 28/10/2026). Lỗi chính = câu lỗi
# đầu tiên của lượt (câu màn hình hiện), so theo tầng + mã + câu với mã phòng bỏ số thứ tự («bedroom_4» ≡ «bedroom_3»)
# và GIỮ nguyên số đo — phòng còn nhích diện tích thì chưa coi là lặp. Lượt thật 1dd74b99 (hồ sơ 9272): lượt 2–4 cùng
# «phòng ngủ tầng 2 chỉ 14,13 m² < 17 m²» mà vẫn gọi lượt 5 (≈ 0,09 USD, mô hình trả rỗng). `STUCK_AFTER` (cả tập lỗi
# y hệt) không bắt được vì lỗi phụ đổi mỗi lượt. Không phải luật nghề — là chỗ dừng tiêu tiền. Vắng = tắt.
revision_stop_same_main_issue_rounds: 3

# ── Trọng số nhóm ──────────────────────────────────────────────────────────────
#
# Y NGUYÊN bộ đo, không tự chỉnh (mặc định số 4 của phương án). Hai chỗ đáng để ý,
# vì chúng không phải thứ tôi nghĩ ra được:
#   · C nặng nhất (30), GẤP BA E (10). Tôi đặt C = 20 và E = 15. Hồ sơ thật nói
#     ngược: giao thông là nơi mặt bằng sống hay chết, còn «dựng được» thì khung
#     bê tông cốt thép đã lo phần lớn.
#   · Không có nhóm nào cho quy chuẩn. Quy đổi một điều khoản pháp quy thành điểm
#     là tuyên bố có thể vi phạm nếu chỗ khác bù lại (T29) — và sau T30 thì nhánh
#     AI không kiểm quy chuẩn nào.
groups:
  A:
    vi: 'Đúng chương trình'
    weight: 25
  B:
    vi: 'Hình dáng phòng'
    weight: 20
  C:
    vi: 'Giao thông'
    weight: 30
  D:
    vi: 'Mặt thoáng'
    weight: 15
  E:
    vi: 'Dựng được'
    weight: 10

# Trong một nhóm, các tiêu chí CHẤM ĐƯỢC chia trọng số theo `weight` của từng tiêu chí (vắng = 1,
# tức chia đều). Bộ đo chỉ cho trọng số NHÓM; phần trong nhóm là tư duy nghề, nhãn [CHUNG], và từ T96
# khai được ở từng tiêu chí: thứ làm hỏng cách ở (đi xuyên phòng ngủ, cửa chính đón vào bếp, phòng thờ
# cạnh WC) nặng gấp đôi thứ chỉ làm nhà kém tiện (hành lang hơi dài, phòng hơi rộng).
within_group: weighted

# ── Năm kiểu thang điểm ────────────────────────────────────────────────────────
#
#   lower_better   giá trị ≤ pass → đủ điểm; ≥ zero → 0; giữa thì nội suy
#   higher_better  giá trị ≥ pass → đủ điểm; ≤ zero → 0
#   count          đếm phần tử vi phạm: ≤ pass → đủ điểm; ≥ zero → 0
#   boolean        1 hoặc 0, không có giữa
#   band           trong [low, high] → đủ điểm; ngoài [hard_low, hard_high] → 0;
#                  khoảng giữa → NỬA điểm, KHÔNG nội suy (xem C2)

criteria:
  # ── A. Đúng chương trình ────────────────────────────────────────────────────
  - code: A1
    group: A
    vi: 'Lệch diện tích so với yêu cầu của chương trình không gian'
    giai_thich: 'Bình quân có trọng số theo diện tích. Phòng ghép (`also`) so với TỔNG diện tích yêu cầu của các mã nó phục vụ.'
    kind: lower_better
    pass: 0.10
    zero: 0.30
    n: 0
    label: 'CHUNG'
    # n = 0 vì nó so với YÊU CẦU CỦA KHÁCH, mà hồ sơ đã xây không còn giữ bản yêu
    # cầu gốc — chỉ NVO trả lời được, bằng cách đối chiếu hợp đồng với bản vẽ cuối.

  - code: A2
    group: A
    vi: 'Phòng đặt đúng tầng chương trình đã định'
    kind: higher_better
    pass: 1.0
    zero: 0.7
    n: 0
    label: 'CHUNG'
    # CỔNG DỮ LIỆU ĐÃ BẢO ĐẢM, nên tiêu chí này KHÔNG tính vào điểm.
    #
    # `room_wrong_level` của `ai/plan-check.ts` là lỗi CHẶN: phòng đặt sai tầng thì
    # mặt bằng không bao giờ tới được bước chấm. Nên A2 luôn bằng 1,0 trên mọi bản
    # được chấm — nó không phân biệt được gì, và cho nó 1/4 của 25 điểm là tặng
    # 6,25 điểm không đo gì cả.
    #
    # Vì sao GIỮ dòng này thay vì xoá: bộ đo viết cho việc ĐỌC một bản vẽ có sẵn,
    # và ở đó phòng sai tầng là chuyện xảy ra thật. Xoá khỏi tệp thì lần sau ai đó
    # đối chiếu với bộ đo sẽ tưởng là bỏ sót. Giữ lại kèm lý do là cách nói «đã
    # xét, và đây là chỗ nó thuộc về» (T24: cổng và điểm là hai thứ khác nhau).
    enforced_by_gate: room_wrong_level

  - code: A3
    group: A
    vi: 'Phòng thờ ở tầng cao nhất có người ở, không dưới khu vệ sinh và không chung tường với khu vệ sinh'
    kind: boolean
    n: 2
    label: 'ĐO'
    # Nặng gấp đôi trong nhóm: phòng thờ đặt sai là gia chủ người Việt không nhận nhà (T96).
    weight: 2

  - code: A4
    group: A
    vi: 'Tầng nào có phòng ngủ thì tầng đó có khu vệ sinh'
    kind: higher_better
    pass: 1.0
    zero: 0.99
    n: 3
    label: 'ĐO'
    # `zero: 0.99` của bộ đo làm tiêu chí này thành nhị phân trên thực tế: nhà 5
    # tầng thiếu một khu vệ sinh cho ra 0,8, đã dưới 0,99. Giữ nguyên con số của bộ
    # đo thay vì viết `boolean` cho gọn — để dòng này còn đối chiếu được với nguồn.

  # Hai tiêu chí định mức nghề thêm 16/09/2026 (T48). Haan chốt: định mức `kb/space_norms.yaml` CHỈ
  # trừ điểm, không chặn — chặn vẫn chỉ có mức đầu bài khách khai.
  - code: A5
    group: A
    vi: 'Số phòng nhỏ hơn mức tối thiểu của nghề cho loại ấy'
    kind: count
    pass: 0
    zero: 2
    n: 0
    label: 'CHUNG mức 0; trừ hết ở 2 phòng'

  - code: A6
    group: A
    vi: 'Số phòng lớn hơn mức tối đa của nghề cho loại ấy'
    kind: count
    pass: 0
    zero: 2
    n: 0
    label: 'CHUNG mức 0; trừ hết ở 2 phòng'
    # Nhẹ nửa: phòng rộng hơn định mức chưa bao giờ là lý do gia chủ chê (Haan 27/09/2026: «diện tích
    # không phải là vấn đề lớn», đất rộng thì phòng khách 60 m² là bình thường).
    weight: 0.5

  # ── B. Hình dáng phòng ──────────────────────────────────────────────────────
  - code: B1
    group: B
    vi: 'Số phòng có cạnh ngắn dưới mức tối thiểu của loại phòng'
    giai_thich: 'Ngưỡng lấy từ `rules/` theo `predicate: min_dimension` và `target` = mã phòng. KHÔNG chép số vào tệp này.'
    kind: count
    pass: 0
    zero: 2
    n: 5
    label: 'ĐO ngưỡng theo mã phòng; CHUNG mức trừ'

  - code: B2
    group: B
    vi: 'Số phòng vượt tỷ lệ dài/rộng tối đa của loại phòng'
    giai_thich: 'Ngưỡng lấy từ `rules/` theo `predicate: aspect_ratio_max`.'
    kind: count
    pass: 0
    zero: 2
    n: 5
    label: 'ĐO ngưỡng theo mã phòng; CHUNG mức trừ'

  - code: B4
    group: B
    vi: 'Chiều cao bậc thang nằm trong khoảng xây được'
    giai_thich: 'Chiều cao bậc = chiều cao tầng ÷ số bậc. Khoảng lấy từ hai thang đo thật: P1 ≈ 171 mm, P2 ≈ 156 mm.'
    kind: band
    low: 0.150
    high: 0.180
    hard_low: 0.140
    hard_high: 0.195
    n: 2
    label: 'ĐO'
    # ⚠️ Bộ đo đòi THÊM một vế nữa: `2h + b` trong 0,57–0,64 m, với `b` là mặt bậc.
    # Hợp đồng mặt bằng KHÔNG mang mặt bậc, và suy nó từ chữ nhật ô thang cộng số vế
    # là ba tầng phỏng đoán chồng lên nhau (vế nào dài bao nhiêu, chiếu nghỉ chiếm
    # bao nhiêu, bậc quạt có không). Nên vế ấy hiện «Chưa đủ dữ liệu», và câu hỏi
    # cho Haan là có thêm một trường `tread_cm` vào hợp đồng hay không — xem mục
    # «Câu hỏi chờ Haan» của TIEN_DO_THIET_KE.html.

  # B5 (tỷ lệ phòng kê được bộ đồ tối thiểu) CỐ Ý chưa có trong danh sách này.
  # Nó cần `kb/furniture.yaml` của T36, mà kích thước đồ đạc hiện là cỡ thông dụng
  # nhãn [CHUNG], n = 0. Vẽ hộ bằng số phỏng đoán thì vô hại; TRỪ ĐIỂM bằng số
  # phỏng đoán thì không (mặc định số 10 của phương án).
  # ── C. Giao thông ───────────────────────────────────────────────────────────
  - code: C1
    group: C
    vi: 'Số phòng chỉ tới được bằng cách đi xuyên một phòng ngủ khác'
    kind: count
    pass: 0
    zero: 1
    n: 3
    label: 'ĐO'
    # Nặng gấp đôi: đi xuyên phòng ngủ người khác là mất riêng tư, không phải kém tiện (T96).
    weight: 2
    # Khu vệ sinh khép kín KHÔNG tính: `ensuite_of` của chương trình không gian nói
    # rõ chỗ đi xuyên phòng ấy là hợp lệ.

  - code: C2
    group: C
    vi: 'Tỷ lệ diện tích giao thông trên sàn lọt lòng'
    giai_thich: '(thang + lõi + sảnh + hành lang) ÷ tổng diện tích phòng của tầng.'
    kind: band
    low: 0.18
    high: 0.36
    hard_low: 0.12
    hard_high: 0.42
    by_building_type:
      # ⚑ T116 (handoff v6 mục 3.5) — loại nhà ỐNG (`shared/src/design/house-profile.ts`), chồng lên nha_pho.
      ong:
