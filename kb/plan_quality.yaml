#
# Giữ danh sách này trong tệp để không ai dựng lại chúng bằng thiện chí. Cả bốn là
# của tôi, và cả bốn bị hồ sơ ĐÃ XÂY phủ định — ba trong bốn cái nghe rất hợp lý.
bo_khoi:
  - code: E1
    vi: 'Tường tầng trên trùng tuyến tầng dưới'
    ly_do: 'Đo được 0–1% tường trong trùng tầng dưới trên CẢ HAI công trình khung bê tông cốt thép đã xây. Thưởng điểm cho nó là trừ điểm đúng những nhà đã xây và đã được duyệt.'
  - code: E3
    vi: 'Tổng chiều dài tường trên mỗi mét vuông'
    ly_do: '0,00–0,35 m/m², biến thiên theo CHỨC NĂNG TẦNG, không theo chất lượng.'
  - code: B3
    vi: 'Tỷ lệ phòng vụn'
    ly_do: 'Phòng nhỏ trên hồ sơ đều có chủ đích, và không có định nghĩa hình học nào tách «vụn» khỏi «gọn».'
  - code: D2
    vi: 'Bề rộng mặt thoáng trên diện tích phòng'
    ly_do: '0,08–0,34 m/m² với sai số đo cửa ±0,15 m — sai số LỚN HƠN khả năng phân biệt. Chờ đo lại trên DWG, n ≥ 20 phòng.'

# ── Không đo được, và đó là kết luận chứ không phải việc còn nợ ───────────────
khong_do_duoc:
  - muc: 'Lượng sáng và thông gió thực tế'
    ly_do: 'Phụ thuộc hướng, chiều cao cửa, che chắn. Toạ độ không đủ.'
  - muc: 'Phong thuỷ — hướng bếp, bếp đối diện WC, bếp kẹp giữa chậu rửa và tủ lạnh'
    ly_do: 'Tập quán, không có mẫu phản chứng hay xác nhận. Chấm máy sẽ trừ oan. Bếp đối diện WC cần dò cửa đối cửa; «hai thuỷ» cần vị trí đồ đạc (T36 chưa có). Riêng «cầu thang đâm thẳng cửa chính» đã TÁCH RA 16/09/2026 thành quy tắc kinh nghiệm tuỳ chọn `stair_not_facing_entry` (`rules/nvg-experience.yaml`): đo được bằng hình học cửa + ô thang, và chỉ cảnh báo khi kỹ sư tích gói kinh nghiệm — không vào điểm.'
  - muc: 'Hợp nếp sống gia chủ'
    ly_do: 'Cần phỏng vấn.'
  - muc: 'Lối đi quanh nội thất, cánh cửa va nhau'
    ly_do: 'Cần bộ đồ nội thất (T36) và cần hiệu chuẩn kích thước đồ.'
  - muc: 'Khả thi kết cấu — khối nhô, tường không dầm đỡ'
    ly_do: 'Việc của kỹ sư kết cấu. Nhánh AI không sinh kết cấu (CLAUDE.md 8.2 điểm 9).'
  - muc: 'Thẩm mỹ, cảm nhận không gian'
    ly_do: 'Cảm thụ. Đây đúng là phần bước kỹ sư xem bằng mắt giữ lại cho mình (T35).'
