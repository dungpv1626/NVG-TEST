# Chuẩn lập chương trình không gian — dữ liệu của Lớp 2.
#
# Nguồn: doc/design/03-data-contracts.md mục 3.2, 06-knowledge-base.md mục 6.0 và 6.4,
# 08-milestones.md Mốc 4.
#
# ── Vì sao là DỮ LIỆU, không phải mã nguồn ─────────────────────────────────────────────
# Cùng lý lẽ với rule pack và `room_vocabulary.yaml` (CLAUDE.md 8.7). Diện tích một phòng
# khách "nên" là bao nhiêu không phải hằng số của phần mềm: nó đổi theo bề rộng lô, theo
# thời kỳ, theo gu từng pháp nhân, và sẽ đổi lần nữa ngay khi kho hồ sơ cũ đủ lớn để nói
# thay. Viết vào mã là buộc phải sửa mã cho mỗi lần đổi ý của Phòng Thiết kế.
#
# ── Ranh giới với `rules/` ─────────────────────────────────────────────────────────────
# `rules/` là thứ Container ĐÁNH GIÁ trên hình học đã giải (tuân thủ quy chuẩn).
# Tệp này là thứ Worker dùng để SOẠN chương trình không gian (thực hành nghề nghiệp).
# Hai vai khác nhau, nên hai chỗ. Chỗ nào cả hai cùng nói (diện tích tối thiểu) thì
# **rule pack thắng** — quy chuẩn không thương lượng được. Engine lấy `max(hai bên)`, nên
# một quy chuẩn siết chặt hơn luôn có hiệu lực mà không phải sửa tệp này.
#
# ⚠️ Số ở mục `spaces` là SUY LUẬN từ thực hành phổ biến, CHƯA có kiến trúc sư NVG xác
#    nhận (xem "Câu hỏi chờ Haan" trong TIEN_DO_THIET_KE.html). Sửa ở đây, không sửa mã.

version: '1.1.0'

# ── Thống kê thực nghiệm ───────────────────────────────────────────────────────────────
# 06-knowledge-base 6.0(b): dưới ngưỡng này mỗi ô chỉ còn một hai công trình — đó là trùng
# hợp, không phải phân bố. Hook vẫn chạy, chỉ là trả về rỗng cho tới khi kho đủ lớn.
#
# Đếm số CÔNG TRÌNH, không phải số phòng: một biệt thự mười lăm phòng ngủ tự nó vượt ngưỡng,
# và "phân bố diện tích phòng ngủ của NVG" hoá ra là phân bố bên trong đúng một căn nhà.
priors:
  # ⚠️ Trong giai đoạn demo, ngưỡng này KHÔNG BAO GIỜ đạt — và đó là điều đã biết trước, không
  # phải chuyện chờ xem. Haan chốt 06/09/2026 (Q-27): bản thiết kế là thông tin nhạy cảm, khách
  # hàng hạn chế cung cấp, nên chỉ có HAI hồ sơ và sẽ không xin thêm.
  #
  # Nghĩa là hook thống kê luôn trả về RỖNG suốt giai đoạn này, đúng như thiết kế. Hệ quả thật
  # sự nằm ở chỗ khác: **số ở mục `spaces` không thể suy từ dữ liệu**, nên chúng phải do kiến
  # trúc sư NVG ấn định (Q-18). Đừng hạ ngưỡng xuống cho khớp số hồ sơ đang có — hạ xuống 2 thì
  # phân bố tính ra từ hai căn nhà, và nó sẽ trông y như một con số đã được kiểm chứng.
  min_samples: 15
  # Bề rộng lô là biến phân tầng chính: cách bố trí nhà 4 m và nhà 8 m khác nhau về bản
  # chất, không phải khác về mức độ.
  width_bands:
    - { id: hep, max_width_m: 4.5, scale: 0.85 }
    - { id: trung_binh, max_width_m: 6.0, scale: 1.0 }
    - { id: rong, max_width_m: 8.0, scale: 1.15 }
    - { id: rat_rong, max_width_m: null, scale: 1.3 }

# ── Suy số phòng ngủ từ thành phần gia đình ────────────────────────────────────────────
# `per_room` = số người dùng chung một phòng. Con cái mỗi người một phòng là mặc định của
# nhà ở dân dụng hiện nay; ông bà và vợ chồng ở chung.
occupancy:
  vo_chong: { per_room: 2, room_type: master_bedroom, floor: mid }
  ong_ba: { per_room: 2, room_type: bedroom, floor: ground }
  con: { per_room: 1, room_type: bedroom, floor: mid }
  khach: { per_room: 2, room_type: bedroom, floor: mid }
  nguoi_giup_viec: { per_room: 2, room_type: bedroom, floor: ground }

# ── Tiện ích NẰM TRONG phòng ngủ ───────────────────────────────────────────────────────
# Nhu cầu riêng của một nhóm thành viên (`family[].needs`) mang mã ở đây KHÔNG thành một không
# gian tách riêng: nó gộp vào phòng ngủ của chính nhóm đó — «Phòng ngủ ông bà (có tủ đồ)» — và
# diện tích tối thiểu, đề xuất, tối đa của tiện ích cộng vào phòng. Haan (13/09/2026): «tủ đồ,
# không gian học tập, phòng thay đồ trong phòng ngủ thì không cần tách riêng».
# `balcony` cố ý KHÔNG có mặt: ban công là không gian ngoài trời, cần mặt thoáng và lan can.
in_bedroom: [study, study_area, closet, dressing_room]

# ── Không gian luôn có, kể cả khi đầu bài không khai ───────────────────────────────────
# Đầu bài do người bán hàng ghi thường bỏ qua những thứ hiển nhiên. Thiếu chúng thì Lớp 3
# giải ra một căn nhà không có chỗ nấu ăn.
mandatory:
  nha_pho: [living, dining, kitchen, wc, stair, circulation]
  biet_thu: [living, dining, kitchen, wc, stair, circulation]
  nha_vuon: [living, dining, kitchen, wc, stair, circulation]

# ── Không gian sinh theo tỉ lệ ─────────────────────────────────────────────────────────
derived:
  wc:
    per_bedrooms: 2
    min_per_floor: 1
  circulation:
    # Diện tích giao thông tính theo TỈ LỆ diện tích sàn, không phải một con số cố định:
    # hành lang của tầng 40 m² và tầng 120 m² không thể bằng nhau (06-knowledge-base 6.4).
    ratio_of_floor: 0.12
  stair:
    # Một thang cho mỗi lõi; số lõi lấy từ `massing.cores_preferred` của đầu bài.
    per_core: 1

# ── Xếp phòng thả nổi vào tầng ────────────────────────────────────────────────────────
# Trước 06/09/2026 mỗi phòng thả nổi đi vào tầng đang NHẸ NHẤT trong dải cho phép: bốn phòng
# ngủ rải mỗi tầng một phòng, tầng nào cũng trống 40 %, và bộ giải phải phình khu vệ sinh lên
# 43 m² hay mở thông tầng 12 m để lấp — kiến trúc sư nhìn là mất tin. Nay: chỉ MỞ tầng mới khi
# các tầng đang dùng đã đầy tới `fill_target_ratio` (diện tích mong muốn / sàn). Tầng nào sau
# đó vẫn dưới `filler_below_ratio` thì thêm không gian bổ sung theo `fillers` cho tới khi đủ.
# Ba con số là mặc định của team (14-phuong-an-demo 14.5), kiến trúc sư NVG đổi ở đây.
allocation:
  fill_target_ratio: 0.62
  # Ngưỡng thêm không gian bổ sung. Nâng 0,45 → 0,85 ngày 07/09/2026 sau khi đo trên bộ đầu
  # bài đại diện: ở 0,45 thì một tầng chỉ có phòng ngủ chính, thang và hành lang đã được coi
  # là "đủ đầy" và không nhận thêm gì, nên bước cấp phát phải thổi chính phòng ngủ đó lên
  # 51,8 m² để lấp mặt sàn. Tầng hai nhà phố thật luôn có thêm ban công và giếng trời —
  # thiếu chúng thì cái sai không nằm ở diện tích, nằm ở chỗ chương trình thiếu không gian.
  filler_below_ratio: 0.85
  # Ba bậc nhấn mạnh của Lớp 2a đổi thành hệ số nhân lên `weight`.
  #
  # Đây là chỗ DUY NHẤT đầu ra của mô hình ngôn ngữ chạm vào con số, và nó chạm rất nông:
  # mô hình chỉ chọn được một trong ba bậc, còn ba bậc đó đáng bao nhiêu là do tệp này quyết.
  # Nhờ vậy một mô hình "nhiệt tình" quá mức cũng không kéo diện tích đi đâu xa được — và
  # tối thiểu quy chuẩn cùng trần nghề vẫn kẹp hai đầu.
  emphasis:
    generous: 1.7
    normal: 1.0
    modest: 0.55
  # Danh sách theo THỨ TỰ ưu tiên thêm vào. Mỗi loại nhiều nhất một cái mỗi tầng.
  fillers:
    nha_pho: [balcony, light_well, study, storage, terrace]
    biet_thu: [balcony, study, storage, terrace, courtyard]
    nha_vuon: [terrace, study, storage, courtyard]

# ── Trọng số quan hệ liền kề, suy từ mức nghiêm trọng của rule pack ────────────────────
# Quan hệ liền kề KHÔNG khai ở đây — nguồn duy nhất là `rules/**/*.yaml` mục
# `predicate: adjacency`. Tệp này chỉ nói mức nghiêm trọng đổi thành trọng số bao nhiêu
# trong hàm mục tiêu của bộ giải.
adjacency_weight:
  error: 1.0
  warning: 0.6

# ── Chuẩn từng loại không gian ─────────────────────────────────────────────────────────
# Mọi mã trong `kb/room_vocabulary.yaml` phải có mặt ở đây — có kiểm thử canh. Một loại
# phòng thiếu chuẩn sẽ lọt vào chương trình không gian với diện tích bịa ra, hoặc tệ hơn,
# làm cả bước dừng đúng lúc khách đang chờ.
#
#   floor:      ground | low | mid | top | any   — nguyện vọng, rule pack `floor_preference`
#                                                  thắng khi hai bên nói khác nhau
#   priority:   1 cao nhất. Dùng khi tổng diện tích tối thiểu VƯỢT sàn có được: cái nào
#               nhường trước. Chỉ có nghĩa ở chiều thiếu chỗ.
#   weight:     phần sàn CÒN DƯ chia theo tỉ lệ này, sau khi mọi phòng đã có tối thiểu. Đây
#               là thứ làm diện tích co giãn theo QUY MÔ công trình: cùng một bảng chuẩn cho
#               ra bếp 10 m² trong nhà phố 90 m²/tầng và bếp 17 m² trong biệt thự 180 m²/tầng,
#               mà không cần một hệ số nhân nào theo bề rộng lô.
#               `0` = không nhận phần dư (giao thông tính riêng theo tỉ lệ sàn).
#   max_m2:     trần NGHỀ, không phải trần quy chuẩn. Nó chặn phần dư dồn hết vào một phòng —
#               không ai làm bếp 40 m². Số cũ đặt theo cỡ nhà phố nên biệt thự đụng trần ngay
#               ở phòng khách; đã nới cho các phòng có lý do to ra ở nhà lớn (07/09/2026).
#   auto:       false = chỉ tạo khi đầu bài khai đích danh hoặc quy tắc suy ra
spaces:
  living:
    min_m2: 12
    target_m2: 22
    max_m2: 70
    priority: 1
    weight: 4.0
    floor: ground
    daylight: true
    facade: true
    ventilation: true
  dining:
    min_m2: 9
    target_m2: 14
    max_m2: 40
    priority: 2
    weight: 1.8
    floor: ground
    daylight: false
    facade: false
    ventilation: true
  kitchen:
    min_m2: 6
    target_m2: 10
    max_m2: 28
    priority: 2
    weight: 1.9
    floor: ground
    daylight: true
    facade: false
    ventilation: true
  bedroom:
    min_m2: 9
    target_m2: 14
    max_m2: 30
    priority: 2
    weight: 1.6
    floor: mid
    daylight: true
    facade: true
    ventilation: true
  master_bedroom:
    min_m2: 14
    target_m2: 20
    max_m2: 45
    priority: 1
    weight: 2.6
    floor: mid
    daylight: true
    facade: true
    ventilation: true
  wc:
    min_m2: 2.4
    target_m2: 4
    max_m2: 8
    priority: 3
    weight: 0.4
    floor: any
    daylight: false
    facade: false
    ventilation: true
  stair:
    min_m2: 4
    target_m2: 8
    max_m2: 14
    priority: 1
    weight: 0.3
    floor: any
    daylight: false
    facade: false
    ventilation: false
  core:
    # Lõi là NHÓM không gian đứng thẳng hàng liên tầng (thang + vệ sinh + hộp kỹ thuật),
    # do Lớp 3 dựng. Không bao giờ tự sinh thành một dòng của chương trình không gian.
    min_m2: 6
    target_m2: 10
    max_m2: 18
    priority: 1
    weight: 0.3
    floor: any
    daylight: false
    facade: false
    ventilation: false
    auto: false
  circulation:
    min_m2: 3
    target_m2: 8
    max_m2: 24
    priority: 3
    weight: 0.0
    floor: any
    daylight: false
    facade: false
    ventilation: false
  garage:
    min_m2: 12
    target_m2: 18
    max_m2: 45
    priority: 2
    weight: 1.2
    floor: ground
    daylight: false
    facade: true
    ventilation: true
  altar_room:
    min_m2: 8
    target_m2: 12
    max_m2: 28
    priority: 2
    weight: 1.0
    floor: top
    daylight: true
    facade: false
    ventilation: true
  study:
    min_m2: 6
    target_m2: 10
    max_m2: 24
    priority: 3
    weight: 1.0
    floor: mid
    daylight: true
    facade: true
    ventilation: true
  storage:
    min_m2: 2
    target_m2: 4
    max_m2: 10
    priority: 4
    weight: 0.5
    floor: any
    daylight: false
    facade: false
    ventilation: false
  # Chỗ học của các con. Nhỏ hơn phòng làm việc và ưu tiên thấp hơn, nhưng VẪN đòi ánh sáng
  # tự nhiên — đó là điểm phân biệt thật sự với một góc kê bàn bất kỳ.
  study_area:
    min_m2: 4
    target_m2: 7
    max_m2: 16
    priority: 4
    weight: 0.7
    floor: mid
    daylight: true
    facade: false
    ventilation: true
  # Tủ đồ và phòng thay đồ đều phục vụ RIÊNG một phòng ngủ, nên `floor: any` — chúng đi theo
  # phòng ngủ, không có tầng ưa thích của riêng mình. Khác nhau ở quy mô: hốc tủ chỉ cần chỗ
  # đứng lấy đồ, phòng thay đồ cần chỗ thay và gương.
  closet:
    min_m2: 1.5
    target_m2: 2.5
    max_m2: 5
    priority: 4
    weight: 0.4
    floor: any
    daylight: false
    facade: false
    ventilation: false
  dressing_room:
    min_m2: 4
    target_m2: 6
    max_m2: 12
    priority: 4
    weight: 0.6
    floor: any
    daylight: false
    facade: false
    ventilation: true
  laundry:
    min_m2: 3
    target_m2: 5
    max_m2: 10
    priority: 4
    weight: 0.5
    floor: top
    daylight: true
    facade: false
    ventilation: true
  balcony:
    min_m2: 2
    target_m2: 4
