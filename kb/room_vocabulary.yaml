# Từ vựng phòng chuẩn của Module Thiết kế AI.
#
# Nguồn: doc/design/06-knowledge-base.md mục 6.1 ("LLM chuẩn hoá nhãn"), 03-data-contracts 3.4.
#
# Vì sao là DỮ LIỆU chứ không phải hằng số trong mã nguồn: cùng lý lẽ với `layer_mapping.yaml`
# và rule pack (CLAUDE.md 8.7). Cách NVG gọi tên phòng thay đổi theo người vẽ và theo thời kỳ,
# và sẽ còn thêm loại phòng mới (phòng xông hơi, phòng gym, kho lạnh…). Biến thứ đó thành mã
# nguồn là buộc phải sửa code cho mỗi cái tên mới.
#
# ⚠️ Cạm bẫy: `code` ở đây phải PHỦ được các giá trị `target:` trong `rules/base/*.yaml`.
# Một mã phòng không có rule nào nhắm tới sẽ đi qua toàn bộ engine mà KHÔNG bị kiểm quy chuẩn
# nào — không có lỗi nào nổ ra, chỉ là phòng đó chưa từng được kiểm. Có kiểm thử canh chiều
# ngược lại (mọi `target` của rule pack phải có trong danh sách này).
#
# `aliases` là các cách viết đã GẶP THẬT trong bản vẽ, dùng cho lượt đối chiếu tất định chạy
# TRƯỚC khi gọi mô hình ngôn ngữ: nhãn nào khớp thẳng thì không tốn một lượt gọi mạng nào, và
# quan trọng hơn — kết quả không đổi giữa hai lần chạy. Mô hình ngôn ngữ chỉ xử lý phần còn lại.
# So khớp KHÔNG phân biệt hoa thường, bỏ dấu tiếng Việt, và bỏ mọi ký tự không phải chữ/số.

# ── Bí danh đo được từ hồ sơ thật (05/09/2026) ─────────────────────────────────────────
# Các bí danh sau lấy nguyên văn từ hai bộ hồ sơ thật, không phải phỏng đoán:
# `P.NGỦ 1..5` · `P.BẾP` · `P.KHÁCH + THỜ` · `WC 1..4` · `SÂN` · `SÂN NGOÀI NHÀ` ·
# `BAN CÔNG` · `ban công kính` · `hộp kỹ thuật` · `SẢNH/ SINH HOẠT CHUNG` · `PKTTM`.
# Cách đo: `doc/design/13-ho-so-thuc-te.md` mục 13.14.
#
# Hai điều học được, quan trọng hơn bản thân danh sách:
#
# **(a) NVG gộp công năng vào MỘT nhãn.** `P.KHÁCH + THỜ` là một phòng, không phải hai.
# Bảng này quy nó về `living`; phòng thờ riêng vẫn có mã `altar_room` cho hồ sơ nào tách.
# Đừng tách một nhãn gộp thành hai phòng khi số hoá — làm vậy là bịa ra một phòng không có
# trên bản vẽ, và diện tích sẽ không cân.
#
# **(b) Nhãn có khi mang cả diện tích**: `SẢNH/ SINH HOẠT CHUNG 11.3m²`. Đuôi đó phải được
# gỡ trước khi tra, nếu không nhãn nào cũng thành nhãn lạ và bị đẩy sang mô hình ngôn ngữ.
# Quy tắc gỡ khai ở `strip_patterns` bên dưới, và `VocabularyIndex.lookup` đọc nó.

version: '1.0.0'

# Đuôi cần gỡ khỏi nhãn trước khi tra bảng. Là DỮ LIỆU vì đây là thói quen ghi chú của
# người vẽ, không phải quy tắc của phần mềm — sẽ có thêm dạng đuôi khác.
# Biểu thức chính quy, khớp trên nhãn ĐÃ chuẩn hoá (bỏ dấu, viết hoa, bỏ ký tự đặc biệt).
strip_patterns:
  # Dien tich viet lien nhan: "SẢNH/ SINH HOẠT CHUNG 11.3m²" -> "SANHSINHHOATCHUNG113M".
  # Chu `²` bien mat khi chuan hoa (NFD khong tach ky tu so mu), nen mau phai chap nhan
  # ca "…113M" lan "…113M2" — dung mau nao cung duoc, nhung phai thu tren nhan DA chuan hoa.
  - '[0-9]+M2?$'
  - '[0-9]+$' # so thu tu phong: "PN2", "WC 3.1"

types:
  - code: living
    vi: Phòng khách
    aliases:
      [
        'PK',
        'P.KHACH',
        'PHONG KHACH',
        'SINH HOAT CHUNG',
        'LIVING',
        'LIVING ROOM',
        'SHC',
        'P.KHACH + THO',
        'KHACH + THO',
        'P.KHACH+THO',
      ]

  - code: dining
    vi: Phòng ăn
    aliases: ['PA', 'P.AN', 'PHONG AN', 'BAN AN', 'DINING', 'DINING ROOM']

  - code: kitchen
    vi: Bếp
    aliases: ['B', 'BEP', 'P.BEP', 'PHONG BEP', 'KITCHEN', 'BEP AN', 'KHU BEP']

  - code: bedroom
    vi: Phòng ngủ
    aliases: ['PN', 'P.NGU', 'PHONG NGU', 'NGU', 'BEDROOM', 'BR']

  - code: master_bedroom
    vi: Phòng ngủ chính
    aliases:
      ['PN MASTER', 'MASTER', 'MASTER BEDROOM', 'PHONG NGU MASTER', 'PN CHINH', 'PHONG NGU CHINH']

  - code: wc
    vi: Khu vệ sinh
    aliases: ['WC', 'VS', 'NHA VE SINH', 'PHONG VE SINH', 'P.VS', 'TOILET', 'BATHROOM', 'TAM']

  - code: stair
    vi: Thang bộ
    aliases: ['THANG', 'CAU THANG', 'THANG BO', 'STAIR', 'STAIRS', 'CT']

  - code: core
    vi: Lõi thang
    # ⚠️ 'THANG MAY' / 'LIFT' / 'ELEVATOR' ĐÃ CHUYỂN sang mã `elevator` (T65, 22/09/2026).
    # Giữ chúng ở đây thì một giếng thang máy và một lõi thang bộ cùng ra mã `core`, và cổng
    # «đầu bài khai làm thang máy» nhận nhầm cái lõi thang bộ là đã đủ — yêu cầu của gia chủ
    # biến mất mà không có lỗi nào nổ ra.
