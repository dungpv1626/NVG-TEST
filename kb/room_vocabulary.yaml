    aliases: ['HOP KY THUAT', 'HOP GEN', 'GEN', 'KY THUAT', 'SHAFT', 'DUCT', 'HT']

  - code: shop
    vi: Không gian kinh doanh
    aliases: ['CUA HANG', 'KINH DOANH', 'SHOP', 'SHOPHOUSE', 'VAN PHONG', 'KIOT']

  # ── HAI MÃ THÊM 12/09/2026 (T32) — rút từ 2 hồ sơ NVO đã xây ──────────────────────────
  #
  # Không phải chuyện làm đẹp từ vựng. Thiếu hai mã này thì hai không gian thật phải xếp vào
  # `circulation`, và quy tắc `room_min_dimension_circulation` 1,1 m **báo vi phạm trên công
  # trình đã xây** — hốc lavabo của P2 rộng đúng 1,05 m. Mã mới là cách bỏ một cảnh báo sai.

  - code: porch
    vi: Sảnh ngoài nhà
    # P1 có hai sảnh: sảnh chính 6,4 m² (1,80 × 3,58, có 3 bậc và chiếu nghỉ) và sảnh phụ
    # 4,6 m² (1,20 × 3,87, nằm dưới ban công tầng 2). Xếp vào `circulation` thì chúng vào TỬ SỐ
    # của tỷ lệ giao thông (tiêu chí C2) dù nằm NGOÀI nhà và không có trong mẫu số là sàn lọt
