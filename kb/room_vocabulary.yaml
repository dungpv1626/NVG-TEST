  # Hai mã dưới đây tách từ một ô «Tủ đồ, kho riêng» duy nhất của biểu mẫu đầu bài
  # (07/09/2026). Chúng KHÁC `storage` ở chỗ phục vụ riêng một phòng ngủ, không phải kho
  # chung của cả nhà — và khác nhau ở quy mô: `closet` là hốc tủ âm tường đủ chỗ đứng lấy
  # đồ, `dressing_room` là một phòng đi vào được, có chỗ thay đồ và gương.
  - code: closet
    vi: Tủ đồ
    aliases: ['TU DO', 'TU AM TUONG', 'TU QUAN AO', 'CLOSET', 'WARDROBE']

  - code: dressing_room
    vi: Phòng thay đồ
    aliases:
      [
        'PHONG THAY DO',
        'P.THAY DO',
        'THAY DO',
        'PHONG THAY DO RIENG',
        'DRESSING',
        'DRESSING ROOM',
