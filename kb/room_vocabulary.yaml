  - code: elevator
    vi: Thang máy
    # Tách khỏi `core` ngày 22/09/2026 (T65). Giếng thang máy là một ô CHỒNG KHÍT qua mọi tầng,
    # không ai đi xuyên, không có cửa sổ, và kích thước của nó do tải cabin quyết — bốn tính chất
    # mà lõi thang bộ không có cái nào. Một mã chung cho hai thứ ấy là một mã không kiểm được.
    aliases: ['THANG MAY', 'THANG MAY GIA DINH', 'GIENG THANG MAY', 'LIFT', 'ELEVATOR', 'TM']

  - code: circulation
