  - code: laundry
    vi: Giặt phơi
    aliases: ['GIAT', 'GIAT PHOI', 'SAN PHOI', 'PHOI DO', 'LAUNDRY']

  - code: balcony
    vi: Ban công
    aliases: ['BAN CONG', 'BC', 'BALCONY', 'LOGGIA', 'BAN CONG KINH', 'BC KINH']

