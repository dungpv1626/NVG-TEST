  - code: study
    vi: Phòng làm việc
    aliases: ['PHONG LAM VIEC', 'LAM VIEC', 'P.LV', 'STUDY', 'OFFICE', 'PHONG DOC SACH']

  # Khác `study` ở chỗ phục vụ AI: `study` là phòng làm việc của người lớn, còn đây là chỗ
  # học của các con — thường là một góc mở kề phòng ngủ hoặc một phòng nhỏ dùng chung, và
  # tiêu chuẩn diện tích lẫn yêu cầu chiếu sáng khác hẳn. Gộp làm một thì hai ô chọn trên
  # biểu mẫu cùng sinh ra một phòng, tức là ô thứ hai không có tác dụng.
  - code: study_area
    vi: Không gian học tập
    aliases:
      [
        'KHONG GIAN HOC TAP',
        'GOC HOC TAP',
        'CHO HOC',
